site_name: 分布式系统
site_description: Distributed Systems — CourseLingo 中文讲解
docs_dir: D:/Vibe_Workspace/courselingo/courses/mit-6.5840/websrc/docs
site_dir: D:/Vibe_Workspace/courselingo/courses/mit-6.5840/site-mkdocs
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

extra_css:
  - assets/bi.css
extra_javascript:
  - assets/bi.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - extensions.bilingual

nav:
  - 首页: index.md
  - 讲座:
      - 第 1 讲 · 分布式系统导论: lectures/introduction.md
      - 第 2 讲 · 远程过程调用与线程: lectures/rpc-and-threads.md
      - 第 3 讲 · GFS：为大规模数据密集应用设计的文件系统: lectures/gfs.md
  - 论文导读:
      - MapReduce 导读: papers/mapreduce.md
      - Raft 导读: papers/raft.md
  - 术语表: glossary.md
