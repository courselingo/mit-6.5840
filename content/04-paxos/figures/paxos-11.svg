<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="fig-paxos-11-title fig-paxos-11-desc">
  <title id="fig-paxos-11-title">Multi-Paxos：一次 prepare 覆盖一段日志</title>
  <desc id="fig-paxos-11-desc">日志每个下标各是一次表决；先选一个领导者，一次 prepare 覆盖后面很多个值，省掉的是重复的阶段一。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Multi-Paxos：一次 prepare 覆盖一段日志</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">日志的每个下标</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">各是一次表决</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">每个值都走两个阶段</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">这样太贵</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="86" font-size="12" fill="#b45309" text-anchor="middle">现实做法：先选领导者</text>
  <text x="625" y="104" font-size="12" fill="#b45309" text-anchor="middle">让它统一协调</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="165" font-size="12" fill="#b45309" text-anchor="middle">领导者一次 prepare</text>
  <text x="135" y="183" font-size="12" fill="#b45309" text-anchor="middle">覆盖后面很多个值</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="165" font-size="12" fill="#166534" text-anchor="middle">之后的值只花一轮</text>
  <text x="380" y="183" font-size="12" fill="#166534" text-anchor="middle">省掉重复的阶段一</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">选举、失效检测、超时</text>
  <text x="625" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">又是各自一摊工作</text>
  <rect x="25" y="222" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="244" font-size="12" fill="#b45309" text-anchor="middle">落后的副本靠日志追上</text>
  <text x="135" y="262" font-size="12" fill="#b45309" text-anchor="middle">空间只留尾部加快照</text>
  <rect x="270" y="222" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="244" font-size="12" fill="#6b21a8" text-anchor="middle">反复用在一条日志上</text>
  <text x="380" y="262" font-size="12" fill="#6b21a8" text-anchor="middle">这就是 Multi-Paxos</text>
  <rect x="515" y="222" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="244" font-size="12" fill="#6b21a8" text-anchor="middle">安全性一点没变</text>
  <text x="625" y="262" font-size="12" fill="#6b21a8" text-anchor="middle">仍然是多数派相交</text>
</svg>
