<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250"
     role="img" aria-labelledby="fig-paxos-1-title fig-paxos-1-desc">
  <title id="fig-paxos-1-title">一条回执丢失：提议者与集群看到两个事实</title>
  <desc id="fig-paxos-1-desc">三台接受者里 S1 与 S2 都接受了值 X，但 S2 的回执在回程丢失，提议者只收到一条 accept_ok，无从判断 X 已被多数派定案。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="250" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一条回执丢失：提议者与集群看到两个事实</text>

  <path d="M135,123 L135,132" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,123 L380,132" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M625,123 L625,132" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="710" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">提议者 P：把 accept(n=1, 值 X) 发给三台接受者</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">只收回 1 条 accept_ok，够不够定案它无从判断</text>

  <rect x="25" y="143" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="165" font-size="12" fill="#1e40af" text-anchor="middle">接受者 S1：接受了 1/X</text>
  <text x="135" y="183" font-size="12" fill="#1e40af" text-anchor="middle">回执送达</text>

  <rect x="270" y="143" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="165" font-size="12" fill="#1e40af" text-anchor="middle">接受者 S2：也接受 1/X</text>
  <text x="380" y="183" font-size="12" fill="#1e40af" text-anchor="middle">回执在回程丢失</text>

  <rect x="515" y="143" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="165" font-size="12" fill="#1e40af" text-anchor="middle">接受者 S3：没有收到</text>
  <text x="625" y="183" font-size="12" fill="#1e40af" text-anchor="middle">它对此毫无记录</text>

  <text x="380" y="223" font-size="12" fill="#64748b" text-anchor="middle">S1 与 S2 已构成多数派，X 事实上被定案；提议者只看到 1 条回执</text>
</svg>
