<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-paxos-19-title fig-paxos-19-desc">
  <title id="fig-paxos-19-title">安全性不靠权威：靠每一轮都逃不开知情人</title>
  <desc id="fig-paxos-19-desc">Paxos 不靠某台机器的权威，靠的是每次新投票都逃不开上一轮的知情者，所以提议者必须先问一圈。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">安全性不靠权威：靠每一轮都逃不开知情人</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">不靠某台机器的权威</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">靠的是一次次新投票</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">每次新投票都逃不开</text>
  <text x="380" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">上一轮的知情者</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="86" font-size="12" fill="#b45309" text-anchor="middle">所以提议者必须先问一圈</text>
  <text x="625" y="104" font-size="12" fill="#b45309" text-anchor="middle">再决定提什么</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">它可能永远不知道</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">某个值到底定案没有</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="165" font-size="12" fill="#9d174d" text-anchor="middle">但它必须保守</text>
  <text x="380" y="183" font-size="12" fill="#9d174d" text-anchor="middle">有证据就当已定案</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">这套逻辑不依赖时钟</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">也不依赖谁更权威</text>
</svg>
