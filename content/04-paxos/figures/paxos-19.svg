<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 415" width="756" height="415" role="img" aria-labelledby="fig-paxos-19-title fig-paxos-19-desc">
  <title id="fig-paxos-19-title">安全性不靠权威：靠每一轮都逃不开知情人</title>
  <desc id="fig-paxos-19-desc">Paxos 不靠某台机器的权威，靠的是每次新投票都逃不开上一轮的知情者，所以提议者必须先问一圈。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="415" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">安全性不靠权威：靠每一轮都逃不开知情人</text>

  <rect x="265" y="66" width="230" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="25" y="252" width="300" height="140" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="435" y="252" width="300" height="140" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="280" y="86" width="200" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="108" font-size="12" fill="#1e40af" text-anchor="middle">不靠某台机器的权威</text>
  <text x="380" y="126" font-size="12" fill="#1e40af" text-anchor="middle">靠的是一次次新投票</text>
  <text x="380" y="144" font-size="12" fill="#1e40af" text-anchor="middle">这套逻辑不依赖时钟</text>
  <text x="380" y="162" font-size="12" fill="#1e40af" text-anchor="middle">也不依赖谁更权威</text>
  <rect x="40" y="272" width="270" height="90" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="175" y="294" font-size="12" fill="#9d174d" text-anchor="middle">每次新投票都逃不开</text>
  <text x="175" y="312" font-size="12" fill="#9d174d" text-anchor="middle">上一轮的知情者</text>
  <text x="175" y="330" font-size="12" fill="#9d174d" text-anchor="middle">它可能永远不知道</text>
  <text x="175" y="348" font-size="12" fill="#9d174d" text-anchor="middle">某个值到底定案没有</text>
  <rect x="450" y="272" width="270" height="90" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="585" y="294" font-size="12" fill="#166534" text-anchor="middle">所以提议者必须先问一圈</text>
  <text x="585" y="312" font-size="12" fill="#166534" text-anchor="middle">再决定提什么</text>
  <text x="585" y="330" font-size="12" fill="#166534" text-anchor="middle">但它必须保守</text>
  <text x="585" y="348" font-size="12" fill="#166534" text-anchor="middle">有证据就当已定案</text>
  <path d="M300,181 C270,230 175,220 175,261" fill="none" stroke="#ec4899" marker-end="url(#arrow-pink)"/>
  <path d="M315,317 L439,317" fill="none" stroke="#a855f7" marker-end="url(#arrow-purple)"/>
  <path d="M490,267 C550,220 500,140 491,140" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
</svg>
