<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-paxos-5-title fig-paxos-5-desc">
  <title id="fig-paxos-5-title">脑裂：断成两半后两侧各有一个主节点</title>
  <desc id="fig-paxos-5-desc">断成两半后 C1 与 S1 在一侧继续写入，C2 转投 S2，于是两侧各有一个主节点，两边决定互相冲突。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">脑裂：断成两半后两侧各有一个主节点</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">C1 与 S1 在一侧</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">照旧向 S1 写入</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">S1 认为对面已死</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">继续当自己是主</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="86" font-size="12" fill="#1e40af" text-anchor="middle">C2 联系不上 S1</text>
  <text x="625" y="104" font-size="12" fill="#1e40af" text-anchor="middle">于是转投 S2</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">S2 也当自己是主</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">接受 C2 的写入</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">同一个角色出现两份</text>
  <text x="380" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">各自都在做决定</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="165" font-size="12" fill="#9d174d" text-anchor="middle">两边的决定互相冲突</text>
  <text x="625" y="183" font-size="12" fill="#9d174d" text-anchor="middle">这就是脑裂</text>
</svg>
