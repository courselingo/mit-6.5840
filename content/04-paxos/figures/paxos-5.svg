<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 349" width="756" height="349" role="img" aria-labelledby="fig-paxos-5-title fig-paxos-5-desc">
  <title id="fig-paxos-5-title">脑裂：断成两半后两侧各有一个主节点</title>
  <desc id="fig-paxos-5-desc">断成两半后 C1 与 S1 在一侧继续写入，C2 转投 S2，于是两侧各有一个主节点，两边决定互相冲突。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="349" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">脑裂：断成两半后两侧各有一个主节点</text>

  <rect x="25" y="52" width="310" height="197" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="425" y="52" width="310" height="197" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="180" y="78" font-size="12" fill="#64748b" text-anchor="middle">分区 A</text>
  <rect x="40" y="96" width="280" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="180" y="118" font-size="12" fill="#1e40af" text-anchor="middle">C1 与 S1 在一侧</text>
  <text x="180" y="136" font-size="12" fill="#1e40af" text-anchor="middle">照旧向 S1 写入</text>
  <rect x="40" y="180" width="280" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="180" y="202" font-size="12" fill="#1e40af" text-anchor="middle">S1 认为对面已死</text>
  <text x="180" y="220" font-size="12" fill="#1e40af" text-anchor="middle">继续当自己是主</text>
  <text x="580" y="78" font-size="12" fill="#64748b" text-anchor="middle">分区 B</text>
  <rect x="440" y="96" width="280" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="580" y="118" font-size="12" fill="#1e40af" text-anchor="middle">C2 联系不上 S1</text>
  <text x="580" y="136" font-size="12" fill="#1e40af" text-anchor="middle">于是转投 S2</text>
  <rect x="440" y="180" width="280" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="580" y="202" font-size="12" fill="#1e40af" text-anchor="middle">S2 也当自己是主</text>
  <text x="580" y="220" font-size="12" fill="#1e40af" text-anchor="middle">接受 C2 的写入</text>
  <path d="M366,104 C372,114 374,118 380,126" fill="none" stroke="#ef4444" stroke-width="2"/>
  <path d="M388,132 C394,140 396,144 402,154" fill="none" stroke="#ef4444" stroke-width="2"/>
  <rect x="25" y="272" width="710" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="294" font-size="12" fill="#9d174d" text-anchor="middle">同一个角色出现两份，各自都在做决定</text>
  <text x="380" y="312" font-size="12" fill="#9d174d" text-anchor="middle">两边的决定互相冲突，这就是脑裂</text>
</svg>
