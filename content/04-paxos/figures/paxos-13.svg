<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 433" width="756" height="433" role="img" aria-labelledby="fig-paxos-13-title fig-paxos-13-desc">
  <title id="fig-paxos-13-title">阶段一的两条分支：什么时候能用自己想提的值</title>
  <desc id="fig-paxos-13-desc">只要有一台回执报过值，提议者就必须改用编号最大的那个；只有全部回执都说没接受过，才能提自己想提的值。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="433" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">阶段一的两条分支：什么时候能用自己想提的值</text>

  <rect x="250" y="52" width="260" height="74" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="265" y="62" width="230" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="84" font-size="12" fill="#b45309" text-anchor="middle">阶段一：问一圈回执</text>
  <text x="380" y="102" font-size="12" fill="#b45309" text-anchor="middle">你们接受过什么</text>
  <rect x="25" y="180" width="330" height="161" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="405" y="180" width="330" height="125" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="40" y="200" width="300" height="126" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="190" y="222" font-size="12" fill="#9d174d" text-anchor="middle">回执里有一台报过值</text>
  <text x="190" y="240" font-size="12" fill="#9d174d" text-anchor="middle">就必须改用最大的那个值</text>
  <text x="190" y="258" font-size="12" fill="#9d174d" text-anchor="middle">那个值可能早已定案</text>
  <text x="190" y="276" font-size="12" fill="#9d174d" text-anchor="middle">哪怕只有一台这么说</text>
  <text x="190" y="294" font-size="12" fill="#9d174d" text-anchor="middle">提议者不能赌它没定案</text>
  <text x="190" y="312" font-size="12" fill="#9d174d" text-anchor="middle">只能当作已经定案</text>
  <rect x="420" y="200" width="300" height="90" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="570" y="222" font-size="12" fill="#166534" text-anchor="middle">所有回执都说没接受过</text>
  <text x="570" y="240" font-size="12" fill="#166534" text-anchor="middle">才可以用自己的值</text>
  <text x="570" y="258" font-size="12" fill="#166534" text-anchor="middle">这是唯一能用自己值的</text>
  <text x="570" y="276" font-size="12" fill="#166534" text-anchor="middle">其余一律放弃</text>
  <path d="M370,121 C340,170 190,160 190,189" fill="none" stroke="#ec4899" marker-end="url(#arrow-pink)"/>
  <path d="M390,121 C420,170 570,160 570,189" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <rect x="25" y="356" width="710" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="378" font-size="12" fill="#6b21a8" text-anchor="middle">保守的代价是白放弃一次</text>
  <text x="380" y="396" font-size="12" fill="#6b21a8" text-anchor="middle">换来的是不篡改定案</text>
</svg>
