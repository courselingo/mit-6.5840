<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-paxos-13-title fig-paxos-13-desc">
  <title id="fig-paxos-13-title">阶段一的两条分支：什么时候能用自己想提的值</title>
  <desc id="fig-paxos-13-desc">只要有一台回执报过值，提议者就必须改用编号最大的那个；只有全部回执都说没接受过，才能提自己想提的值。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">阶段一的两条分支：什么时候能用自己想提的值</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">回执里有一台报过值</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">就必须改用最大的那个值</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">那个值可能早已定案</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">哪怕只有一台这么说</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="86" font-size="12" fill="#9d174d" text-anchor="middle">提议者不能赌它没定案</text>
  <text x="625" y="104" font-size="12" fill="#9d174d" text-anchor="middle">只能当作已经定案</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="165" font-size="12" fill="#166534" text-anchor="middle">所有回执都说没接受过</text>
  <text x="135" y="183" font-size="12" fill="#166534" text-anchor="middle">才可以用自己的值</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="165" font-size="12" fill="#b45309" text-anchor="middle">这是唯一能用自己值的</text>
  <text x="380" y="183" font-size="12" fill="#b45309" text-anchor="middle">其余一律放弃</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">保守的代价是白放弃一次</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">换来的是不篡改定案</text>
</svg>
