<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 363" width="756" height="363" role="img" aria-labelledby="fig-paxos-12-title fig-paxos-12-desc">
  <title id="fig-paxos-12-title">活性只被弱地保证：两个提议者互相顶编号</title>
  <desc id="fig-paxos-12-desc">A 提编号 5，B 用 6 顶掉它，A 再用 7 顶回去，于是谁都拿不到多数派，进展被拖住但安全性没破。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="363" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">活性只被弱地保证：两个提议者互相顶编号</text>

  <rect x="25" y="76" width="310" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="425" y="76" width="310" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="40" y="98" width="280" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="180" y="120" font-size="12" fill="#1e40af" text-anchor="middle">提议者 A 提编号 5</text>
  <text x="180" y="138" font-size="12" fill="#1e40af" text-anchor="middle">B 用编号 6 顶掉它</text>
  <rect x="440" y="98" width="280" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="580" y="120" font-size="12" fill="#1e40af" text-anchor="middle">A 改用编号 7</text>
  <text x="580" y="138" font-size="12" fill="#1e40af" text-anchor="middle">再顶回去</text>
  <path d="M325,110 C365,110 385,125 429,125" fill="none" stroke="#f59e0b" marker-end="url(#arrow-orange)"/>
  <path d="M435,142 C430,200 360,140 331,140" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <rect x="25" y="250" width="341" height="90" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.5" y="272" font-size="12" fill="#9d174d" text-anchor="middle">两边都用更大的编号</text>
  <text x="195.5" y="290" font-size="12" fill="#9d174d" text-anchor="middle">谁都不肯让</text>
  <text x="195.5" y="308" font-size="12" fill="#9d174d" text-anchor="middle">于是谁都拿不到多数派</text>
  <text x="195.5" y="326" font-size="12" fill="#9d174d" text-anchor="middle">进展被拖住</text>
  <rect x="394" y="250" width="341" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="564.5" y="272" font-size="12" fill="#b45309" text-anchor="middle">但安全性没有破</text>
  <text x="564.5" y="290" font-size="12" fill="#b45309" text-anchor="middle">只是没人能推进</text>
  <text x="564.5" y="308" font-size="12" fill="#b45309" text-anchor="middle">笔记只承诺</text>
  <text x="564.5" y="326" font-size="12" fill="#b45309" text-anchor="middle">多数派能通信时最终一致</text>
</svg>
