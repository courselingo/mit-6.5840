<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 142" width="760" height="142" role="img" aria-labelledby="fig-paxos-4-title fig-paxos-4-desc">
  <title id="fig-paxos-4-title">单点协调者的困境：换主本身要大家同意</title>
  <desc id="fig-paxos-4-desc">GFS 协调者不回应时命名空间操作全停；「再放一台」解决不了换谁、何时换这个要多数派同意的决定。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="142" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">单点协调者的困境：换主本身要大家同意</text>

  <rect x="25" y="64" width="158" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="104" y="86" font-size="12" fill="#1e40af" text-anchor="middle">GFS 协调者</text>
  <text x="104" y="104" font-size="12" fill="#1e40af" text-anchor="middle">唯一保存命名空间</text>
  <rect x="209" y="64" width="158" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="288" y="86" font-size="12" fill="#9d174d" text-anchor="middle">它不回应</text>
  <text x="288" y="104" font-size="12" fill="#9d174d" text-anchor="middle">操作全停在那</text>
  <rect x="393" y="64" width="158" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="86" font-size="12" fill="#b45309" text-anchor="middle">直觉：再放一台</text>
  <text x="472" y="104" font-size="12" fill="#b45309" text-anchor="middle">坏了就换一台</text>
  <rect x="577" y="64" width="158" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="656" y="86" font-size="12" fill="#166534" text-anchor="middle">但「换谁」</text>
  <text x="656" y="104" font-size="12" fill="#166534" text-anchor="middle">要大家一起同意</text>

  <path d="M188,91 L198,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,91 L382,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M556,91 L566,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
