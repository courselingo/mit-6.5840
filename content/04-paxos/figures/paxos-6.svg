<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-paxos-6-title fig-paxos-6-desc">
  <title id="fig-paxos-6-title">至多一个分区能凑出多数派</title>
  <desc id="fig-paxos-6-desc">集群断成 3 台与 2 台两半：只有 3 台那侧凑得齐 3 票可以决定，2 台那侧只能停摆，因为分母永远是全部 5 台。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">至多一个分区能凑出多数派</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">断成两半：一边 3 台</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">3 台里凑齐 3 票</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="86" font-size="12" fill="#166534" text-anchor="middle">这一侧可以决定</text>
  <text x="380" y="104" font-size="12" fill="#166534" text-anchor="middle">继续对外服务</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="86" font-size="12" fill="#166534" text-anchor="middle">多数派在大的那一边</text>
  <text x="625" y="104" font-size="12" fill="#166534" text-anchor="middle">决定只有一个</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">另一边只剩 2 台</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">分母仍是全部 5 台</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="165" font-size="12" fill="#9d174d" text-anchor="middle">2 台凑不齐 3 票</text>
  <text x="380" y="183" font-size="12" fill="#9d174d" text-anchor="middle">做不了任何决定</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="165" font-size="12" fill="#9d174d" text-anchor="middle">这一侧只能停摆</text>
  <text x="625" y="183" font-size="12" fill="#9d174d" text-anchor="middle">不会给出错误答案</text>
</svg>
