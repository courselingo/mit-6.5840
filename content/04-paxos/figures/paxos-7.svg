<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="fig-paxos-7-title fig-paxos-7-desc">
  <title id="fig-paxos-7-title">阶段一收回的证据：只能改用 X</title>
  <desc id="fig-paxos-7-desc">S1 提编号 1 的值 X 后崩溃；S2 先发 prepare(2)，S3 的回执带回 X，于是它只能提 X。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">阶段一收回的证据：只能改用 X</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">S1 提编号 1、值 X</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">accept 还没发完就崩了</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="86" font-size="12" fill="#166534" text-anchor="middle">S3 已经收下 X</text>
  <text x="380" y="104" font-size="12" fill="#166534" text-anchor="middle">X 其实已被多数派定案</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="86" font-size="12" fill="#9d174d" text-anchor="middle">但活着的机器里</text>
  <text x="625" y="104" font-size="12" fill="#9d174d" text-anchor="middle">没人能自己断定</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="165" font-size="12" fill="#b45309" text-anchor="middle">S2 想提自己的 Y</text>
  <text x="135" y="183" font-size="12" fill="#b45309" text-anchor="middle">编号取 2</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="165" font-size="12" fill="#b45309" text-anchor="middle">它先发 prepare(2)</text>
  <text x="380" y="183" font-size="12" fill="#b45309" text-anchor="middle">问遍所有接受者</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">S3 的回执带回 (1, X)</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">它记得的最新事实</text>
  <rect x="25" y="222" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="244" font-size="12" fill="#166534" text-anchor="middle">于是 S2 放弃 Y</text>
  <text x="135" y="262" font-size="12" fill="#166534" text-anchor="middle">第二阶段只能提 X</text>
  <rect x="270" y="222" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="244" font-size="12" fill="#6b21a8" text-anchor="middle">安全性靠这条回执</text>
  <text x="380" y="262" font-size="12" fill="#6b21a8" text-anchor="middle">提议者自己并不知情</text>
  <rect x="515" y="222" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="244" font-size="12" fill="#6b21a8" text-anchor="middle">多数派相交保证它</text>
  <text x="625" y="262" font-size="12" fill="#6b21a8" text-anchor="middle">躲不开上一轮的知情人</text>
</svg>
