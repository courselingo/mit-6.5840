<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 177" width="756" height="177" role="img" aria-labelledby="fig-paxos-14-title fig-paxos-14-desc">
  <title id="fig-paxos-14-title">凑不齐多数派就停下，修复后接着走</title>
  <desc id="fig-paxos-14-desc">多数派能通信时协议继续推进；凑不齐时决定做不成，少数派一侧停止服务，修复之后从停下的地方继续。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="177" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">凑不齐多数派就停下，修复后接着走</text>

  <rect x="25" y="64" width="218" height="90" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="134" y="86" font-size="12" fill="#166534" text-anchor="middle">多数派能通信</text>
  <text x="134" y="104" font-size="12" fill="#166534" text-anchor="middle">协议继续推进</text>
  <text x="134" y="122" font-size="12" fill="#166534" text-anchor="middle">整站断电也扛得住</text>
  <text x="134" y="140" font-size="12" fill="#166534" text-anchor="middle">状态已经落了盘</text>
  <rect x="271" y="64" width="218" height="90" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">凑不齐多数派</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">决定做不成</text>
  <text x="380" y="122" font-size="12" fill="#9d174d" text-anchor="middle">少数派那一侧停止服务</text>
  <text x="380" y="140" font-size="12" fill="#9d174d" text-anchor="middle">不是给出错误答案</text>
  <rect x="517" y="64" width="218" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="626" y="86" font-size="12" fill="#b45309" text-anchor="middle">网络修复之后</text>
  <text x="626" y="104" font-size="12" fill="#b45309" text-anchor="middle">从停下的地方继续</text>
  <text x="626" y="122" font-size="12" fill="#b45309" text-anchor="middle">落后过的那一侧</text>
  <text x="626" y="140" font-size="12" fill="#b45309" text-anchor="middle">靠日志把课补回来</text>
  <path d="M248,109 L260,109" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M494,109 L506,109" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
