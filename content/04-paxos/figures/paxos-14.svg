<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-paxos-14-title fig-paxos-14-desc">
  <title id="fig-paxos-14-title">凑不齐多数派就停下，修复后接着走</title>
  <desc id="fig-paxos-14-desc">多数派能通信时协议继续推进；凑不齐时决定做不成，少数派一侧停止服务，修复之后从停下的地方继续。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">凑不齐多数派就停下，修复后接着走</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="86" font-size="12" fill="#166534" text-anchor="middle">多数派能通信</text>
  <text x="135" y="104" font-size="12" fill="#166534" text-anchor="middle">协议继续推进</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">凑不齐多数派</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">决定做不成</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="86" font-size="12" fill="#9d174d" text-anchor="middle">少数派那一侧停止服务</text>
  <text x="625" y="104" font-size="12" fill="#9d174d" text-anchor="middle">不是给出错误答案</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="165" font-size="12" fill="#b45309" text-anchor="middle">网络修复之后</text>
  <text x="135" y="183" font-size="12" fill="#b45309" text-anchor="middle">从停下的地方继续</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="165" font-size="12" fill="#166534" text-anchor="middle">整站断电也扛得住</text>
  <text x="380" y="183" font-size="12" fill="#166534" text-anchor="middle">状态已经落了盘</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">落后过的那一侧</text>
  <text x="625" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">靠日志把课补回来</text>
</svg>
