<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 427" width="756" height="427" role="img" aria-labelledby="fig-paxos-17-title fig-paxos-17-desc">
  <title id="fig-paxos-17-title">一次定案的两个往返，以及最慢那台的位置</title>
  <desc id="fig-paxos-17-desc">阶段一与阶段二各一个往返，两个往返要串起来，再叠加多数派里最慢那台的响应时间。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="427" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次定案的两个往返，以及最慢那台的位置</text>

  <rect x="25" y="62" width="341" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.5" y="84" font-size="12" fill="#1e40af" text-anchor="middle">阶段一问一圈</text>
  <text x="195.5" y="102" font-size="12" fill="#1e40af" text-anchor="middle">你们接受过什么</text>
  <rect x="394" y="62" width="341" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="564.5" y="84" font-size="12" fill="#b45309" text-anchor="middle">阶段二请多数派</text>
  <text x="564.5" y="102" font-size="12" fill="#b45309" text-anchor="middle">接受同一个值</text>
  <path d="M371,89 L383,89" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M25,128 L735,128" fill="none" stroke="#94a3b8"/>
  <path d="M25,122 L25,134" fill="none" stroke="#94a3b8"/>
  <path d="M380,122 L380,134" fill="none" stroke="#94a3b8"/>
  <path d="M735,122 L735,134" fill="none" stroke="#94a3b8"/>
  <rect x="25" y="146" width="710" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="168" font-size="12" fill="#9d174d" text-anchor="middle">两个往返要串起来</text>
  <text x="380" y="186" font-size="12" fill="#9d174d" text-anchor="middle">延迟不是一次调用那么久</text>
  <rect x="25" y="230" width="710" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="252" font-size="12" fill="#9d174d" text-anchor="middle">再加上多数派里最慢那台</text>
  <text x="380" y="270" font-size="12" fill="#9d174d" text-anchor="middle">它决定这一轮多久结束</text>
  <rect x="25" y="314" width="710" height="90" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="336" font-size="12" fill="#6b21a8" text-anchor="middle">现实系统靠批处理</text>
  <text x="380" y="354" font-size="12" fill="#6b21a8" text-anchor="middle">把这一段压下来</text>
  <text x="380" y="372" font-size="12" fill="#6b21a8" text-anchor="middle">笔记直说它常被认为慢</text>
  <text x="380" y="390" font-size="12" fill="#6b21a8" text-anchor="middle">慢在结构里，不在实现</text>
</svg>
