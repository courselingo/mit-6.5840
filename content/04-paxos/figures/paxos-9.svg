<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-paxos-9-title fig-paxos-9-desc">
  <title id="fig-paxos-9-title">重启后忘掉接受过的值：定案被覆盖</title>
  <desc id="fig-paxos-9-desc">第一轮里 S1 与 S2 接受 X，X 定案；S2 重启忘掉它，第二轮 prepare 的多数派正是 S2 与 S3。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">重启后忘掉接受过的值：定案被覆盖</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="86" font-size="12" fill="#166534" text-anchor="middle">第一轮 S1 与 S2 接受 X</text>
  <text x="135" y="104" font-size="12" fill="#166534" text-anchor="middle">X 就此定案</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">S2 随后重启</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">磁盘上什么都没留下</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">第二轮 prepare 的多数派</text>
  <text x="625" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">正好是 S2 与 S3</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">S2 回答「我什么都没接受过」</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">它说的并不是谎话</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="165" font-size="12" fill="#9d174d" text-anchor="middle">S3 孤掌难鸣</text>
  <text x="380" y="183" font-size="12" fill="#9d174d" text-anchor="middle">只有它记得 X</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="165" font-size="12" fill="#9d174d" text-anchor="middle">新提议者提出 Y</text>
  <text x="625" y="183" font-size="12" fill="#9d174d" text-anchor="middle">已定案的 X 被覆盖</text>
</svg>
