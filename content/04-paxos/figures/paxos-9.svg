<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456"
     role="img" aria-labelledby="fig-paxos-9-title fig-paxos-9-desc">
  <title id="fig-paxos-9-title">接受者必须记住什么，以及 Multi-Paxos 省掉哪一轮</title>
  <desc id="fig-paxos-9-desc">上排：n_a、v_a 不落盘，重启后忘掉接受过的 X，而它正是两轮唯一的交集，X 唯一的活证据就没了。中排：最高编号不落盘，重启后会把本该拒绝的、更早编号（10）的 accept 收下，编号 10 的 X 因此凑成多数派而定案，随后编号 11 的另一个值 Y 又被接受并定案，同一个实例先后定案了两个不同的值。下排：Multi-Paxos 先选出领导者，一次 prepare 覆盖一段日志，省掉的是重复的阶段一，多数派表决一次没少。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="456" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">接受者必须记住什么，以及 Multi-Paxos 省掉哪一轮</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">若 n_a、v_a 不落盘：忘掉的那台正好是两轮唯一的交集</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">n_p（承诺过的最高编号）没落盘 ⇒ 安全性被破坏</text>

  <rect x="22" y="324" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="338" font-size="12" fill="#64748b" text-anchor="middle">Multi-Paxos：省掉的是重复的阶段一</text>

  <path d="M252,116 L264,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M489,116 L501,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M252,250 L264,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M489,250 L501,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="142" y="110" font-size="15" fill="#9d174d" text-anchor="middle">S2 重启，忘了 X</text>
  <text x="142" y="132" font-size="12" fill="#9d174d" text-anchor="middle">X 是它自己接受过的值</text>

  <rect x="275" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379" y="110" font-size="15" fill="#9d174d" text-anchor="middle">它是两轮唯一的交集</text>
  <text x="379" y="132" font-size="12" fill="#9d174d" text-anchor="middle">第二轮的 prepare 学不到 X</text>

  <rect x="512" y="82" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="110" font-size="15" fill="#166534" text-anchor="middle">n_a、v_a、n_p 都要落盘</text>
  <text x="616" y="132" font-size="12" fill="#166534" text-anchor="middle">重启之后必须能恢复</text>

  <rect x="38" y="216" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="142" y="244" font-size="15" fill="#9d174d" text-anchor="middle">不记得见过编号 11</text>
  <text x="142" y="266" font-size="12" fill="#9d174d" text-anchor="middle">于是收下编号 10 的 accept</text>

  <rect x="275" y="216" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379" y="244" font-size="15" fill="#9d174d" text-anchor="middle">编号 10 比 11 更早</text>
  <text x="379" y="266" font-size="12" fill="#9d174d" text-anchor="middle">Y 也定案 ⇒ 同一实例定了两个值</text>

  <rect x="512" y="216" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="244" font-size="15" fill="#166534" text-anchor="middle">它挡的是旧编号</text>
  <text x="616" y="266" font-size="12" fill="#166534" text-anchor="middle">不是记录做过什么</text>

  <rect x="38" y="350" width="328" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="202" y="378" font-size="15" fill="#1e40af" text-anchor="middle">先选出一个领导者</text>
  <text x="202" y="400" font-size="12" fill="#1e40af" text-anchor="middle">一次 prepare 覆盖后面很多个值</text>

  <rect x="394" y="350" width="328" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="558" y="378" font-size="15" fill="#6b21a8" text-anchor="middle">省掉的与没省掉的</text>
  <text x="558" y="400" font-size="12" fill="#6b21a8" text-anchor="middle">省掉重复的阶段一，多数派表决一次没少</text>
  <path d="M371,384 L383,384" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
