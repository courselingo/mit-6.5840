<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 343" width="756" height="343" role="img" aria-labelledby="fig-paxos-16-title fig-paxos-16-desc">
  <title id="fig-paxos-16-title">2f+1 台容忍 f 台，门槛固定也省掉等待</title>
  <desc id="fig-paxos-16-desc">三台容忍一台、五台容忍两台，两份做不到；门槛一旦固定，提议者不必等最慢那台就能往下走。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="343" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">2f+1 台容忍 f 台，门槛固定也省掉等待</text>

  <rect x="25" y="62" width="341" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.5" y="84" font-size="12" fill="#166534" text-anchor="middle">三台副本</text>
  <text x="195.5" y="102" font-size="12" fill="#166534" text-anchor="middle">容忍一台故障</text>
  <rect x="394" y="62" width="341" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="564.5" y="84" font-size="12" fill="#166534" text-anchor="middle">五台副本</text>
  <text x="564.5" y="102" font-size="12" fill="#166534" text-anchor="middle">容忍两台故障</text>
  <rect x="25" y="146" width="341" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.5" y="168" font-size="12" fill="#9d174d" text-anchor="middle">两份副本做不到</text>
  <text x="195.5" y="186" font-size="12" fill="#9d174d" text-anchor="middle">坏一台还不脑裂</text>
  <rect x="394" y="146" width="341" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="564.5" y="168" font-size="12" fill="#166534" text-anchor="middle">故障数 f 对应 2f+1 台</text>
  <text x="564.5" y="186" font-size="12" fill="#166534" text-anchor="middle">门槛由多数派定下</text>
  <rect x="25" y="230" width="710" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="252" font-size="12" fill="#b45309" text-anchor="middle">门槛固定带来第二个好处</text>
  <text x="380" y="270" font-size="12" fill="#b45309" text-anchor="middle">不必等最慢那台</text>
  <text x="380" y="288" font-size="12" fill="#b45309" text-anchor="middle">少数慢节点</text>
  <text x="380" y="306" font-size="12" fill="#b45309" text-anchor="middle">不再拖住所有人</text>
</svg>
