<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382"
     role="img" aria-labelledby="fig-paxos-3-title fig-paxos-3-desc">
  <title id="fig-paxos-3-title">两次投票的交集只有一台，所以必须先问一圈</title>
  <desc id="fig-paxos-3-desc">第一轮的三票是 S1、S2、S3，第二轮的三票是 S3、S4、S5，两轮的交集只有 S3；它就是唯一知道上一轮结果的那台，所以提议者的第一步必须是先问一圈。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="382" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两次投票的交集只有一台，所以必须先问一圈</text>

  <rect x="22" y="56" width="716" height="170" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">第一轮选 S1、S2、S3，第二轮选 S3、S4、S5</text>

  <rect x="22" y="250" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="264" font-size="12" fill="#64748b" text-anchor="middle">于是第一步只能是先问一圈</text>

  <rect x="38" y="82" width="114" height="50" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="95" y="111" font-size="12" fill="#6b21a8" text-anchor="middle">S1</text>

  <rect x="180" y="82" width="114" height="50" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="237" y="111" font-size="12" fill="#6b21a8" text-anchor="middle">S2</text>

  <rect x="322" y="82" width="114" height="50" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379" y="111" font-size="12" fill="#9d174d" text-anchor="middle">S3</text>

  <rect x="464" y="82" width="114" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="521" y="111" font-size="12" fill="#64748b" text-anchor="middle">S4</text>

  <rect x="606" y="82" width="114" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="663" y="111" font-size="12" fill="#64748b" text-anchor="middle">S5</text>

  <rect x="38" y="160" width="114" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="95" y="189" font-size="12" fill="#64748b" text-anchor="middle">S1</text>

  <rect x="180" y="160" width="114" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="237" y="189" font-size="12" fill="#64748b" text-anchor="middle">S2</text>

  <rect x="322" y="160" width="114" height="50" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379" y="189" font-size="12" fill="#9d174d" text-anchor="middle">S3</text>

  <rect x="464" y="160" width="114" height="50" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="521" y="189" font-size="12" fill="#6b21a8" text-anchor="middle">S4</text>

  <rect x="606" y="160" width="114" height="50" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="663" y="189" font-size="12" fill="#6b21a8" text-anchor="middle">S5</text>

  <rect x="38" y="276" width="684" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="304" font-size="15" fill="#b45309" text-anchor="middle">先问一圈不是可选的步骤</text>
  <text x="380" y="326" font-size="12" fill="#b45309" text-anchor="middle">提议者可能永远不知道上一轮定案没有，但必须假设它已经定案</text>
</svg>
