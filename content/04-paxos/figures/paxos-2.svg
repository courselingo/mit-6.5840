<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408"
     role="img" aria-labelledby="fig-paxos-2-title fig-paxos-2-desc">
  <title id="fig-paxos-2-title">两个阶段的分工：阶段一探知，阶段二定案</title>
  <desc id="fig-paxos-2-desc">左边是提议者的动作、右边是接受者的反应。阶段一只问对方接受过什么，提议者据此把值定成回执里编号最大的那个，阶段二才请多数派接受这个值。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="408" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两个阶段的分工：阶段一探知，阶段二定案</text>

  <path d="M370,91 L384,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M370,170 L384,170" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M370,249 L384,249" fill="none" stroke="#ef4444" marker-end="url(#arrow-red)"/>
  <path d="M370,328 L384,328" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="340" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="86" font-size="12" fill="#1e40af" text-anchor="middle">提议者：先挑一个比所见都大的编号 n</text>
  <text x="195" y="104" font-size="12" fill="#1e40af" text-anchor="middle">此时它还不知道有没有值已定案</text>

  <rect x="395" y="64" width="340" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="565" y="86" font-size="12" fill="#166534" text-anchor="middle">接受者：记住见过的最高编号 n_p</text>
  <text x="565" y="104" font-size="12" fill="#166534" text-anchor="middle">以及接受过的最高编号 n_a 与值 v_a</text>

  <rect x="25" y="143" width="340" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="165" font-size="12" fill="#1e40af" text-anchor="middle">阶段一 prepare(n)：只问「你接受过什么」</text>
  <text x="195" y="183" font-size="12" fill="#1e40af" text-anchor="middle">它是在探知，不是在下命令</text>

  <rect x="395" y="143" width="340" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="565" y="165" font-size="12" fill="#166534" text-anchor="middle">回 prepare_ok(n, n_a, v_a)</text>
  <text x="565" y="183" font-size="12" fill="#166534" text-anchor="middle">附带它记得的最新一次接受</text>

  <rect x="25" y="222" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195" y="244" font-size="12" fill="#9d174d" text-anchor="middle">先把值定下来：v′ 取回执里编号最大的 v_a</text>
  <text x="195" y="262" font-size="12" fill="#9d174d" text-anchor="middle">只有全都没接受过，才用自己的值</text>

  <rect x="395" y="222" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="565" y="244" font-size="12" fill="#9d174d" text-anchor="middle">这是必须先探知的那一步</text>
  <text x="565" y="262" font-size="12" fill="#9d174d" text-anchor="middle">否则可能推翻已经定案的值</text>

  <rect x="25" y="301" width="340" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="195" y="323" font-size="12" fill="#6b21a8" text-anchor="middle">阶段二 accept(n, v′)：请多数派接受它</text>
  <text x="195" y="341" font-size="12" fill="#6b21a8" text-anchor="middle">多数派 accept_ok，值就此定案</text>

  <rect x="395" y="301" width="340" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="565" y="323" font-size="12" fill="#6b21a8" text-anchor="middle">然后广播 decided(v′)</text>
  <text x="565" y="341" font-size="12" fill="#6b21a8" text-anchor="middle">其余机器据此得知结果</text>

  <text x="380" y="381" font-size="12" fill="#64748b" text-anchor="middle">阶段一不是加锁，它唯一的任务是把可能已经定案的值捞回来</text>
</svg>
