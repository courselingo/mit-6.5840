<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 315" width="760" height="315"
     role="img" aria-labelledby="fig-raft-9-title fig-raft-9-desc">
  <title id="fig-raft-9-title">投票限制：日志不如自己的候选者拿不到票</title>
  <desc id="fig-raft-9-desc">五个节点里任意两条多数派必然相交（比如节点 1、2、3 与节点 3、4、5 共有一个节点），所以投票者拒绝日志更旧的候选者，新领导者上台时就已经含有全部已提交条目。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="315" fill="#ffffff"/>

  <text x="380.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">投票限制：日志不如自己的候选者拿不到票</text>

  <rect x="23" y="64" width="122" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="84.0" y="86.2" font-size="12" fill="#166534" text-anchor="middle">节点 1</text>
  <rect x="171" y="64" width="122" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="232.0" y="86.2" font-size="12" fill="#166534" text-anchor="middle">节点 2</text>
  <rect x="319" y="64" width="122" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380.0" y="86.2" font-size="12" fill="#166534" text-anchor="middle">节点 3</text>
  <rect x="467" y="64" width="122" height="36" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="528.0" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">节点 4</text>
  <rect x="615" y="64" width="122" height="36" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="676.0" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">节点 5</text>
  <path d="M380,100 L380,128" fill="none" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="23" y="128" width="345" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.5" y="156" font-size="15" fill="#166534" text-anchor="middle">多数派 A：节点 1、2、3</text>
  <text x="195.5" y="178" font-size="12" fill="#166534" text-anchor="middle">任何已提交的条目必定落在某个多数派之上</text>
  <rect x="394" y="128" width="345" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="566.5" y="156" font-size="15" fill="#6b21a8" text-anchor="middle">多数派 B：节点 3、4、5</text>
  <text x="566.5" y="178" font-size="12" fill="#6b21a8" text-anchor="middle">两个多数派必然相交，新领导者躲不开旧条目</text>
  <rect x="22" y="224" width="716" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380.0" y="252" font-size="15" fill="#b45309" text-anchor="middle">所以投票者拒绝把票投给日志更旧的候选者</text>
  <text x="380.0" y="274" font-size="12" fill="#b45309" text-anchor="middle">先比最后一条的任期，任期相同再比日志长度；新领导者上台那一刻已含全部已提交条目</text>
</svg>
