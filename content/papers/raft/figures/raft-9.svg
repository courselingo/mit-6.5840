<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-raft-9-title fig-raft-9-desc">
  <title id="fig-raft-9-title">投票限制：日志不如自己的候选者拿不到票</title>
  <desc id="fig-raft-9-desc">候选者要拿到多数票，而两个多数派必然相交，所以投票者拒绝日志更旧的候选者，新领导者必定含有已提交条目。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">投票限制：日志不如自己的候选者拿不到票</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">候选者要当选</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">必须拿到多数派的票</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">任何已提交的条目</text>
  <text x="380" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">必定在某个多数派之上</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">两个多数派必然相交</text>
  <text x="625" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">于是新领导者躲不开旧条目</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="165" font-size="12" fill="#b45309" text-anchor="middle">所以投票者拒绝</text>
  <text x="135" y="183" font-size="12" fill="#b45309" text-anchor="middle">投给日志更旧的候选者</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="165" font-size="12" fill="#b45309" text-anchor="middle">先比最后一条的任期</text>
  <text x="380" y="183" font-size="12" fill="#b45309" text-anchor="middle">任期相同就比日志长度</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">新领导者上台那一刻</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">已经含有全部已提交条目</text>
</svg>
