<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264"
     role="img" aria-labelledby="fig-raft-6-title fig-raft-6-desc">
  <title id="fig-raft-6-title">把共识拆成三块，每块都能单独讲明白</title>
  <desc id="fig-raft-6-desc">共识被拆成领导者选举、日志复制与安全性三块，每一块都能单独讲清、单独推理；故障模型一点没有放松，节点崩溃、网络丢包乱序照旧。故障模型与 Paxos 相同这一步是我们的归纳，论文没有把两者的故障模型并排比较。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="264" fill="#ffffff"/>

  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把共识拆成三块，每块都能单独讲明白</text>

  <rect x="23" y="64" width="714" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="39" y="88" font-size="12" fill="#1e293b" text-anchor="start">共识：拆成能相对独立理解的三块</text>
  <rect x="39" y="100" width="210" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="144.0" y="128" font-size="15" fill="#1e40af" text-anchor="middle">领导者选举</text>
  <text x="144.0" y="150" font-size="12" fill="#1e40af" text-anchor="middle">原领导者失效后选出新的</text>
  <rect x="275" y="100" width="210" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380.0" y="128" font-size="15" fill="#b45309" text-anchor="middle">日志复制</text>
  <text x="380.0" y="150" font-size="12" fill="#b45309" text-anchor="middle">接收命令并复制给其他节点</text>
  <rect x="511" y="100" width="210" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="616.0" y="128" font-size="15" fill="#6b21a8" text-anchor="middle">安全性</text>
  <text x="616.0" y="150" font-size="12" fill="#6b21a8" text-anchor="middle">保证状态机之间的安全性质</text>
  <text x="380" y="212" font-size="11" fill="#1e293b" text-anchor="middle">三块能分开讲、分开推理，这是这个设计最大的结构特征</text>
  <text x="380" y="238" font-size="10" fill="#64748b" text-anchor="middle">故障模型没有放松：节点崩溃、网络会丢包会重复会乱序，甚至出现网络分区（与 Paxos 相同这一步是我们的归纳，论文未并排比较）</text>
</svg>
