<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-raft-12-title fig-raft-12-desc">
  <title id="fig-raft-12-title">成员变更不能直接切，联合共识之外还有三处细节</title>
  <desc id="fig-raft-12-desc">上排：不存在所有节点同时切换配置这回事，节点只能一个一个切，切换过程中可能冒出两个多数派、同一任期选出两个领导者，所以必须两阶段，先进入同时包含新旧配置的联合共识。下排三处细节：新节点先以非投票成员追日志、领导者不在新配置里就要在提交后退位、被移出的节点要压住它的拉票。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">成员变更不能直接切，联合共识之外还有三处细节</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">为什么必须两阶段</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">缺一个都会出问题的三处细节</text>

  <rect x="38" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="142" y="110" font-size="15" fill="#9d174d" text-anchor="middle">没有同时切换这回事</text>
  <text x="142" y="132" font-size="12" fill="#9d174d" text-anchor="middle">节点只能一个一个切</text>

  <rect x="275" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379" y="110" font-size="15" fill="#9d174d" text-anchor="middle">可能冒出两个多数派</text>
  <text x="379" y="132" font-size="12" fill="#9d174d" text-anchor="middle">同一任期选出两个领导者</text>

  <rect x="512" y="82" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="110" font-size="15" fill="#166534" text-anchor="middle">所以先进入联合共识</text>
  <text x="616" y="132" font-size="12" fill="#166534" text-anchor="middle">投票与提交要两套配置各自多数派</text>

  <rect x="38" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="142" y="244" font-size="15" fill="#b45309" text-anchor="middle">新节点日志是空的</text>
  <text x="142" y="266" font-size="12" fill="#b45309" text-anchor="middle">先以非投票成员追日志</text>

  <rect x="275" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="244" font-size="15" fill="#b45309" text-anchor="middle">领导者可能不在新配置里</text>
  <text x="379" y="266" font-size="12" fill="#b45309" text-anchor="middle">提交新配置条目后主动退位</text>

  <rect x="512" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="616" y="244" font-size="15" fill="#b45309" text-anchor="middle">被移出的节点会超时</text>
  <text x="616" y="266" font-size="12" fill="#b45309" text-anchor="middle">压住它带着更高任期发起的拉票</text>
</svg>
