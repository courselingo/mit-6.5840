<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 373" width="760" height="373"
     role="img" aria-labelledby="fig-raft-20-title fig-raft-20-desc">
  <title id="fig-raft-20-title">写延迟的下界与提高吞吐的两条路</title>
  <desc id="fig-raft-20-desc">写延迟的下界是领导者到多数派的一次往返；想提高吞吐只能靠批处理与流水线，把多轮请求叠在一起。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="373" fill="#ffffff"/>

  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">写延迟的下界与提高吞吐的两条路</text>

  <text x="22" y="114" font-size="12" fill="#1e293b" text-anchor="start">写路径</text>
  <path d="M200,110 L700,110" fill="none" stroke="#94a3b8"/>
  <path d="M200,102 L200,118" fill="none" stroke="#94a3b8"/>
  <path d="M700,102 L700,118" fill="none" stroke="#94a3b8"/>
  <text x="200" y="84" font-size="12" fill="#1e293b" text-anchor="middle">发出复制请求</text>
  <text x="700" y="84" font-size="12" fill="#1e293b" text-anchor="middle">多数派确认</text>
  <text x="450" y="140" font-size="12" fill="#9d174d" text-anchor="middle">一次往返 = 写延迟的下界</text>
  <rect x="22" y="190" width="345" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="194.5" y="218" font-size="15" fill="#b45309" text-anchor="middle">批处理：把多个请求合成一轮</text>
  <text x="194.5" y="240" font-size="12" fill="#b45309" text-anchor="middle">用一次往返带走更多命令</text>
  <rect x="393" y="190" width="345" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="565.5" y="218" font-size="15" fill="#6b21a8" text-anchor="middle">流水线：多轮请求并行在途</text>
  <text x="565.5" y="240" font-size="12" fill="#6b21a8" text-anchor="middle">不等待上一轮回来就发下一轮</text>
  <rect x="22" y="286" width="716" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380.0" y="310" font-size="11" fill="#1e293b" text-anchor="middle">论文的评估说它与 Paxos 在性能上相当</text>
  <text x="380.0" y="330" font-size="10" fill="#64748b" text-anchor="middle">正常情况用最少的消息数完成复制：领导者到半个集群的一次往返</text>
</svg>
