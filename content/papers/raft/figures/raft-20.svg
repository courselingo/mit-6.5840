<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-raft-20-title fig-raft-20-desc">
  <title id="fig-raft-20-title">写延迟的下界与提高吞吐的两条路</title>
  <desc id="fig-raft-20-desc">写延迟的下界是到多数派的一次往返；想提高吞吐只能靠批处理与流水线，把多轮请求叠在一起。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">写延迟的下界与提高吞吐的两条路</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">常态下一条命令</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">要等多数派确认才返回</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">所以写延迟的下界</text>
  <text x="380" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">大约是到多数派的一次往返</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">论文的评估说</text>
  <text x="625" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">它与 Paxos 在性能上相当</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="165" font-size="12" fill="#b45309" text-anchor="middle">正常情况用最少的消息数</text>
  <text x="135" y="183" font-size="12" fill="#b45309" text-anchor="middle">领导者到半个集群一次往返</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="165" font-size="12" fill="#b45309" text-anchor="middle">想提高吞吐</text>
  <text x="380" y="183" font-size="12" fill="#b45309" text-anchor="middle">就要靠批处理与流水线</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">批处理把多个请求合成一轮</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">流水线让多轮并行在途</text>
</svg>
