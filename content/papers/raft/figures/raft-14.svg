<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456"
     role="img" aria-labelledby="fig-raft-14-title fig-raft-14-desc">
  <title id="fig-raft-14-title">换主要停多久、读取为什么不自动强一致、单写者的天花板</title>
  <desc id="fig-raft-14-desc">上排：论文测得换主中位停机约 287ms，把选举超时压到 12–24ms 可降到 35ms，但再低就会破坏时间要求、导致不必要的更替。中排：陈旧读来自一个已经下台、却没察觉的旧领导者，它会用落后的日志回应读请求；要线性一致就得把读走一遍日志、或用带时限的租约确认领导者仍权威。下排：所有写都经过同一位领导者，集群越大它越早成为上限，把键空间切成许多复制组后整体吞吐才随分片数增长。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="456" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">换主要停多久、读取为什么不自动强一致、单写者的天花板</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">换主要停多久，以及这个参数为什么不能一味压小</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">读取并不自动是强一致的</text>

  <rect x="22" y="324" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="338" font-size="12" fill="#64748b" text-anchor="middle">领导者是写吞吐的瓶颈</text>

  <rect x="38" y="82" width="328" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="202" y="110" font-size="15" fill="#b45309" text-anchor="middle">中位停机时间约 287ms</text>
  <text x="202" y="132" font-size="12" fill="#b45309" text-anchor="middle">选举超时压到 12–24ms 可降到 35ms</text>

  <rect x="394" y="82" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="558" y="110" font-size="15" fill="#9d174d" text-anchor="middle">再低就会破坏时间要求</text>
  <text x="558" y="132" font-size="12" fill="#9d174d" text-anchor="middle">导致不必要的领导者更替</text>

  <rect x="38" y="216" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="202" y="244" font-size="15" fill="#9d174d" text-anchor="middle">陈旧读来自旧领导者</text>
  <text x="202" y="266" font-size="12" fill="#9d174d" text-anchor="middle">请求都发给领导者，它下台了却没察觉</text>

  <rect x="394" y="216" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="244" font-size="15" fill="#166534" text-anchor="middle">要线性一致就得走一遍日志</text>
  <text x="558" y="266" font-size="12" fill="#166534" text-anchor="middle">或者用带时限的租约确认权威</text>

  <rect x="38" y="350" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="202" y="378" font-size="15" fill="#9d174d" text-anchor="middle">所有写都经过同一位领导者</text>
  <text x="202" y="400" font-size="12" fill="#9d174d" text-anchor="middle">集群越大它越早成为上限</text>

  <rect x="394" y="350" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="378" font-size="15" fill="#166534" text-anchor="middle">把键空间切成许多复制组</text>
  <text x="558" y="400" font-size="12" fill="#166534" text-anchor="middle">每片内部仍是那套 Raft</text>
</svg>
