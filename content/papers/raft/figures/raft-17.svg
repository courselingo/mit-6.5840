<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 353" width="760" height="353"
     role="img" aria-labelledby="fig-raft-17-title fig-raft-17-desc">
  <title id="fig-raft-17-title">任期作为逻辑时钟：三条规则认出陈旧信息</title>
  <desc id="fig-raft-17-desc">三个任期首尾相接，每个任期都以一次选举开始；每次通信都带上任期、见到更大的就让步、更旧的请求直接拒绝，于是不需要物理时钟也能认出陈旧的领导者。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="353" fill="#ffffff"/>

  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">任期作为逻辑时钟：三条规则认出陈旧信息</text>

  <path d="M60,120 L700,120" fill="none" stroke="#94a3b8"/>
  <path d="M60,112 L60,128" fill="none" stroke="#94a3b8"/>
  <path d="M380,112 L380,128" fill="none" stroke="#94a3b8"/>
  <path d="M700,112 L700,128" fill="none" stroke="#94a3b8"/>
  <text x="60" y="94" font-size="12" fill="#1e293b" text-anchor="middle">任期 1</text>
  <text x="60" y="152" font-size="12" fill="#64748b" text-anchor="middle">一次选举开始</text>
  <text x="380" y="94" font-size="12" fill="#1e293b" text-anchor="middle">任期 2</text>
  <text x="380" y="152" font-size="12" fill="#64748b" text-anchor="middle">一次选举开始</text>
  <text x="700" y="94" font-size="12" fill="#1e293b" text-anchor="middle">任期 3</text>
  <text x="700" y="152" font-size="12" fill="#64748b" text-anchor="middle">一次选举开始</text>
  <rect x="23" y="190" width="221" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="133.5" y="218" font-size="15" fill="#b45309" text-anchor="middle">每次通信都带上任期</text>
  <text x="133.5" y="240" font-size="12" fill="#b45309" text-anchor="middle">接收到的东西一看任期就知道新旧</text>
  <rect x="270" y="190" width="221" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.5" y="218" font-size="15" fill="#6b21a8" text-anchor="middle">见到更大的任期就让步</text>
  <text x="380.5" y="240" font-size="12" fill="#6b21a8" text-anchor="middle">候选者或领导者发现过期就退回跟随者</text>
  <rect x="517" y="190" width="221" height="68" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="627.5" y="218" font-size="15" fill="#9d174d" text-anchor="middle">更旧的任期请求直接拒绝</text>
  <text x="627.5" y="240" font-size="12" fill="#9d174d" text-anchor="middle">于是过期的领导者一眼可以辨认</text>
  <rect x="22" y="286" width="716" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380.0" y="312" font-size="11" fill="#1e293b" text-anchor="middle">完全不依赖物理时钟：现实中的时钟偏移让它无法被用来判断先后</text>
</svg>
