<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-raft-17-title fig-raft-17-desc">
  <title id="fig-raft-17-title">任期作为逻辑时钟：三条规则认出陈旧信息</title>
  <desc id="fig-raft-17-desc">通信带任期、见到更大的就让步、旧任期请求直接拒绝，于是无需物理时钟也能认出陈旧的领导者。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">任期作为逻辑时钟：三条规则认出陈旧信息</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">每次通信都带上</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">发送方的任期</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">谁看到的任期更小</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">就更新为更大的那个</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="86" font-size="12" fill="#b45309" text-anchor="middle">候选者或领导者发现过期</text>
  <text x="625" y="104" font-size="12" fill="#b45309" text-anchor="middle">立刻退回跟随者</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">收到任期号比自己旧的请求</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">直接拒绝</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="165" font-size="12" fill="#166534" text-anchor="middle">于是过期的领导者</text>
  <text x="380" y="183" font-size="12" fill="#166534" text-anchor="middle">一眼可以辨认</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">完全不依赖物理时钟</text>
  <text x="625" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">时钟偏移让它不可用</text>
</svg>
