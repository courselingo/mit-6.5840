<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-raft-15-title fig-raft-15-desc">
  <title id="fig-raft-15-title">三次放弃换来的东西</title>
  <desc id="fig-raft-15-desc">放弃少数派可用性、写延迟下界与单集群写吞吐上限，换来一份能被逐块推理、有规格与证明的算法。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三次放弃换来的东西</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="86" font-size="12" fill="#9d174d" text-anchor="middle">放弃少数派一侧的可用性</text>
  <text x="135" y="104" font-size="12" fill="#9d174d" text-anchor="middle">只有多数派可达才能推进</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">放弃写延迟的下界</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">每次写要等一次多数派往返</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="86" font-size="12" fill="#9d174d" text-anchor="middle">放弃单集群的写吞吐上限</text>
  <text x="625" y="104" font-size="12" fill="#9d174d" text-anchor="middle">领导者是唯一的写入口</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="165" font-size="12" fill="#166534" text-anchor="middle">换来一份能讲清的算法</text>
  <text x="135" y="183" font-size="12" fill="#166534" text-anchor="middle">可以逐块推理</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="165" font-size="12" fill="#166534" text-anchor="middle">有形式化规格与安全证明</text>
  <text x="380" y="183" font-size="12" fill="#166534" text-anchor="middle">实现约 2000 行</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">第三方实现二十多个</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">可理解本身就是一种质量</text>
</svg>
