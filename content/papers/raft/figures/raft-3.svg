<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" width="760" height="434"
     role="img" aria-labelledby="fig-raft-3-title fig-raft-3-desc">
  <title id="fig-raft-3-title">选举超时与投票</title>
  <desc id="fig-raft-3-desc">跟随者超时后自增任期转为候选者并并行拉票，拿到多数票即当选；右侧说明随机化超时如何避免选票被多人分掉。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="434" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">选举超时与投票</text>

  <rect x="22" y="56" width="344" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="194" y="84" font-size="15" fill="#b45309" text-anchor="middle">① 跟随者超时</text>
  <text x="194" y="106" font-size="12" fill="#b45309" text-anchor="middle">选举超时内没收到心跳</text>

  <path d="M194,129 L194,141" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="152" width="344" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="194" y="180" font-size="15" fill="#b45309" text-anchor="middle">② 转为候选者</text>
  <text x="194" y="202" font-size="12" fill="#b45309" text-anchor="middle">任期 +1，投票给自己</text>

  <path d="M194,225 L194,237" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="248" width="344" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="194" y="276" font-size="15" fill="#b45309" text-anchor="middle">③ 并行拉票</text>
  <text x="194" y="298" font-size="12" fill="#b45309" text-anchor="middle">向其余节点发拉票请求</text>

  <path d="M194,321 L194,333" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="344" width="344" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="194" y="372" font-size="15" fill="#b45309" text-anchor="middle">④ 赢得多数票</text>
  <text x="194" y="394" font-size="12" fill="#b45309" text-anchor="middle">立刻发心跳，确立权威</text>

  <rect x="394" y="56" width="344" height="356" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="566" y="86" font-size="14" fill="#1e293b" text-anchor="middle">随机化选举超时</text>

  <rect x="418" y="120" width="296" height="68" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="148" font-size="15" fill="#9d174d" text-anchor="middle">超时相同就分裂</text>
  <text x="566" y="170" font-size="12" fill="#9d174d" text-anchor="middle">多人同时超时，选票被分掉</text>

  <rect x="418" y="216" width="296" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="244" font-size="15" fill="#1e40af" text-anchor="middle">随机取值拉开差距</text>
  <text x="566" y="266" font-size="12" fill="#1e40af" text-anchor="middle">先超时者拉票，其余在等</text>

  <rect x="418" y="312" width="296" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="340" font-size="15" fill="#166534" text-anchor="middle">多数票落到一人</text>
  <text x="566" y="362" font-size="12" fill="#166534" text-anchor="middle">选举很快收敛，不反复分裂</text>
</svg>
