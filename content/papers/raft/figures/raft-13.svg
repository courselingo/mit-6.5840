<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-raft-13-title fig-raft-13-desc">
  <title id="fig-raft-13-title">日志会无限增长：写下状态，丢掉之前的日志</title>
  <desc id="fig-raft-13-desc">日志不断变长，重启重放越来越慢，所以写快照并丢掉它之前的日志；落后太多的跟随者由领导者传快照。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">日志会无限增长：写下状态，丢掉之前的日志</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="86" font-size="12" fill="#9d174d" text-anchor="middle">长期运行的集群</text>
  <text x="135" y="104" font-size="12" fill="#9d174d" text-anchor="middle">日志不断变长</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">重启后重放全部条目</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">也越来越慢</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="86" font-size="12" fill="#b45309" text-anchor="middle">快照：把状态机的当前状态</text>
  <text x="625" y="104" font-size="12" fill="#b45309" text-anchor="middle">整体写下来</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="165" font-size="12" fill="#b45309" text-anchor="middle">连同一个「最后包含的位置」</text>
  <text x="135" y="183" font-size="12" fill="#b45309" text-anchor="middle">之后丢弃该位置之前的日志</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="165" font-size="12" fill="#166534" text-anchor="middle">让每个跟随者各自独立做快照</text>
  <text x="380" y="183" font-size="12" fill="#166534" text-anchor="middle">更高效</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">领导者在落后太多时</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">把快照分块传给对方</text>
</svg>
