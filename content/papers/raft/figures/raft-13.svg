<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 323" width="760" height="323"
     role="img" aria-labelledby="fig-raft-13-title fig-raft-13-desc">
  <title id="fig-raft-13-title">日志会无限增长：写下状态，丢掉之前的日志</title>
  <desc id="fig-raft-13-desc">日志不断变长、重启重放越来越慢，所以把状态机当前状态整体写成快照，连同「最后包含的位置」一起记下来，然后丢掉该位置之前的日志。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="323" fill="#ffffff"/>

  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">日志会无限增长：写下状态，丢掉之前的日志</text>

  <rect x="22" y="76" width="80" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="62.0" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 1</text>
  <rect x="128" y="76" width="80" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="168.0" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 2</text>
  <rect x="234" y="76" width="80" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="274.0" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 3</text>
  <rect x="340" y="76" width="80" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380.0" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 4</text>
  <rect x="446" y="76" width="80" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="486.0" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 5</text>
  <rect x="552" y="76" width="80" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="592.0" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 6</text>
  <rect x="658" y="76" width="80" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="698.0" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 n</text>
  <path d="M195,117 L195,129" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M565,117 L565,129" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="140" width="345" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194.5" y="168" font-size="15" fill="#166534" text-anchor="middle">快照：整体写下状态机的状态</text>
  <text x="194.5" y="190" font-size="12" fill="#166534" text-anchor="middle">连同一个「最后包含的位置」</text>
  <rect x="393" y="140" width="345" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="565.5" y="168" font-size="15" fill="#6b21a8" text-anchor="middle">丢掉该位置之前的日志</text>
  <text x="565.5" y="190" font-size="12" fill="#6b21a8" text-anchor="middle">重启就不用重放全部条目</text>
  <rect x="22" y="236" width="716" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380.0" y="260" font-size="11" fill="#1e293b" text-anchor="middle">长期运行的集群日志不断变长，重启后重放全部条目也越来越慢</text>
  <text x="380.0" y="280" font-size="10" fill="#64748b" text-anchor="middle">让每个跟随者各自独立做快照更高效；某个跟随者落后太多时，由领导者把快照分块传给它</text>
</svg>
