<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-raft-13-title fig-raft-13-desc">
  <title id="fig-raft-13-title">日志会无限增长，以及状态机必须确定</title>
  <desc id="fig-raft-13-desc">日志不断变长、重启后重放越来越慢，所以写快照并丢弃它之前的日志；让每个跟随者各自做快照更高效，落后太多时才由领导者分块传快照。另一个前提是状态机必须确定：内部有随机数、依赖墙上时钟或外部副作用时，相同命令会算出不同状态，这部分不确定性必须由上层处理。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">日志会无限增长，以及状态机必须确定</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">日志无限增长这件事，靠快照解决</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">有一个前提比任何一条规则都基础</text>

  <rect x="38" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="142" y="110" font-size="15" fill="#9d174d" text-anchor="middle">日志不断变长</text>
  <text x="142" y="132" font-size="12" fill="#9d174d" text-anchor="middle">重启后重放全部条目越来越慢</text>

  <rect x="275" y="82" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379" y="110" font-size="15" fill="#166534" text-anchor="middle">写快照并丢弃之前的日志</text>
  <text x="379" y="132" font-size="12" fill="#166534" text-anchor="middle">状态整体写下，带最后包含的位置</text>

  <rect x="512" y="82" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="616" y="110" font-size="15" fill="#b45309" text-anchor="middle">每个跟随者各自做快照</text>
  <text x="616" y="132" font-size="12" fill="#b45309" text-anchor="middle">落后太多才由领导者分块传给它</text>

  <rect x="38" y="216" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="202" y="244" font-size="15" fill="#9d174d" text-anchor="middle">随机数、墙上时钟、外部副作用</text>
  <text x="202" y="266" font-size="12" fill="#9d174d" text-anchor="middle">相同命令会算出不同状态</text>

  <rect x="394" y="216" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="244" font-size="15" fill="#166534" text-anchor="middle">这份不确定性混进状态机</text>
  <text x="558" y="266" font-size="12" fill="#166534" text-anchor="middle">复制就失去意义，必须由上层处理</text>
</svg>
