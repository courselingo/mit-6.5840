<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 315" width="760" height="315"
     role="img" aria-labelledby="fig-raft-22-title fig-raft-22-desc">
  <title id="fig-raft-22-title">可用性的边界：只有多数派可达才能写</title>
  <desc id="fig-raft-22-desc">五个节点在一条链路上被切成两半：多数派那一侧三台同时在网才推得动写入，少数派那一侧无法服务；这不是实现缺陷，而是杜绝脑裂必须付的代价。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="315" fill="#ffffff"/>

  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">可用性的边界：只有多数派可达才能写</text>

  <rect x="23" y="64" width="122" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="84.0" y="86.2" font-size="12" fill="#166534" text-anchor="middle">节点 1</text>
  <rect x="171" y="64" width="122" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="232.0" y="86.2" font-size="12" fill="#166534" text-anchor="middle">节点 2</text>
  <rect x="319" y="64" width="122" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380.0" y="86.2" font-size="12" fill="#166534" text-anchor="middle">节点 3</text>
  <rect x="467" y="64" width="122" height="36" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="528.0" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">节点 4</text>
  <rect x="615" y="64" width="122" height="36" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="676.0" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">节点 5</text>
  <path d="M454,56 L454,108" fill="none" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="22" y="128" width="716" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380.0" y="156" font-size="15" fill="#166534" text-anchor="middle">断成两半：多数派一侧三台同时在网，才推得动写入</text>
  <text x="380.0" y="178" font-size="12" fill="#166534" text-anchor="middle">少数派那一侧无法服务写入，这是杜绝脑裂必须付的代价</text>
  <rect x="22" y="224" width="716" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="252" font-size="15" fill="#6b21a8" text-anchor="middle">想在那时照样读写，只能放松一致性</text>
  <text x="380.0" y="274" font-size="12" fill="#6b21a8" text-anchor="middle">那样拿到的已经不是它的承诺：可用性是用一致性换来的</text>
</svg>
