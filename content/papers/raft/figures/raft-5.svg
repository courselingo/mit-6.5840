<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-raft-5-title fig-raft-5-desc">
  <title id="fig-raft-5-title">为什么当时需要一个新算法：旧答案难懂也难拼装</title>
  <desc id="fig-raft-5-desc">单值内核没有直观解释，拼成日志又添细节；多副本下没有公认的多决策版本，各系统各自演化。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">为什么当时需要一个新算法：旧答案难懂也难拼装</text>

  <rect x="25" y="64" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195" y="86" font-size="12" fill="#9d174d" text-anchor="middle">单值内核很微妙</text>
  <text x="195" y="104" font-size="12" fill="#9d174d" text-anchor="middle">两个阶段之间没有直观解释</text>
  <rect x="395" y="64" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="565" y="86" font-size="12" fill="#9d174d" text-anchor="middle">拼成一条日志的规则</text>
  <text x="565" y="104" font-size="12" fill="#9d174d" text-anchor="middle">又引入更多细节</text>
  <rect x="25" y="143" width="340" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="195" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">多副本场景下</text>
  <text x="195" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">没有公认的多决策版本</text>
  <rect x="395" y="143" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="565" y="165" font-size="12" fill="#9d174d" text-anchor="middle">每个真实系统各自演化</text>
  <text x="565" y="183" font-size="12" fill="#9d174d" text-anchor="middle">最后以一份没被证明过的协议为基础</text>
</svg>
