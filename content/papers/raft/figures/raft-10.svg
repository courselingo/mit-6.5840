<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-raft-10-title fig-raft-10-desc">
  <title id="fig-raft-10-title">旧任期的条目不能被数副本：四步时序</title>
  <desc id="fig-raft-10-desc">任期 2 的条目只复制到部分节点，旧领导者复活再当选后补齐到多数派，看起来已提交，其实还可能被覆盖。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">旧任期的条目不能被数副本：四步时序</text>

  <rect x="25" y="64" width="158" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="104" y="86" font-size="12" fill="#1e40af" text-anchor="middle">任期 2 的条目</text>
  <text x="104" y="104" font-size="12" fill="#1e40af" text-anchor="middle">只复制到部分节点</text>
  <rect x="209" y="64" width="158" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="288" y="86" font-size="12" fill="#9d174d" text-anchor="middle">那位领导者</text>
  <text x="288" y="104" font-size="12" fill="#9d174d" text-anchor="middle">随即崩溃</text>
  <rect x="393" y="64" width="158" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="472" y="86" font-size="12" fill="#9d174d" text-anchor="middle">任期 3 另一个节点当选</text>
  <text x="472" y="104" font-size="12" fill="#9d174d" text-anchor="middle">写入了不同的条目</text>
  <rect x="577" y="64" width="158" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="656" y="86" font-size="12" fill="#b45309" text-anchor="middle">旧领导者复活</text>
  <text x="656" y="104" font-size="12" fill="#b45309" text-anchor="middle">再次当选</text>
  <rect x="25" y="143" width="158" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="104" y="165" font-size="12" fill="#b45309" text-anchor="middle">它把任期 2 那条</text>
  <text x="104" y="183" font-size="12" fill="#b45309" text-anchor="middle">补齐到多数派</text>
  <rect x="209" y="143" width="158" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="288" y="165" font-size="12" fill="#9d174d" text-anchor="middle">看起来「已提交」</text>
  <text x="288" y="183" font-size="12" fill="#9d174d" text-anchor="middle">其实还没提交</text>
  <rect x="393" y="143" width="158" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="472" y="165" font-size="12" fill="#9d174d" text-anchor="middle">它若崩溃，任期 3 的节点</text>
  <text x="472" y="183" font-size="12" fill="#9d174d" text-anchor="middle">仍可能当选</text>
  <rect x="577" y="143" width="158" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="656" y="165" font-size="12" fill="#9d174d" text-anchor="middle">用自己那条</text>
  <text x="656" y="183" font-size="12" fill="#9d174d" text-anchor="middle">把旧条目覆盖掉</text>
</svg>
