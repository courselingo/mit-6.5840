<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-raft-2-title fig-raft-2-desc">
  <title id="fig-raft-2-title">从客户端命令到提交，以及写延迟的下界</title>
  <desc id="fig-raft-2-desc">领导者把命令追加到自己的日志、并行广播给其他节点；多数派已复制并且条目属于当前任期才算提交，随后应用到状态机并返回客户端。写延迟的下界是到多数派的一次往返，想提高吞吐只能靠批处理与流水线，把多轮请求叠在一起。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">从客户端命令到提交，以及写延迟的下界</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">提交的最后一步要同时看两个条件</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">下界改不了，能改的是把多少请求塞进一次往返</text>

  <path d="M193,116 L205,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M371,116 L383,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M549,116 L561,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="150" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="113" y="110" font-size="15" fill="#1e40af" text-anchor="middle">命令到达</text>
  <text x="113" y="132" font-size="12" fill="#1e40af" text-anchor="middle">追加到领导者日志</text>

  <rect x="216" y="82" width="150" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="291" y="110" font-size="15" fill="#b45309" text-anchor="middle">并行广播</text>
  <text x="291" y="132" font-size="12" fill="#b45309" text-anchor="middle">一直重试到多数派</text>

  <rect x="394" y="82" width="150" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="469" y="110" font-size="15" fill="#9d174d" text-anchor="middle">两个条件齐了</text>
  <text x="469" y="132" font-size="12" fill="#9d174d" text-anchor="middle">多数派复制 + 当前任期</text>

  <rect x="572" y="82" width="150" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="647" y="110" font-size="15" fill="#166534" text-anchor="middle">应用到状态机</text>
  <text x="647" y="132" font-size="12" fill="#166534" text-anchor="middle">结果返回客户端</text>

  <rect x="38" y="216" width="328" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="202" y="244" font-size="15" fill="#6b21a8" text-anchor="middle">写延迟的下界</text>
  <text x="202" y="266" font-size="12" fill="#6b21a8" text-anchor="middle">到多数派的一次往返，单个慢节点不拖慢它</text>

  <rect x="394" y="216" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="244" font-size="15" fill="#166534" text-anchor="middle">想提吞吐只能批处理</text>
  <text x="558" y="266" font-size="12" fill="#166534" text-anchor="middle">用流水线把多轮请求叠在一起</text>
</svg>
