<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 379" width="760" height="379"
     role="img" aria-labelledby="fig-raft-21-title fig-raft-21-desc">
  <title id="fig-raft-21-title">换主要停多久：超时不是越小越好</title>
  <desc id="fig-raft-21-desc">换主的中位停机时间约 287ms；把选举超时压到 12 到 24ms 可以把平均选举时间降到 35ms，但再低就会破坏时间要求，结果是频繁换主。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="379" fill="#ffffff"/>

  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">换主要停多久：超时不是越小越好</text>

  <rect x="140" y="100" width="574" height="36" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="427.0" y="122.2" font-size="12" fill="#9d174d" text-anchor="middle">约 287ms</text>
  <text x="125" y="122" font-size="12" fill="#64748b" text-anchor="end">换主中位停机</text>
  <rect x="140" y="164" width="70" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="175.0" y="186.2" font-size="12" fill="#b45309" text-anchor="middle">35ms</text>
  <text x="125" y="186" font-size="12" fill="#64748b" text-anchor="end">平均选举时间</text>
  <rect x="140" y="228" width="48" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="164.0" y="250.2" font-size="12" fill="#166534" text-anchor="middle">24ms</text>
  <text x="125" y="250" font-size="12" fill="#64748b" text-anchor="end">选举超时区间</text>
  <rect x="22" y="292" width="716" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380.0" y="316" font-size="11" fill="#1e293b" text-anchor="middle">再低就会破坏时间要求：广播不再远小于选举超时</text>
  <text x="380.0" y="336" font-size="10" fill="#64748b" text-anchor="middle">结果是频繁换主，反而更不可用 —— 这条线说明超时不能一味压小</text>
</svg>
