<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-raft-21-title fig-raft-21-desc">
  <title id="fig-raft-21-title">换主要停多久：超时不是越小越好</title>
  <desc id="fig-raft-21-desc">论文测得的换主中位停机时间约 287ms，压小选举超时能缩短选举，但再低就会破坏时间要求、频繁换主。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">换主要停多久：超时不是越小越好</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="86" font-size="12" fill="#9d174d" text-anchor="middle">领导者更替期间</text>
  <text x="135" y="104" font-size="12" fill="#9d174d" text-anchor="middle">系统短暂没有领导者</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">论文测得的中位停机时间</text>
  <text x="380" y="104" font-size="12" fill="#1e40af" text-anchor="middle">在 5ms 随机化下约 287ms</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="86" font-size="12" fill="#b45309" text-anchor="middle">选举超时压到 12 到 24ms</text>
  <text x="625" y="104" font-size="12" fill="#b45309" text-anchor="middle">平均选举时间降到 35ms</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">但再低就破坏时间要求</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">广播不再远小于超时</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="165" font-size="12" fill="#9d174d" text-anchor="middle">结果是频繁换主</text>
  <text x="380" y="183" font-size="12" fill="#9d174d" text-anchor="middle">反而更不可用</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">这条线说明</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">超时不能一味压小</text>
</svg>
