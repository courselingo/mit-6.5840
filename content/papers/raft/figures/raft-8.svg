<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456"
     role="img" aria-labelledby="fig-raft-8-title fig-raft-8-desc">
  <title id="fig-raft-8-title">日志匹配、多数派相交，以及旧任期条目的陷阱</title>
  <desc id="fig-raft-8-desc">上排：复制请求带上紧邻在前那条的位置与任期，跟随者找不到前缀就拒绝，领导者退一格再试，最后覆盖冲突的后缀。中排：候选者要拿到多数票而两个多数派必然相交，所以投票者拒绝日志更旧的候选者，新领导者必定含有全部已提交条目。下排：旧任期条目即使数得出多数派也可能被覆盖，所以只有当前任期的条目才能靠数副本判定提交。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="456" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">日志匹配、多数派相交，以及旧任期条目的陷阱</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">日志匹配：靠复制请求里那次前缀检查</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">选举里那一条限制，就是安全性的支点</text>

  <rect x="22" y="324" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="338" font-size="12" fill="#64748b" text-anchor="middle">只有当前任期的条目才能靠数副本提交</text>

  <rect x="38" y="82" width="328" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="202" y="110" font-size="15" fill="#b45309" text-anchor="middle">请求带上紧邻在前那条</text>
  <text x="202" y="132" font-size="12" fill="#b45309" text-anchor="middle">跟随者找不到这个前缀就拒绝</text>

  <rect x="394" y="82" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="110" font-size="15" fill="#166534" text-anchor="middle">领导者退一格再试</text>
  <text x="558" y="132" font-size="12" fill="#166534" text-anchor="middle">找到一致点后覆盖冲突的后缀</text>

  <rect x="38" y="216" width="328" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="202" y="244" font-size="15" fill="#b45309" text-anchor="middle">候选者要拿到多数票</text>
  <text x="202" y="266" font-size="12" fill="#b45309" text-anchor="middle">而任意两个多数派必然相交</text>

  <rect x="394" y="216" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="244" font-size="15" fill="#166534" text-anchor="middle">投票者拒绝日志更旧的候选者</text>
  <text x="558" y="266" font-size="12" fill="#166534" text-anchor="middle">新领导者必定含有全部已提交条目</text>

  <rect x="38" y="350" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="202" y="378" font-size="15" fill="#9d174d" text-anchor="middle">旧任期条目补齐到多数派</text>
  <text x="202" y="400" font-size="12" fill="#9d174d" text-anchor="middle">看起来已提交，其实仍可能被覆盖</text>

  <rect x="394" y="350" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="378" font-size="15" fill="#166534" text-anchor="middle">先提交一条当前任期的条目</text>
  <text x="558" y="400" font-size="12" fill="#166534" text-anchor="middle">它之前的条目就都被间接提交了</text>
</svg>
