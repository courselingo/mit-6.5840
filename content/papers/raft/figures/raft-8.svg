<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 291" width="760" height="291"
     role="img" aria-labelledby="fig-raft-8-title fig-raft-8-desc">
  <title id="fig-raft-8-title">日志匹配：靠前缀检查让日志自动收敛</title>
  <desc id="fig-raft-8-desc">领导者与跟随者的日志逐格对齐：请求带上紧邻在前那条的位置与任期，跟随者找不到这个前缀就拒绝，领导者退一格再试，最后把冲突的后缀覆盖掉。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="291" fill="#ffffff"/>

  <text x="380.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">日志匹配：靠前缀检查让日志自动收敛</text>

  <text x="23" y="98" font-size="12" fill="#1e293b" text-anchor="start">领导者日志</text>
  <rect x="150.0" y="76" width="97.0" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="198.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 1</text>
  <rect x="273.0" y="76" width="97.0" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="321.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 2</text>
  <rect x="396.0" y="76" width="97.0" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="444.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 3</text>
  <rect x="519.0" y="76" width="97.0" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="567.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 4</text>
  <rect x="642.0" y="76" width="97.0" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="690.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">条目 5</text>
  <text x="23" y="162" font-size="12" fill="#1e293b" text-anchor="start">跟随者日志</text>
  <rect x="150.0" y="140" width="97.0" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="198.5" y="162.2" font-size="12" fill="#166534" text-anchor="middle">条目 1</text>
  <rect x="273.0" y="140" width="97.0" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="321.5" y="162.2" font-size="12" fill="#166534" text-anchor="middle">条目 2</text>
  <rect x="396.0" y="140" width="97.0" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="444.5" y="162.2" font-size="12" fill="#166534" text-anchor="middle">条目 3</text>
  <rect x="519.0" y="140" width="97.0" height="36" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="567.5" y="162.2" font-size="12" fill="#9d174d" text-anchor="middle">条目 4</text>
  <rect x="642.0" y="140" width="97.0" height="36" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="690.5" y="162.2" font-size="12" fill="#9d174d" text-anchor="middle">条目 5</text>
  <path d="M444.5,117 L444.5,129" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M468,135 L468,123" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="204" width="716" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380.0" y="228" font-size="11" fill="#1e293b" text-anchor="middle">请求带上紧邻在前那条的位置与任期，跟随者在自己日志里找不到这个前缀就拒绝</text>
  <text x="380.0" y="248" font-size="10" fill="#64748b" text-anchor="middle">领导者把下一个待发位置往前退一格再试，直到一致点再覆盖冲突的后缀；新领导者上台不需要专门的修复流程</text>
</svg>
