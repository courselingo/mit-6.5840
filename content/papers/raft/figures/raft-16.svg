<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-raft-16-title fig-raft-16-desc">
  <title id="fig-raft-16-title">领导者是写吞吐的瓶颈：切成许多复制组</title>
  <desc id="fig-raft-16-desc">所有写都要经过同一位领导者，集群越大它越早成为上限；把键空间切成许多独立复制组之后，整体写吞吐可以随分片数增长。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">领导者是写吞吐的瓶颈：切成许多复制组</text>

  <rect x="25" y="64" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195" y="86" font-size="12" fill="#9d174d" text-anchor="middle">所有写都要经过同一位领导者</text>
  <text x="195" y="104" font-size="12" fill="#9d174d" text-anchor="middle">集群越大它越早成为上限</text>
  <rect x="395" y="64" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="565" y="86" font-size="12" fill="#9d174d" text-anchor="middle">这与主备复制的直觉一样</text>
  <text x="565" y="104" font-size="12" fill="#9d174d" text-anchor="middle">单写者换来简单也换来天花板</text>
  <rect x="25" y="143" width="340" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195" y="165" font-size="12" fill="#b45309" text-anchor="middle">把键空间切许多独立复制组</text>
  <text x="195" y="183" font-size="12" fill="#b45309" text-anchor="middle">每组各跑一套 Raft</text>
  <rect x="395" y="143" width="340" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="565" y="165" font-size="12" fill="#166534" text-anchor="middle">每片内部仍有领导者</text>
  <text x="565" y="183" font-size="12" fill="#166534" text-anchor="middle">整体吞吐随分片数增长</text>
</svg>
