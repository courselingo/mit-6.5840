<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 237" width="760" height="237"
     role="img" aria-labelledby="fig-raft-18-title fig-raft-18-desc">
  <title id="fig-raft-18-title">请求发给谁都能走通：跟随者会转给领导者</title>
  <desc id="fig-raft-18-desc">客户端可以把请求发给任意一台，如果那是一台跟随者，它会把请求转给领导者；于是客户端不必知道谁是领导者，代价是多一次跳转。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="237" fill="#ffffff"/>

  <text x="381.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">请求发给谁都能走通：跟随者会转给领导者</text>

  <rect x="23" y="64" width="159" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="102.5" y="92" font-size="15" fill="#1e40af" text-anchor="middle">客户端</text>
  <text x="102.5" y="114" font-size="12" fill="#1e40af" text-anchor="middle">可以把请求发给任意一台</text>
  <rect x="208" y="64" width="159" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287.5" y="92" font-size="15" fill="#b45309" text-anchor="middle">可能是一台跟随者</text>
  <text x="287.5" y="114" font-size="12" fill="#b45309" text-anchor="middle">它会应答，但不是权威</text>
  <rect x="393" y="64" width="159" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="472.5" y="92" font-size="15" fill="#6b21a8" text-anchor="middle">跟随者转给领导者</text>
  <text x="472.5" y="114" font-size="12" fill="#6b21a8" text-anchor="middle">所以客户端要多等一次跳转</text>
  <rect x="578" y="64" width="159" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657.5" y="92" font-size="15" fill="#166534" text-anchor="middle">最终只有领导者</text>
  <text x="657.5" y="114" font-size="12" fill="#166534" text-anchor="middle">决定条目放在哪里</text>
  <path d="M187,98 L197,98" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,98 L382,98" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,98 L567,98" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="23" y="160" width="345" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.5" y="182" font-size="12" fill="#166534" text-anchor="middle">五节点集群</text>
  <text x="195.5" y="200" font-size="12" fill="#166534" text-anchor="middle">任意时刻恰好一个领导者</text>
  <rect x="394" y="160" width="345" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566.5" y="182" font-size="12" fill="#9d174d" text-anchor="middle">可以容忍两台失效</text>
  <text x="566.5" y="200" font-size="12" fill="#9d174d" text-anchor="middle">代价是多一次跳转，或者自己记住领导者</text>
</svg>
