<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456"
     role="img" aria-labelledby="fig-raft-1-title fig-raft-1-desc">
  <title id="fig-raft-1-title">三个角色、任期这个逻辑时钟，以及选举的三个时间尺度</title>
  <desc id="fig-raft-1-desc">上排：客户端把请求发给任意一台，跟随者转给领导者；候选者超时后自增任期并拉票；一个任期最多一个领导者，五节点需要三台同时在网。中排：任期充当逻辑时钟，通信带任期、见到更大的就让步、旧任期请求直接拒绝，完全不依赖物理时钟。下排：广播时间远小于选举超时、选举超时远小于平均故障间隔，随机化超时避免选票被分掉。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="456" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三个角色、任期这个逻辑时钟，以及选举的三个时间尺度</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">三个角色：客户端不必知道谁是领导者</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">任期就是逻辑时钟</text>

  <rect x="22" y="324" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="338" font-size="12" fill="#64748b" text-anchor="middle">选举与心跳成立的三个时间尺度</text>

  <path d="M252,116 L264,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M489,116 L501,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="142" y="110" font-size="15" fill="#1e40af" text-anchor="middle">跟随者</text>
  <text x="142" y="132" font-size="12" fill="#1e40af" text-anchor="middle">客户端发给它，它转给领导者</text>

  <rect x="275" y="82" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="110" font-size="15" fill="#b45309" text-anchor="middle">候选者</text>
  <text x="379" y="132" font-size="12" fill="#b45309" text-anchor="middle">超时后自增任期并拉票</text>

  <rect x="512" y="82" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="110" font-size="15" fill="#166534" text-anchor="middle">领导者</text>
  <text x="616" y="132" font-size="12" fill="#166534" text-anchor="middle">五节点要三台同时在网</text>

  <rect x="38" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="142" y="244" font-size="15" fill="#b45309" text-anchor="middle">通信都带任期</text>
  <text x="142" y="266" font-size="12" fill="#b45309" text-anchor="middle">见到更大的就让步</text>

  <rect x="275" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="244" font-size="15" fill="#b45309" text-anchor="middle">旧任期的请求</text>
  <text x="379" y="266" font-size="12" fill="#b45309" text-anchor="middle">直接拒绝，过期领导者立刻退位</text>

  <rect x="512" y="216" width="209" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="616" y="244" font-size="15" fill="#6b21a8" text-anchor="middle">不测量时间</text>
  <text x="616" y="266" font-size="12" fill="#6b21a8" text-anchor="middle">只比较编号，时钟偏移不影响</text>

  <rect x="38" y="350" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="142" y="378" font-size="15" fill="#1e40af" text-anchor="middle">广播时间</text>
  <text x="142" y="400" font-size="12" fill="#1e40af" text-anchor="middle">远小于选举超时</text>

  <rect x="275" y="350" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="379" y="378" font-size="15" fill="#1e40af" text-anchor="middle">选举超时</text>
  <text x="379" y="400" font-size="12" fill="#1e40af" text-anchor="middle">远小于单机平均故障间隔</text>

  <rect x="512" y="350" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="378" font-size="15" fill="#166534" text-anchor="middle">超时值随机化</text>
  <text x="616" y="400" font-size="12" fill="#166534" text-anchor="middle">下一次通常只有一个先超时</text>
</svg>
