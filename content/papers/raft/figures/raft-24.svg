<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 329" width="760" height="329"
     role="img" aria-labelledby="fig-raft-24-title fig-raft-24-desc">
  <title id="fig-raft-24-title">读取侧的优化：租约与只读索引</title>
  <desc id="fig-raft-24-desc">要让读也线性一致有三条路：把读也走一遍日志、用带时限的租约让领导者确认权威，或者用只读索引把只读请求单独处理；它们攻击的都是「每次读都要确认权威」这个代价。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="329" fill="#ffffff"/>

  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">读取侧的优化：租约与只读索引</text>

  <rect x="230" y="64" width="300" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380.0" y="86" font-size="12" fill="#9d174d" text-anchor="middle">要让读也线性一致</text>
  <text x="380.0" y="104" font-size="12" fill="#9d174d" text-anchor="middle">读的路径和写不一样</text>
  <path d="M262,123 C 262,130 196,128 196,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,123 L380,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M498,123 C 498,130 566,128 566,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="23" y="146" width="221" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="133.5" y="174" font-size="15" fill="#166534" text-anchor="middle">把读也走一遍日志</text>
  <text x="133.5" y="196" font-size="12" fill="#166534" text-anchor="middle">像写一样先确认权威</text>
  <rect x="270" y="146" width="221" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380.5" y="174" font-size="15" fill="#b45309" text-anchor="middle">用带时限的租约</text>
  <text x="380.5" y="196" font-size="12" fill="#b45309" text-anchor="middle">让领导者确认自己仍然权威</text>
  <rect x="517" y="146" width="221" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="627.5" y="174" font-size="15" fill="#6b21a8" text-anchor="middle">只读索引</text>
  <text x="627.5" y="196" font-size="12" fill="#6b21a8" text-anchor="middle">把只读请求单独处理</text>
  <rect x="22" y="242" width="716" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380.0" y="266" font-size="11" fill="#1e293b" text-anchor="middle">这些优化攻击的是同一个代价：每次读都要确认权威</text>
  <text x="380.0" y="286" font-size="10" fill="#64748b" text-anchor="middle">租约用时间换确认次数，把读的成本从一次往返降到接近本地读</text>
</svg>
