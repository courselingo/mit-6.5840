<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 419" width="760" height="419"
     role="img" aria-labelledby="fig-mapreduce-7-title fig-mapreduce-7-desc">
  <title id="fig-mapreduce-7-title">原子提交：先写私有临时文件，完成时原子改名</title>
  <desc id="fig-mapreduce-7-desc">同一个任务的两份执行各自写私有临时文件，最后都原子改名成同一个最终文件，所以重复执行也只会留下一份结果。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="419" fill="#ffffff"/>

  <text x="381.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">原子提交：先写私有临时文件，完成时原子改名</text>

  <rect x="23" y="64" width="345" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.5" y="92" font-size="15" fill="#1e40af" text-anchor="middle">第一次执行</text>
  <text x="195.5" y="114" font-size="12" fill="#1e40af" text-anchor="middle">先写自己的私有临时文件</text>
  <rect x="394" y="64" width="345" height="68" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566.5" y="92" font-size="15" fill="#9d174d" text-anchor="middle">重跑或备份执行的第二份</text>
  <text x="566.5" y="114" font-size="12" fill="#9d174d" text-anchor="middle">同样只写私有临时文件</text>
  <path d="M195.5,137 C 195.5,144 350,142 350,149" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M566.5,137 C 566.5,144 410,142 410,149" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="230" y="160" width="300" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380.0" y="188" font-size="15" fill="#166534" text-anchor="middle">原子改名成最终文件</text>
  <text x="380.0" y="210" font-size="12" fill="#166534" text-anchor="middle">改名是原子的，只留一份结果</text>
  <rect x="23" y="256" width="714" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380.0" y="284" font-size="15" fill="#b45309" text-anchor="middle">映射任务完成时上报 R 个临时文件名</text>
  <text x="380.0" y="306" font-size="12" fill="#b45309" text-anchor="middle">主节点发现这个任务已经完成过，就直接忽略这条重复的完成消息</text>
  <rect x="23" y="352" width="714" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380.0" y="378" font-size="11" fill="#1e293b" text-anchor="middle">函数是确定性的，那么整个分布式执行的输出就等价于单机顺序执行</text>
</svg>
