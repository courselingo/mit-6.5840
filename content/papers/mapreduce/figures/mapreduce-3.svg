<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-mr-3-title fig-mr-3-desc">
  <title id="fig-mr-3-title">落后者用备份执行对付，分区倾斜备份执行救不了</title>
  <desc id="fig-mr-3-desc">落后者可能只是撞上一块快坏的磁盘，读性能从 30MB/s 掉到 1MB/s；对策是备份执行，把还没结束的任务在别的机器上再起一份，谁先完成用谁，排序测试关掉它的耗时从 891 秒涨到 1283 秒。分区倾斜不一样：热点 key 让一个归约器承担大部分值，慢的根因是数据量而不是机器，所以备份执行救不了它；combiner 能减少每台映射机器上重复记录的发送量，但改不掉倾斜本身。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">落后者用备份执行对付，分区倾斜备份执行救不了</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">落后者与备份执行</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">分区倾斜：慢的根因是数据量，不是机器</text>

  <rect x="38" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="142" y="110" font-size="15" fill="#9d174d" text-anchor="middle">慢的原因很琐碎</text>
  <text x="142" y="132" font-size="12" fill="#9d174d" text-anchor="middle">快坏的磁盘：30MB/s 掉到 1MB/s</text>

  <rect x="275" y="82" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="110" font-size="15" fill="#b45309" text-anchor="middle">对策：备份执行</text>
  <text x="379" y="132" font-size="12" fill="#b45309" text-anchor="middle">没结束的任务在别处再起一份</text>

  <rect x="512" y="82" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="110" font-size="15" fill="#166534" text-anchor="middle">谁先完成用谁</text>
  <text x="616" y="132" font-size="12" fill="#166534" text-anchor="middle">关掉它：891 秒涨到 1283 秒</text>

  <rect x="38" y="216" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="202" y="244" font-size="15" fill="#9d174d" text-anchor="middle">热点 key 落进同一个归约器</text>
  <text x="202" y="266" font-size="12" fill="#9d174d" text-anchor="middle">其余归约器早早做完干等</text>

  <rect x="394" y="216" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="244" font-size="15" fill="#166534" text-anchor="middle">它也是长尾，但备份没用</text>
  <text x="558" y="266" font-size="12" fill="#166534" text-anchor="middle">combiner 改不掉倾斜：值集合该多大还是多大</text>
</svg>
