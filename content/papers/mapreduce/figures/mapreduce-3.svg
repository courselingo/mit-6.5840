<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 399" width="360" height="399"
     role="img" aria-labelledby="fig-mapreduce-3-title fig-mapreduce-3-desc">
  <title id="fig-mapreduce-3-title">长尾任务与备份执行</title>
  <desc id="fig-mapreduce-3-desc">同一个任务在三台机器上被重复执行，慢的那台被磁盘拖成长尾；作业收尾时主节点为还没结束的任务再起副本，谁先跑完就用谁的结果，慢的那份被丢弃，输出仍然唯一确定。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="360" height="399" fill="#ffffff"/>

  <text x="180" y="37" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">长尾 straggler 与备份执行</text>

  <rect x="22" y="70" width="140" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="92" y="92" font-size="12" fill="#9d174d" text-anchor="middle">机器 A 很慢</text>
  <text x="92" y="110" font-size="12" fill="#9d174d" text-anchor="middle">磁盘坏块拖成长尾</text>

  <rect x="22" y="150" width="140" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="92" y="172" font-size="12" fill="#1e40af" text-anchor="middle">机器 B</text>
  <text x="92" y="190" font-size="12" fill="#1e40af" text-anchor="middle">备份执行任务 T</text>

  <rect x="22" y="230" width="140" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="92" y="252" font-size="12" fill="#1e40af" text-anchor="middle">机器 C</text>
  <text x="92" y="270" font-size="12" fill="#1e40af" text-anchor="middle">备份执行任务 T</text>

  <rect x="188" y="90" width="150" height="174" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="263" y="163" font-size="12" fill="#166534" text-anchor="middle">先完成者胜出</text>
  <text x="263" y="181" font-size="12" fill="#166534" text-anchor="middle">慢的那份丢弃</text>
  <text x="263" y="199" font-size="12" fill="#166534" text-anchor="middle">输出仍唯一确定</text>

  <path d="M167,97 L 177,97" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M167,177 L 177,177" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M167,257 L 177,257" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="310" width="316" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="180" y="334" font-size="11" fill="#1e293b" text-anchor="middle">作业收尾时，主节点为慢任务再起一份副本</text>
  <text x="180" y="354" font-size="10" fill="#64748b" text-anchor="middle">谁先跑完就用谁的结果，重复计算换确定性</text>
</svg>
