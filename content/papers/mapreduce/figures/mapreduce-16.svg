<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 319" width="760" height="319"
     role="img" aria-labelledby="fig-mapreduce-16-title fig-mapreduce-16-desc">
  <title id="fig-mapreduce-16-title">主节点挂了：检查点还是直接中止</title>
  <desc id="fig-mapreduce-16-desc">给主节点周期性写检查点、从检查点恢复，在原理上是容易的；但当时的实现选择直接中止整个作业，让客户端自己决定要不要重试。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="319" fill="#ffffff"/>

  <text x="381.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">主节点挂了：检查点还是直接中止</text>

  <rect x="23" y="64" width="714" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380.0" y="86" font-size="12" fill="#b45309" text-anchor="middle">主节点只有一个，它挂掉的概率很低</text>
  <text x="380.0" y="104" font-size="12" fill="#b45309" text-anchor="middle">所以实现做了一次被明确记下的取舍，不是疏忽</text>
  <path d="M196,123 L196,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M566,123 L566,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="23" y="146" width="345" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.5" y="174" font-size="15" fill="#166534" text-anchor="middle">做检查点：从检查点恢复</text>
  <text x="195.5" y="196" font-size="12" fill="#166534" text-anchor="middle">原理上容易，但没有实现</text>
  <rect x="394" y="146" width="345" height="68" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566.5" y="174" font-size="15" fill="#9d174d" text-anchor="middle">当时的实现：直接中止作业</text>
  <text x="566.5" y="196" font-size="12" fill="#9d174d" text-anchor="middle">由客户端决定要不要重试</text>
  <path d="M380.5,146 L380.5,214" fill="none" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="23" y="242" width="714" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380.0" y="264" font-size="12" fill="#9d174d" text-anchor="middle">可用性让给了实现的简单</text>
  <text x="380.0" y="282" font-size="12" fill="#9d174d" text-anchor="middle">风险由客户端承担</text>
</svg>
