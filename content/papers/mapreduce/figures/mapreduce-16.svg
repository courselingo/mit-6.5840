<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-mapreduce-16-title fig-mapreduce-16-desc">
  <title id="fig-mapreduce-16-title">主节点挂了：检查点还是直接中止</title>
  <desc id="fig-mapreduce-16-desc">给主节点做检查点在原理上容易，但当时的实现选择直接中止整个作业，由客户端决定是否重试。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">主节点挂了：检查点还是直接中止</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">让它周期性写检查点</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">从检查点恢复，原理上容易</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">但主节点只有一个</text>
  <text x="380" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">它挂掉的概率很低</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="86" font-size="12" fill="#9d174d" text-anchor="middle">当时的实现选择</text>
  <text x="625" y="104" font-size="12" fill="#9d174d" text-anchor="middle">直接中止整个作业</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="165" font-size="12" fill="#b45309" text-anchor="middle">客户端自行决定</text>
  <text x="135" y="183" font-size="12" fill="#b45309" text-anchor="middle">要不要重试</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">这是被明确记下的取舍</text>
  <text x="380" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">不是疏忽</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="165" font-size="12" fill="#9d174d" text-anchor="middle">可用性让给了实现的简单</text>
  <text x="625" y="183" font-size="12" fill="#9d174d" text-anchor="middle">风险由客户端承担</text>
</svg>
