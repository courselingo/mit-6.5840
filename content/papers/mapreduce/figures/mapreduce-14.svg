<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-mapreduce-14-title fig-mapreduce-14-desc">
  <title id="fig-mapreduce-14-title">中间结果为什么留在本地磁盘</title>
  <desc id="fig-mapreduce-14-desc">中间结果只会被恰好一个归约任务读一次，写进分布式存储要付多副本开销；留在本地磁盘则只需重跑那几个映射任务。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">中间结果为什么留在本地磁盘</text>

  <rect x="25" y="64" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195" y="86" font-size="12" fill="#9d174d" text-anchor="middle">写进分布式存储</text>
  <text x="195" y="104" font-size="12" fill="#9d174d" text-anchor="middle">要走一遍完整写入路径</text>
  <rect x="395" y="64" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="565" y="86" font-size="12" fill="#9d174d" text-anchor="middle">再付出多副本开销</text>
  <text x="565" y="104" font-size="12" fill="#9d174d" text-anchor="middle">而它只会被读一次</text>
  <rect x="25" y="143" width="340" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195" y="165" font-size="12" fill="#166534" text-anchor="middle">留在映射机器的本地磁盘</text>
  <text x="195" y="183" font-size="12" fill="#166534" text-anchor="middle">丢的只是已完成的输出</text>
  <rect x="395" y="143" width="340" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="565" y="165" font-size="12" fill="#166534" text-anchor="middle">重跑那几个映射任务就行</text>
  <text x="565" y="183" font-size="12" fill="#166534" text-anchor="middle">不需要回滚全局状态</text>
</svg>
