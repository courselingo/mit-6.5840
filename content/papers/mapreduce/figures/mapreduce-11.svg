<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266"
     role="img" aria-labelledby="fig-mapreduce-11-title fig-mapreduce-11-desc">
  <title id="fig-mapreduce-11-title">迭代式算法：每轮都要落盘再读回</title>
  <desc id="fig-mapreduce-11-desc">每一轮都是一次新作业：先读输入、算出中间结果、落进分布式文件系统，下一轮再全部读回来，于是落盘与搬运的成本被乘上迭代次数。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="266" fill="#ffffff"/>

  <text x="380.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">迭代式算法：每轮都要落盘再读回</text>

  <rect x="23" y="64" width="221" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="133.5" y="92" font-size="15" fill="#1e40af" text-anchor="middle">读输入数据</text>
  <text x="133.5" y="114" font-size="12" fill="#1e40af" text-anchor="middle">本轮从文件系统读回</text>
  <rect x="270" y="64" width="221" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380.5" y="92" font-size="15" fill="#b45309" text-anchor="middle">本轮计算</text>
  <text x="380.5" y="114" font-size="12" fill="#b45309" text-anchor="middle">map 产出中间结果</text>
  <rect x="517" y="64" width="221" height="68" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="627.5" y="92" font-size="15" fill="#9d174d" text-anchor="middle">中间结果落盘</text>
  <text x="627.5" y="114" font-size="12" fill="#9d174d" text-anchor="middle">写进分布式文件系统</text>
  <path d="M249,98 L259,98" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M496,98 L506,98" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M628,137 C 628,166 590,180 550,180 L 168,180 C 128,180 133,166 133,143" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="380" y="206" font-size="12" fill="#1e293b" text-anchor="middle">下一轮再全部读回来</text>
  <text x="380" y="240" font-size="10" fill="#64748b" text-anchor="middle">落盘与搬运成为主导项，算法本身不再是瓶颈；Spark 把中间结果留在内存里正是针对这一条</text>
</svg>
