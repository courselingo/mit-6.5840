<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-mr-1-title fig-mr-1-desc">
  <title id="fig-mr-1-title">一次作业的数据流，以及中间结果为什么留在本地磁盘</title>
  <desc id="fig-mr-1-desc">输入被切成 16MB 到 64MB 的分片，map 读出中间键值对，按 key 分成 R 区先缓存在内存、再落到本地磁盘并上报位置，归约任务用远程调用去拉取、排序后汇总。中间结果只被一个归约任务读一次，写进分布式存储要多付一份副本开销，留在本地磁盘则只需重跑那几个映射任务。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次作业的数据流，以及中间结果为什么留在本地磁盘</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">数据流里最关键的一处：中间结果写到哪里</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">同一份数据，两条路</text>

  <path d="M157,116 L169,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M299,116 L311,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M441,116 L453,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M583,116 L595,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="114" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="95" y="110" font-size="15" fill="#1e40af" text-anchor="middle">输入分片</text>
  <text x="95" y="132" font-size="12" fill="#1e40af" text-anchor="middle">按 16–64MB 切</text>

  <rect x="180" y="82" width="114" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="237" y="110" font-size="15" fill="#b45309" text-anchor="middle">map 任务</text>
  <text x="237" y="132" font-size="12" fill="#b45309" text-anchor="middle">读本地那一片</text>

  <rect x="322" y="82" width="114" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="110" font-size="15" fill="#b45309" text-anchor="middle">按 key 分区</text>
  <text x="379" y="132" font-size="12" fill="#b45309" text-anchor="middle">先缓存在内存里</text>

  <rect x="464" y="82" width="114" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="521" y="110" font-size="15" fill="#6b21a8" text-anchor="middle">落到本地磁盘</text>
  <text x="521" y="132" font-size="12" fill="#6b21a8" text-anchor="middle">并把位置上报</text>

  <rect x="606" y="82" width="114" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="663" y="110" font-size="15" fill="#166534" text-anchor="middle">reduce 拉取</text>
  <text x="663" y="132" font-size="12" fill="#166534" text-anchor="middle">排序后汇总</text>

  <rect x="38" y="216" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="202" y="244" font-size="15" fill="#9d174d" text-anchor="middle">写进分布式存储</text>
  <text x="202" y="266" font-size="12" fill="#9d174d" text-anchor="middle">要多付一份多副本的存储与网络开销</text>

  <rect x="394" y="216" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="244" font-size="15" fill="#166534" text-anchor="middle">留在本地磁盘</text>
  <text x="558" y="266" font-size="12" fill="#166534" text-anchor="middle">机器一死只要重跑那几个映射任务</text>
</svg>
