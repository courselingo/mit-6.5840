<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 343" width="760" height="343"
     role="img" aria-labelledby="fig-mapreduce-17-title fig-mapreduce-17-desc">
  <title id="fig-mapreduce-17-title">多文件提交没有支持：一条要记住的边界</title>
  <desc id="fig-mapreduce-17-desc">框架不提供「一个任务的多个输出原子地一起提交」；多个输出之间有一致性要求时，用户必须保证它是确定性的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="343" fill="#ffffff"/>

  <text x="381.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">多文件提交没有支持：一条要记住的边界</text>

  <rect x="23" y="64" width="345" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.5" y="92" font-size="15" fill="#166534" text-anchor="middle">单文件输出：原子改名就够</text>
  <text x="195.5" y="114" font-size="12" fill="#166534" text-anchor="middle">这是框架提供的那一个动作</text>
  <rect x="394" y="64" width="345" height="68" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566.5" y="92" font-size="15" fill="#9d174d" text-anchor="middle">多文件输出：没有对应动作</text>
  <text x="566.5" y="114" font-size="12" fill="#9d174d" text-anchor="middle">这是接口上留下的一个缺口</text>
  <path d="M380.5,64 L380.5,132" fill="none" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="23" y="160" width="714" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="188" font-size="15" fill="#6b21a8" text-anchor="middle">多个输出有一致性要求时，用户必须保证确定性</text>
  <text x="380.0" y="210" font-size="12" fill="#6b21a8" text-anchor="middle">否则一次重跑可能让两个输出分别来自不同的执行</text>
  <rect x="23" y="256" width="714" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380.0" y="280" font-size="11" fill="#1e293b" text-anchor="middle">论文说实践中这从来不是问题</text>
  <text x="380.0" y="300" font-size="10" fill="#64748b" text-anchor="middle">但它确实是一条需要读者自己记住的边界</text>
</svg>
