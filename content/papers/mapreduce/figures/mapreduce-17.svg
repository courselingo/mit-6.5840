<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-mapreduce-17-title fig-mapreduce-17-desc">
  <title id="fig-mapreduce-17-title">多文件提交没有支持：一条要记住的边界</title>
  <desc id="fig-mapreduce-17-desc">框架不支持把一个任务的多个输出原子地一起提交，多个输出有一致性要求时用户必须保证确定性。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">多文件提交没有支持：一条要记住的边界</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="86" font-size="12" fill="#9d174d" text-anchor="middle">框架不提供</text>
  <text x="135" y="104" font-size="12" fill="#9d174d" text-anchor="middle">多个输出一起原子提交</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">多个输出有一致性要求时</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">用户必须保证它是确定性的</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="86" font-size="12" fill="#9d174d" text-anchor="middle">否则一次重跑可能让两个输出</text>
  <text x="625" y="104" font-size="12" fill="#9d174d" text-anchor="middle">来自不同的执行</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="135" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">单文件时原子改名就够</text>
  <text x="135" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">多文件时没有对应动作</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">论文说实践中不是问题</text>
  <text x="380" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">但它确实是一条边界</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">记住这条边界</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">就知道什么时候不能重跑</text>
</svg>
