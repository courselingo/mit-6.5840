<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-mr-5-title fig-mr-5-desc">
  <title id="fig-mr-5-title">两个函数的契约，以及被框架接手的那部分</title>
  <desc id="fig-mr-5-desc">map 收一条记录、拆成若干中间键值对；reduce 收一个键和它的全部值、合并成更少的值，值以迭代器喂进来以免撑爆内存。其余全部交给框架：输入切 M 份、中间键空间切 R 份、任务派给空闲 worker、谁死了要重跑、数据怎么搬运。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两个函数的契约，以及被框架接手的那部分</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">用户写的就是这两个函数</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">其余全部由框架负责</text>

  <path d="M371,116 L383,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="328" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="202" y="110" font-size="15" fill="#1e40af" text-anchor="middle">map：一条输入记录</text>
  <text x="202" y="132" font-size="12" fill="#1e40af" text-anchor="middle">拆成若干中间键值对</text>

  <rect x="394" y="82" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="110" font-size="15" fill="#166534" text-anchor="middle">reduce：一个键 + 它的全部值</text>
  <text x="558" y="132" font-size="12" fill="#166534" text-anchor="middle">合并成更少的值，值以迭代器喂进来</text>

  <rect x="38" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="142" y="244" font-size="15" fill="#b45309" text-anchor="middle">切成 M 份与 R 份</text>
  <text x="142" y="266" font-size="12" fill="#b45309" text-anchor="middle">输入分片、中间键分区</text>

  <rect x="275" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="244" font-size="15" fill="#b45309" text-anchor="middle">派任务与重跑</text>
  <text x="379" y="266" font-size="12" fill="#b45309" text-anchor="middle">谁死了它那份换个地方重来</text>

  <rect x="512" y="216" width="209" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="616" y="244" font-size="15" fill="#6b21a8" text-anchor="middle">数据怎么搬运</text>
  <text x="616" y="266" font-size="12" fill="#6b21a8" text-anchor="middle">用户不必知道有多少台机器</text>
</svg>
