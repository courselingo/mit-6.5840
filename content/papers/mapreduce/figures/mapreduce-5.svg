<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-mapreduce-5-title fig-mapreduce-5-desc">
  <title id="fig-mapreduce-5-title">两个函数的契约：拆记录与合并同一个键</title>
  <desc id="fig-mapreduce-5-desc">map 把一条记录拆成若干中间键值对，reduce 把一个键和它的全部值合并；值以迭代器喂进来以免撑爆内存。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两个函数的契约：拆记录与合并同一个键</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">一条输入记录进</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">若干中间键值对出</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">map 决定一条记录怎么拆</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">这是用户写的第一件事</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">中间键值对按中间键分组</text>
  <text x="625" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">分组之后才有归约</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="165" font-size="12" fill="#1e40af" text-anchor="middle">一个中间键加上全部值</text>
  <text x="135" y="183" font-size="12" fill="#1e40af" text-anchor="middle">这就是归约的输入</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="165" font-size="12" fill="#b45309" text-anchor="middle">reduce 决定怎么合并</text>
  <text x="380" y="183" font-size="12" fill="#b45309" text-anchor="middle">通常合成一个值</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">值以迭代器喂进来</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">装不下内存也不会撑爆</text>
</svg>
