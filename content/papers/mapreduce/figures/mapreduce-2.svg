<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516 419" width="516" height="419"
     role="img" aria-labelledby="fig-mapreduce-2-title fig-mapreduce-2-desc">
  <title id="fig-mapreduce-2-title">分区函数与 reducer 负载倾斜</title>
  <desc id="fig-mapreduce-2-desc">三个键经过 hash(key) mod 3 进入三个归约分区，同一个键永远落进同一格；键的分布不均时，热点键所在的那个 reducer 承担大部分值，其余 reducer 早早做完干等，全局完成时间由最慢的那个决定。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="516" height="419" fill="#ffffff"/>

  <text x="258" y="37" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">分区函数与 reducer 负载倾斜</text>

  <rect x="22" y="70" width="140" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="92" y="92" font-size="12" fill="#1e40af" text-anchor="middle">key = the</text>
  <text x="92" y="110" font-size="12" fill="#1e40af" text-anchor="middle">值 5000 个</text>

  <rect x="188" y="70" width="140" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="258" y="92" font-size="12" fill="#1e40af" text-anchor="middle">key = cat</text>
  <text x="258" y="110" font-size="12" fill="#1e40af" text-anchor="middle">值 10 个</text>

  <rect x="354" y="70" width="140" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="424" y="92" font-size="12" fill="#1e40af" text-anchor="middle">key = dog</text>
  <text x="424" y="110" font-size="12" fill="#1e40af" text-anchor="middle">值 10 个</text>

  <rect x="22" y="150" width="472" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="258" y="172" font-size="12" fill="#b45309" text-anchor="middle">分区函数 hash(key) mod 3</text>
  <text x="258" y="190" font-size="12" fill="#b45309" text-anchor="middle">同一个 key 必进同一个分区</text>

  <rect x="22" y="230" width="140" height="72" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="92" y="252" font-size="12" fill="#9d174d" text-anchor="middle">reducer 0</text>
  <text x="92" y="270" font-size="12" fill="#9d174d" text-anchor="middle">负载 80%</text>
  <text x="92" y="288" font-size="12" fill="#9d174d" text-anchor="middle">其余干等</text>

  <rect x="188" y="230" width="140" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="258" y="252" font-size="12" fill="#6b21a8" text-anchor="middle">reducer 1</text>
  <text x="258" y="270" font-size="12" fill="#6b21a8" text-anchor="middle">负载 10%</text>

  <rect x="354" y="230" width="140" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="424" y="252" font-size="12" fill="#6b21a8" text-anchor="middle">reducer 2</text>
  <text x="424" y="270" font-size="12" fill="#6b21a8" text-anchor="middle">负载 10%</text>

  <path d="M92,129 L 92,139" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M258,129 L 258,139" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M424,129 L 424,139" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <path d="M92,209 L 92,219" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M258,209 L 258,219" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M424,209 L 424,219" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="330" width="472" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="258" y="354" font-size="11" fill="#1e293b" text-anchor="middle">同一个 key 必进同一格，这是分区函数的保证</text>
  <text x="258" y="374" font-size="10" fill="#64748b" text-anchor="middle">但热点 key 会让一个 reducer 变成全局瓶颈</text>
</svg>
