<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 327" width="760" height="327"
     role="img" aria-labelledby="fig-mapreduce-19-title fig-mapreduce-19-desc">
  <title id="fig-mapreduce-19-title">不起眼的成本：启动、元数据与本地磁盘带宽</title>
  <desc id="fig-mapreduce-19-desc">grep 测试 150 秒里约一分钟是启动开销，排序测试的输入速率低于 grep，因为映射任务有一半时间花在把中间结果写本地磁盘上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="327" fill="#ffffff"/>

  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">不起眼的成本：启动、元数据与本地磁盘带宽</text>

  <text x="23" y="104" font-size="12" fill="#1e293b" text-anchor="start">grep 测试</text>
  <path d="M260,100 L700,100" fill="none" stroke="#94a3b8"/>
  <path d="M260,92 L260,108" fill="none" stroke="#94a3b8"/>
  <path d="M420,92 L420,108" fill="none" stroke="#94a3b8"/>
  <path d="M700,92 L700,108" fill="none" stroke="#94a3b8"/>
  <text x="340" y="76" font-size="11" fill="#9d174d" text-anchor="middle">启动开销约一分钟</text>
  <text x="600" y="76" font-size="11" fill="#64748b" text-anchor="middle">总耗时约 150 秒</text>
  <text x="23" y="194" font-size="12" fill="#1e293b" text-anchor="start">排序测试</text>
  <path d="M260,190 L700,190" fill="none" stroke="#94a3b8"/>
  <path d="M260,182 L260,198" fill="none" stroke="#94a3b8"/>
  <path d="M480,182 L480,198" fill="none" stroke="#94a3b8"/>
  <path d="M700,182 L700,198" fill="none" stroke="#94a3b8"/>
  <text x="370" y="166" font-size="11" fill="#9d174d" text-anchor="middle">一半时间在写本地磁盘</text>
  <text x="620" y="166" font-size="11" fill="#64748b" text-anchor="middle">输入速率低于 grep</text>
  <rect x="22" y="240" width="716" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380.0" y="264" font-size="11" fill="#1e293b" text-anchor="middle">启动、元数据与本地磁盘带宽这些不起眼的地方，往往决定实测能跑多快</text>
  <text x="380.0" y="284" font-size="10" fill="#64748b" text-anchor="middle">排序测试的映射任务有一半时间在写中间结果，那是本地 I/O 的账</text>
</svg>
