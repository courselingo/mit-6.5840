<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 347" width="760" height="347"
     role="img" aria-labelledby="fig-mapreduce-20-title fig-mapreduce-20-desc">
  <title id="fig-mapreduce-20-title">确定性假设的边界：重跑在哪里不再成立</title>
  <desc id="fig-mapreduce-20-desc">重跑能成立是因为计算被限定成确定性函数加一次扫描；一旦要维护可变状态、或多个作业看到同一个一致视图，就必须引入副本与共识。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="347" fill="#ffffff"/>

  <text x="380.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">确定性假设的边界：重跑在哪里不再成立</text>

  <rect x="23" y="64" width="345" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.5" y="92" font-size="15" fill="#166534" text-anchor="middle">重跑能成立</text>
  <text x="195.5" y="114" font-size="12" fill="#166534" text-anchor="middle">计算被限定成确定性函数</text>
  <rect x="394" y="64" width="345" height="68" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566.5" y="92" font-size="15" fill="#9d174d" text-anchor="middle">越界第一步</text>
  <text x="566.5" y="114" font-size="12" fill="#9d174d" text-anchor="middle">要维护一份可变的共享状态</text>
  <rect x="394" y="160" width="345" height="68" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566.5" y="188" font-size="15" fill="#9d174d" text-anchor="middle">越界第二步</text>
  <text x="566.5" y="210" font-size="12" fill="#9d174d" text-anchor="middle">多个作业要看同一个一致视图</text>
  <text x="23" y="240" font-size="11" fill="#9d174d" text-anchor="start">边界就在这里：重跑只对确定性与一次扫描成立</text>
  <rect x="22" y="256" width="716" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="284" font-size="15" fill="#6b21a8" text-anchor="middle">越出这条边界，重跑就不再是正确的答案</text>
  <text x="380.0" y="306" font-size="12" fill="#6b21a8" text-anchor="middle">必须引入副本与共识：区别不是谁更先进，而是代价放在哪一侧</text>
</svg>
