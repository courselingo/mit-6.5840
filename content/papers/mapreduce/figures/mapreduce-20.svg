<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-mapreduce-20-title fig-mapreduce-20-desc">
  <title id="fig-mapreduce-20-title">确定性假设的边界</title>
  <desc id="fig-mapreduce-20-desc">重跑能成立是靠确定性假设；一旦要维护可变状态或多个作业看同一个一致视图，就必须引入副本与共识。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">确定性假设的边界</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">重跑能成立</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">是因为计算被限定成确定性函数</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">一旦要维护一份可变状态</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">重跑就不再是正确的答案</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="86" font-size="12" fill="#9d174d" text-anchor="middle">多个作业要看同一个视图</text>
  <text x="625" y="104" font-size="12" fill="#9d174d" text-anchor="middle">也一样</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="135" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">这时必须引入副本与共识</text>
  <text x="135" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">也就是后面几讲的内容</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">把这篇论文和 Raft 放在一起</text>
  <text x="380" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">对照非常清楚</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">重跑绕开共识</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">代价是计算形态被限定</text>
</svg>
