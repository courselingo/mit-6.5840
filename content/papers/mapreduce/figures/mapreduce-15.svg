<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-mapreduce-15-title fig-mapreduce-15-desc">
  <title id="fig-mapreduce-15-title">主节点同时是三件事，也因此成了约束</title>
  <desc id="fig-mapreduce-15-desc">主节点同时是调度者、中间结果位置的中转站与状态页面提供者，O(M×R) 的状态限制了作业规模。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">主节点同时是三件事，也因此成了约束</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">调度者：把空闲 worker</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">和待办任务配对</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">中间结果位置的唯一中转站</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">归约器靠它找到数据</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="86" font-size="12" fill="#b45309" text-anchor="middle">状态页面的提供者</text>
  <text x="625" y="104" font-size="12" fill="#b45309" text-anchor="middle">用户靠它看进度</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">三件事压在一个角色上</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">它就是结构上的中心</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="165" font-size="12" fill="#9d174d" text-anchor="middle">作业规模上限</text>
  <text x="380" y="183" font-size="12" fill="#9d174d" text-anchor="middle">被它的内存与调度能力限住</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="165" font-size="12" fill="#9d174d" text-anchor="middle">O(M×R) 的状态</text>
  <text x="625" y="183" font-size="12" fill="#9d174d" text-anchor="middle">就是这条约束的明证</text>
</svg>
