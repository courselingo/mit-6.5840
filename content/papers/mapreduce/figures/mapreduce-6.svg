<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 273" width="760" height="273"
     role="img" aria-labelledby="fig-mapreduce-6-title fig-mapreduce-6-desc">
  <title id="fig-mapreduce-6-title">机器一死：该重跑的只有映射任务</title>
  <desc id="fig-mapreduce-6-desc">两组任务分开看：映射任务的输出躺在死掉那台机器的本地磁盘上，所以要退回重跑；归约任务的输出已经在分布式文件系统里，不用重跑。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="273" fill="#ffffff"/>

  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">机器一死：该重跑的只有映射任务</text>

  <rect x="23" y="64" width="345" height="105" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="39" y="86" font-size="11" fill="#1e293b" text-anchor="start">要重跑：输出在死机那台上</text>
  <rect x="38" y="100" width="315" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.5" y="122" font-size="12" fill="#9d174d" text-anchor="middle">映射任务的输出</text>
  <text x="195.5" y="140" font-size="12" fill="#9d174d" text-anchor="middle">躺在死掉那台机器的磁盘上</text>
  <rect x="392" y="64" width="345" height="105" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="408" y="86" font-size="11" fill="#1e293b" text-anchor="start">不用重跑：输出已在文件系统</text>
  <rect x="407" y="100" width="315" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="564.5" y="122" font-size="12" fill="#166534" text-anchor="middle">归约任务的输出</text>
  <text x="564.5" y="140" font-size="12" fill="#166534" text-anchor="middle">已经在分布式文件系统里</text>
  <rect x="23" y="182" width="714" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380.0" y="210" font-size="15" fill="#b45309" text-anchor="middle">主节点定期 ping 每台 worker，超时未响应就判失败</text>
  <text x="380.0" y="232" font-size="12" fill="#b45309" text-anchor="middle">正在跑的归约器会收到通知：还没读过旧位置数据的，改去新位置拉</text>
</svg>
