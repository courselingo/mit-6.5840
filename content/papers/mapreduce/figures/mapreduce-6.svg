<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-mr-6-title fig-mr-6-desc">
  <title id="fig-mr-6-title">失败之后谁要重跑，以及输出为什么只会有一份</title>
  <desc id="fig-mr-6-desc">主节点定期 ping 每台 worker，超时即标为失败：映射任务要重跑，因为输出躺在死掉那台的本地磁盘上；归约任务不用重跑，因为输出已经在文件系统里，重跑后主节点通知还没读旧位置的那些改去新位置读。主节点自己挂掉时，当时的实现选择中止整个作业；任务先写私有临时文件、完成时原子改名，所以跑两遍也只剩一份结果。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">失败之后谁要重跑，以及输出为什么只会有一份</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">一台 worker 失联之后</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">两个已经被明确记下来的取舍</text>

  <rect x="38" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="142" y="110" font-size="15" fill="#9d174d" text-anchor="middle">映射任务要重跑</text>
  <text x="142" y="132" font-size="12" fill="#9d174d" text-anchor="middle">输出躺在死掉那台的本地磁盘</text>

  <rect x="275" y="82" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379" y="110" font-size="15" fill="#166534" text-anchor="middle">归约任务不用重跑</text>
  <text x="379" y="132" font-size="12" fill="#166534" text-anchor="middle">输出已经在文件系统里</text>

  <rect x="512" y="82" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="616" y="110" font-size="15" fill="#b45309" text-anchor="middle">重跑之后要通知</text>
  <text x="616" y="132" font-size="12" fill="#b45309" text-anchor="middle">还没读旧位置的改去新位置</text>

  <rect x="38" y="216" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="142" y="244" font-size="15" fill="#9d174d" text-anchor="middle">主节点自己挂掉</text>
  <text x="142" y="266" font-size="12" fill="#9d174d" text-anchor="middle">当时选择中止整个作业</text>

  <rect x="275" y="216" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379" y="244" font-size="15" fill="#166534" text-anchor="middle">先写私有临时文件</text>
  <text x="379" y="266" font-size="12" fill="#166534" text-anchor="middle">完成时原子改名成最终文件</text>

  <rect x="512" y="216" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="244" font-size="15" fill="#166534" text-anchor="middle">跑两遍也只剩一份</text>
  <text x="616" y="266" font-size="12" fill="#166534" text-anchor="middle">重复的完成消息被忽略</text>
</svg>
