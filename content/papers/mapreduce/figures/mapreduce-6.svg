<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-mapreduce-6-title fig-mapreduce-6-desc">
  <title id="fig-mapreduce-6-title">机器一死：该重跑的只有映射任务</title>
  <desc id="fig-mapreduce-6-desc">映射任务的输出在死掉那台机器的本地磁盘上，所以要重跑；归约任务的输出已在文件系统里，不用重跑。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">机器一死：该重跑的只有映射任务</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="86" font-size="12" fill="#9d174d" text-anchor="middle">映射任务的输出</text>
  <text x="135" y="104" font-size="12" fill="#9d174d" text-anchor="middle">躺在死掉那台机器的磁盘上</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">所以已完成的映射任务</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">要退回重跑</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="86" font-size="12" fill="#b45309" text-anchor="middle">正在跑的归约器收到通知</text>
  <text x="625" y="104" font-size="12" fill="#b45309" text-anchor="middle">改去新位置拉数据</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="165" font-size="12" fill="#166534" text-anchor="middle">归约任务的输出</text>
  <text x="135" y="183" font-size="12" fill="#166534" text-anchor="middle">已经在分布式文件系统里</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="165" font-size="12" fill="#166534" text-anchor="middle">所以已完成的归约任务</text>
  <text x="380" y="183" font-size="12" fill="#166534" text-anchor="middle">不用重跑</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">主节点定期 ping 每台 worker</text>
  <text x="625" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">超时就判失败</text>
</svg>
