<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-mr-12-title fig-mr-12-desc">
  <title id="fig-mr-12-title">坏记录会卡死作业，以及那些不属于漂亮机制的成本</title>
  <desc id="fig-mr-12-desc">用户代码如果在某条记录上确定性崩溃，整个作业永远完不成；框架的办法是让 worker 把当前记录序号用一条「最后的话」报文报给主节点，同一条失败超过一次就在重跑时跳过它。另一类成本藏在实测里：grep 的 150 秒里约一分钟是启动开销，排序测试一半时间花在把中间结果写本地磁盘上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">坏记录会卡死作业，以及那些不属于漂亮机制的成本</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">一条记录让用户代码确定性地崩溃</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">启动、元数据与本地磁盘带宽</text>

  <rect x="38" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="142" y="110" font-size="15" fill="#9d174d" text-anchor="middle">作业永远完不成</text>
  <text x="142" y="132" font-size="12" fill="#9d174d" text-anchor="middle">重跑还是卡在同一条记录上</text>

  <rect x="275" y="82" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="110" font-size="15" fill="#b45309" text-anchor="middle">worker 报出序号</text>
  <text x="379" y="132" font-size="12" fill="#b45309" text-anchor="middle">装信号处理器，用「最后的话」上报</text>

  <rect x="512" y="82" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="110" font-size="15" fill="#166534" text-anchor="middle">失败超过一次就跳过</text>
  <text x="616" y="132" font-size="12" fill="#166534" text-anchor="middle">作业能跑完，代价是结果不完整</text>

  <rect x="38" y="216" width="684" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="244" font-size="15" fill="#6b21a8" text-anchor="middle">grep 的 150 秒里约一分钟是启动开销：分发程序、打开上千个输入文件、取本地性信息</text>
  <text x="380" y="266" font-size="12" fill="#6b21a8" text-anchor="middle">排序测试有一半时间在把中间结果写本地磁盘：性能上限不只在算法</text>
</svg>
