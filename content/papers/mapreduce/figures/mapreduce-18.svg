<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264"
     role="img" aria-labelledby="fig-mapreduce-18-title fig-mapreduce-18-desc">
  <title id="fig-mapreduce-18-title">职责三分：用户、框架与主节点</title>
  <desc id="fig-mapreduce-18-desc">用户只写两个函数，切分、分派、重跑与搬运全由框架接管，主节点把空闲 worker 与待办任务配对；分区、调度、容错三件事划给框架，没有做成可插拔的库。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="264" fill="#ffffff"/>

  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">职责三分：用户、框架与主节点</text>

  <rect x="23" y="64" width="714" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="39" y="88" font-size="12" fill="#1e293b" text-anchor="start">框架负责：切分、分派、重跑、搬运与等待结束</text>
  <rect x="39" y="100" width="328" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="203.0" y="128" font-size="15" fill="#1e40af" text-anchor="middle">用户只写两个函数</text>
  <text x="203.0" y="150" font-size="12" fill="#1e40af" text-anchor="middle">决定怎么拆、怎么合</text>
  <rect x="395" y="100" width="328" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="559.0" y="128" font-size="15" fill="#b45309" text-anchor="middle">主节点把空闲 worker</text>
  <text x="559.0" y="150" font-size="12" fill="#b45309" text-anchor="middle">与待办任务配对</text>
  <text x="380" y="212" font-size="11" fill="#1e293b" text-anchor="middle">分区、调度、容错三件事划给框架，没有做成可插拔的库</text>
  <text x="380" y="238" font-size="10" fill="#64748b" text-anchor="middle">用户不必知道集群里有多少台机器、也不必知道哪台死了；默认足够好、例外才开口</text>
</svg>
