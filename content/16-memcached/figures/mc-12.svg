<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 294" width="760" height="294"
     role="img" aria-labelledby="fig-mc-12-title fig-mc-12-desc">
  <title id="fig-mc-12-title">租约的两个作用：堵惊群，以及作废一次已排队的写回</title>
  <desc id="fig-mc-12-desc">上面两格对照租约在两个地方的不同作用：惊群那一段是只让第一个未命中的客户端去数据库，避免很多客户端同时扑向同一份数据；竞态二那一段是删掉这个键时把该键上的租约一并作废，于是 C1 那次已经排队的写回被忽略。下面是竞态二依次发生的四步：C1 get 未命中并拿到租约、C2 写 v2 并 delete、delete 把该键的租约作废、C1 的 put 被忽略，键仍然缺失。结论是下一个读者去数据库重新取，取到的是 v2，这份陈旧没有留在缓存里。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="294" fill="#ffffff"/>

  <text x="380" y="37" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">租约的两个作用：堵惊群，以及作废一次已排队的写回</text>
  <rect x="25" y="72" width="342.5" height="60.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="90.5" font-size="10" fill="#1e40af" text-anchor="middle">惊群那一段：租约的作用</text>
  <text x="196.25" y="105.5" font-size="10" fill="#1e40af" text-anchor="middle">只让第一个未命中的客户端去读数据库</text>
  <text x="196.25" y="120.5" font-size="10" fill="#1e40af" text-anchor="middle">避免很多客户端同时扑向同一份数据</text>
  <rect x="392.5" y="72" width="342.5" height="60.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="90.5" font-size="10" fill="#b45309" text-anchor="middle">竞态二这一段：租约的作用</text>
  <text x="563.75" y="105.5" font-size="10" fill="#b45309" text-anchor="middle">删掉这个键时把它上面的租约一并作废</text>
  <text x="563.75" y="120.5" font-size="10" fill="#b45309" text-anchor="middle">于是 C1 那次已经排队的写回被忽略</text>
  <rect x="22.5" y="160" width="160" height="54.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="102.5" y="182.2" font-size="12" fill="#1e40af" text-anchor="middle">① C1 get 未命中</text>
  <text x="102.5" y="200.2" font-size="12" fill="#1e40af" text-anchor="middle">memcached 发租约</text>
  <rect x="207.5" y="160" width="160" height="54.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287.5" y="182.2" font-size="12" fill="#b45309" text-anchor="middle">② C2 写 v2</text>
  <text x="287.5" y="200.2" font-size="12" fill="#b45309" text-anchor="middle">并 delete(k)</text>
  <rect x="392.5" y="160" width="160" height="54.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472.5" y="182.2" font-size="12" fill="#b45309" text-anchor="middle">③ delete 到达</text>
  <text x="472.5" y="200.2" font-size="12" fill="#b45309" text-anchor="middle">该键的租约作废</text>
  <rect x="577.5" y="160" width="160" height="54.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="657.5" y="182.2" font-size="12" fill="#9d174d" text-anchor="middle">④ C1 才 put</text>
  <text x="657.5" y="200.2" font-size="12" fill="#9d174d" text-anchor="middle">被忽略，键仍缺失</text>
  <path d="M187.5,187 L 196.5,187" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M372.5,187 L 381.5,187" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M557.5,187 L 566.5,187" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="22.5" y="242" width="715" height="27.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="258.65" font-size="9" fill="#166534" text-anchor="middle">下一个读者去数据库重新取，取到的是 v2；这份陈旧没有留在缓存里</text>
</svg>
