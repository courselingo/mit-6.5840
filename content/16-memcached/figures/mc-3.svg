<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384"
     role="img" aria-labelledby="fig-mc-3-title fig-mc-3-desc">
  <title id="fig-mc-3-title">memcached 与旁路缓存：两段伪码，以及那笔 99% 的账</title>
  <desc id="fig-mc-3-desc">第一排三格是 memcached 是什么：简单的键值服务器、只有 put 与 get 与 delete；数据在内存里因此快，但不持久也没有复制，内存有限所以用 LRU 淘汰；部署方式是通常很多台，而由客户端决定什么存到哪台。第二排三格是那两段伪码与那笔账：读时先哈希挑出该找哪台、get 未命中就查数据库再 put；写时先把键值发给数据库、再哈希后对那台 delete；收益与用意是命中率约 99 意味着数据库读负载降到约百分之一，而命中率掉 1 个百分点会让数据库负载翻倍，因此这套缓存是为了保护数据库、不是为了减少用户看到的延迟。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>
  <g transform="translate(0,-1)">

  <rect x="0" y="0" width="760" height="387" fill="#ffffff"/>

  <text x="380" y="38" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">memcached 与旁路缓存：两段伪码，以及那笔 99% 的账</text>
  <rect x="25" y="72" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="90.5" font-size="10" fill="#1e40af" text-anchor="middle">memcached 是什么</text>
  <text x="135" y="105.5" font-size="10" fill="#1e40af" text-anchor="middle">简单的键值服务器</text>
  <text x="135" y="120.5" font-size="10" fill="#1e40af" text-anchor="middle">只有 put、get 与 delete</text>
  <rect x="270" y="72" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="90.5" font-size="10" fill="#1e40af" text-anchor="middle">内存里因此快</text>
  <text x="380" y="105.5" font-size="10" fill="#1e40af" text-anchor="middle">但不持久、也没有复制</text>
  <text x="380" y="120.5" font-size="10" fill="#1e40af" text-anchor="middle">内存有限所以用 LRU 淘汰</text>
  <rect x="515" y="72" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="91.65" font-size="9" fill="#1e40af" text-anchor="middle">部署方式</text>
  <text x="625" y="105.15" font-size="9" fill="#1e40af" text-anchor="middle">通常很多台</text>
  <text x="625" y="118.65" font-size="9" fill="#1e40af" text-anchor="middle">由客户端决定什么存到哪台</text>
  <rect x="25" y="160" width="342.5" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="178.5" font-size="10" fill="#166534" text-anchor="middle">读的伪码</text>
  <text x="196.25" y="193.5" font-size="10" fill="#166534" text-anchor="middle">先哈希挑出该找哪台</text>
  <text x="196.25" y="208.5" font-size="10" fill="#166534" text-anchor="middle">get 未命中就查数据库再 put</text>
  <rect x="392.5" y="160" width="342.5" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="178.5" font-size="10" fill="#166534" text-anchor="middle">写的伪码</text>
  <text x="563.75" y="193.5" font-size="10" fill="#166534" text-anchor="middle">先把键值发给数据库</text>
  <text x="563.75" y="208.5" font-size="10" fill="#166534" text-anchor="middle">再哈希后对那台 delete</text>
  <rect x="25" y="248" width="342.5" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="196.25" y="264.65" font-size="9" fill="#b45309" text-anchor="middle">收益</text>
  <text x="196.25" y="278.15" font-size="9" fill="#b45309" text-anchor="middle">命中率约 99</text>
  <text x="196.25" y="291.65" font-size="9" fill="#b45309" text-anchor="middle">数据库读负载降到约百分之一</text>
  <rect x="392.5" y="248" width="342.5" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="264.65" font-size="9" fill="#b45309" text-anchor="middle">而它同时警告</text>
  <text x="563.75" y="278.15" font-size="9" fill="#b45309" text-anchor="middle">命中率掉 1 个百分点</text>
  <text x="563.75" y="291.65" font-size="9" fill="#b45309" text-anchor="middle">数据库负载就翻倍</text>
  <rect x="25" y="330" width="710" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="348.5" font-size="10" fill="#b45309" text-anchor="middle">用意：不是为了减少用户看到的延迟，而是为了保护数据库不被海量请求压垮</text>
  </g>
</svg>
