<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260"
     role="img" aria-labelledby="fig-mc-1-title fig-mc-1-desc">
  <title id="fig-mc-1-title">这一讲要解决什么：性能、一致性、实用性三者的取舍</title>
  <desc id="fig-mc-1-desc">上面一条说明这一讲的阅读材料是一篇经验论文，它要回答的是怎么把一个已经很大的系统做大。第二排三格是这篇论文的三个价值：它是经验论文、讲一套真实系统怎么被撑起来；它把遇到的问题与解法都写出来，而不是只讲结论；它是一个看真实世界的窗口，取舍都在里面。最下面一条是贯穿全篇的那条取舍：性能、一致性、实用性三者之间的平衡。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>
  <g transform="translate(0,-1)">

  <rect x="0" y="0" width="760" height="263" fill="#ffffff"/>

  <text x="380" y="38" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲要解决什么：性能、一致性、实用性三者的取舍</text>
  <rect x="25" y="72" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="92.35" font-size="11" fill="#1e40af" text-anchor="middle">这一讲的阅读材料是一篇经验论文：它要回答的是怎么把一个已经很大的系统做大</text>
  <rect x="25" y="133" width="220" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="151.5" font-size="10" fill="#1e40af" text-anchor="middle">它是经验论文</text>
  <text x="135" y="166.5" font-size="10" fill="#1e40af" text-anchor="middle">讲一套真实系统怎么被撑起来</text>
  <rect x="270" y="133" width="220" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="151.5" font-size="10" fill="#1e40af" text-anchor="middle">它把问题与解法都写出来</text>
  <text x="380" y="166.5" font-size="10" fill="#1e40af" text-anchor="middle">不是只讲结论</text>
  <rect x="515" y="133" width="220" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="151.5" font-size="10" fill="#1e40af" text-anchor="middle">它是一个看真实世界的窗口</text>
  <text x="625" y="166.5" font-size="10" fill="#1e40af" text-anchor="middle">取舍都在里面</text>
  <rect x="25" y="206" width="710" height="30" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="224.5" font-size="10" fill="#6b21a8" text-anchor="middle">贯穿全篇的取舍：性能、一致性、实用性三者之间的平衡</text>
  </g>
</svg>
