<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 223" width="760" height="223"
     role="img" aria-labelledby="fig-mc-9-title fig-mc-9-desc">
  <title id="fig-mc-9-title">论文给存储系统设计者的三条教训</title>
  <desc id="fig-mc-9-desc">上面一条说明这张图收的是这篇论文给存储系统设计者的三条教训。下面三格分别是：缓存是扛住高负载的关键，而不只是用来降低延迟；需要灵活的工具来控制分片与复制；线性一致性太重，而最终一致又常常不够。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>
  <g transform="translate(0,-1)">

  <rect x="0" y="0" width="760" height="226" fill="#ffffff"/>

  <text x="380" y="38" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">论文给存储系统设计者的三条教训</text>
  <rect x="25" y="72" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="92.35" font-size="11" fill="#1e40af" text-anchor="middle">这篇论文给存储系统设计者的三条教训</text>
  <rect x="25" y="133" width="220" height="66" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="153.35" font-size="11" fill="#1e40af" text-anchor="middle">教训一</text>
  <text x="135" y="169.85" font-size="11" fill="#1e40af" text-anchor="middle">缓存是扛住高负载的关键</text>
  <text x="135" y="186.35" font-size="11" fill="#1e40af" text-anchor="middle">而不只是用来降低延迟</text>
  <rect x="270" y="133" width="220" height="66" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="153.35" font-size="11" fill="#166534" text-anchor="middle">教训二</text>
  <text x="380" y="169.85" font-size="11" fill="#166534" text-anchor="middle">需要灵活的工具</text>
  <text x="380" y="186.35" font-size="11" fill="#166534" text-anchor="middle">来控制分片与复制</text>
  <rect x="515" y="133" width="220" height="66" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="153.35" font-size="11" fill="#6b21a8" text-anchor="middle">教训三</text>
  <text x="625" y="169.85" font-size="11" fill="#6b21a8" text-anchor="middle">线性一致性太重</text>
  <text x="625" y="186.35" font-size="11" fill="#6b21a8" text-anchor="middle">而最终一致又常常不够</text>
  </g>
</svg>
