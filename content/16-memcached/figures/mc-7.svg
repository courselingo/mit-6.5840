<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"
     role="img" aria-labelledby="fig-mc-7-title fig-mc-7-desc">
  <title id="fig-mc-7-title">论文的写与读各自给到什么保证</title>
  <desc id="fig-mc-7-desc">上面一条说明这张图讲的是写与读各自给到什么保证。第二排三格是：写直接进主数据库、带事务，所以数据库自己是自洽的；读不保证看到最近一次写，不同客户端看到的也不一定相同；但陈旧得有限，只有几秒钟，也就是最终一致。第三条补充另一条要求：读到自己的写，以及这是一个常见模式——更新是 ACID 的因此慢，读不很一致但快。最下面一条说明为什么可接受：这些是新闻流、帖子、点赞这类数据。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>
  <g transform="translate(0,-1)">

  <rect x="0" y="0" width="760" height="333" fill="#ffffff"/>

  <text x="380" y="38" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">论文的写与读各自给到什么保证</text>
  <rect x="25" y="72" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="92.35" font-size="11" fill="#1e40af" text-anchor="middle">这篇论文的写与读各自给到什么保证</text>
  <rect x="25" y="133" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="151.5" font-size="10" fill="#166534" text-anchor="middle">写</text>
  <text x="135" y="166.5" font-size="10" fill="#166534" text-anchor="middle">直接进主数据库、带事务</text>
  <text x="135" y="181.5" font-size="10" fill="#166534" text-anchor="middle">所以数据库自己是自洽的</text>
  <rect x="270" y="133" width="220" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="151.5" font-size="10" fill="#b45309" text-anchor="middle">读</text>
  <text x="380" y="166.5" font-size="10" fill="#b45309" text-anchor="middle">不保证看到最近一次写</text>
  <text x="380" y="181.5" font-size="10" fill="#b45309" text-anchor="middle">不同客户端看到的也不一定相同</text>
  <rect x="515" y="133" width="220" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="151.5" font-size="10" fill="#b45309" text-anchor="middle">但陈旧得有限</text>
  <text x="625" y="166.5" font-size="10" fill="#b45309" text-anchor="middle">只有几秒钟</text>
  <text x="625" y="181.5" font-size="10" fill="#b45309" text-anchor="middle">也就是最终一致</text>
  <rect x="25" y="221" width="710" height="30" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="239.5" font-size="10" fill="#6b21a8" text-anchor="middle">另外还要求：读到自己的写。这是一个常见模式：更新是 ACID 的因此慢，读不很一致但快</text>
  <rect x="25" y="279" width="710" height="27" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="295.65" font-size="9" fill="#1e293b" text-anchor="middle">为什么可接受：这些是新闻流、帖子、点赞这类数据，用户看到稍微滞后的内容很少有人在意；下次再看时缓存大概率已经追上</text>
  </g>
</svg>
