<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330.5" width="760" height="330.5"
     role="img" aria-labelledby="fig-mc-10-title fig-mc-10-desc">
  <title id="fig-mc-10-title">region 内部为什么不是一个簇，以及区域池与冷启动</title>
  <desc id="fig-mc-10-desc">上面一条说明这张图讲的是 region 内部为什么不是一个簇。第二排三格是三条理由：加更多缓存机对极热门键没有帮助，而复制（每个簇一份）能帮上；簇越大分片越细，每个视图要发更多包，回来的响应更容易造成入拥塞；为一个大簇建网络很难，因为它需要任意到任意的访问，而两个簇能把横向带宽需求减半。第四条是区域池：给所有簇共用，放那些不需要多份拷贝的对象，从而腾出缓存机去复制更热门的对象。最下面一条是新簇冷启动：新簇命中率是 0、会让数据库出现尖峰，于是让新簇的客户端先去老簇取、再放进新簇，相当于把老簇懒复制过来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="330.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">region 内部为什么不是一个簇，以及区域池与冷启动</text>
  <rect x="25" y="64" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">region 内部为什么不是一个簇，以及区域池与冷启动</text>
  <rect x="25" y="125" width="220" height="67.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="147.25" font-size="10" fill="#b45309" text-anchor="middle">理由一</text>
  <text x="135" y="162.25" font-size="10" fill="#b45309" text-anchor="middle">加更多缓存机对极热门键没有帮助</text>
  <text x="135" y="177.25" font-size="10" fill="#b45309" text-anchor="middle">而复制（每簇一份）能帮上</text>
  <rect x="270" y="125" width="220" height="67.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="141.65" font-size="9" fill="#b45309" text-anchor="middle">理由二</text>
  <text x="380" y="155.15" font-size="9" fill="#b45309" text-anchor="middle">簇越大分片越细</text>
  <text x="380" y="168.65" font-size="9" fill="#b45309" text-anchor="middle">每个视图要发更多包</text>
  <text x="380" y="182.15" font-size="9" fill="#b45309" text-anchor="middle">回来的响应更容易造成入拥塞</text>
  <rect x="515" y="125" width="220" height="67.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="141.65" font-size="9" fill="#b45309" text-anchor="middle">理由三</text>
  <text x="625" y="155.15" font-size="9" fill="#b45309" text-anchor="middle">为一个大簇建网络很难</text>
  <text x="625" y="168.65" font-size="9" fill="#b45309" text-anchor="middle">需要任意到任意的访问</text>
  <text x="625" y="182.15" font-size="9" fill="#b45309" text-anchor="middle">两个簇能把横向带宽需求减半</text>
  <rect x="25" y="220.5" width="710" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="239" font-size="10" fill="#1e293b" text-anchor="middle">区域池：给所有簇共用，放那些不需要多份拷贝的对象，从而腾出缓存机去复制更热门的对象</text>
  <rect x="25" y="278.5" width="710" height="27" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="295.15" font-size="9" fill="#6b21a8" text-anchor="middle">新簇冷启动：新簇命中率是 0，会让数据库出现尖峰；于是让新簇的客户端先去老簇取、再放进新簇，相当于把老簇懒复制过来</text>
</svg>
