<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 235" width="760" height="235"
     role="img" aria-labelledby="fig-ray-ray-7-title fig-ray-ray-7-desc">
  <title id="fig-ray-ray-7-title">按 ownership 分片：不必联系 B</title>
  <desc id="fig-ray-ray-7-desc">A 与 C 之间有一条水平直连箭头，标注这次调用按 ownership 直接进行、不经过 B；B 单独放在下方并持有 x 的值。所有权在调用者，值留在算它的 worker 上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="235" fill="#ffffff"/>

  <text x="380" y="32" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">按 ownership 分片：不必联系 B</text>
  <rect x="22" y="56" width="344" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="78.2" font-size="12" fill="#1e40af" text-anchor="middle">A（worker 1）</text>
  <text x="194" y="96.2" font-size="12" fill="#1e40af" text-anchor="middle">所有者在调用者这一侧</text>
  <rect x="394" y="56" width="344" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="78.2" font-size="12" fill="#166534" text-anchor="middle">C（worker 3）</text>
  <text x="566" y="96.2" font-size="12" fill="#166534" text-anchor="middle">借用 x，继续做引用计数</text>
  <path d="M371,83.0 L383,83.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="126" font-size="10" fill="#64748b" text-anchor="middle">按 ownership 直接调，不经过 B</text>
  <rect x="255" y="135" width="250" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="157.2" font-size="12" fill="#b45309" text-anchor="middle">B（worker 2）</text>
  <text x="380" y="175.2" font-size="12" fill="#b45309" text-anchor="middle">x 的值存在这里</text>
  <text x="380" y="211" font-size="10" fill="#64748b" text-anchor="middle">所有权在调用者，值留在算它的 worker 上，两者被分开</text>
</svg>
