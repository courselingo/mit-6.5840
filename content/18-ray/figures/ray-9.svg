<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 321" width="760" height="321"
     role="img" aria-labelledby="fig-ray-ray-9-title fig-ray-ray-9-desc">
  <title id="fig-ray-ray-9-title">调度靠租约，内存靠对象存储</title>
  <desc id="fig-ray-ray-9-desc">上半部分是一排三步：资源请求、预留、租约，右侧一条回流曲线表示可以复用；下半部分是对象存储的四个操作 Create、Get、Pin、Release，以及 Get 会阻塞、首次 Create 会 pin 住对象、对象可以留次级副本。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="321" fill="#ffffff"/>

  <text x="380" y="32" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">调度靠租约，内存靠对象存储</text>
  <rect x="22" y="56" width="222" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="133" y="78.2" font-size="12" fill="#1e40af" text-anchor="middle">资源请求</text>
  <rect x="269" y="56" width="222" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="78.2" font-size="12" fill="#1e40af" text-anchor="middle">预留 reserve</text>
  <path d="M249,74.0 L258,74.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="516" y="56" width="222" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="627" y="78.2" font-size="12" fill="#1e40af" text-anchor="middle">租约 lease</text>
  <path d="M496,74.0 L505,74.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="108" font-size="10" fill="#64748b" text-anchor="middle">循环：预留失败就重试，成功则取租约；优化是复用已租出的 worker</text>
  <rect x="22" y="117" width="160" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="102" y="139.2" font-size="12" fill="#166534" text-anchor="middle">Create</text>
  <rect x="207" y="117" width="160" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="287" y="139.2" font-size="12" fill="#166534" text-anchor="middle">Get</text>
  <path d="M187,135.0 L196,135.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="392" y="117" width="160" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="472" y="139.2" font-size="12" fill="#166534" text-anchor="middle">Pin</text>
  <path d="M372,135.0 L381,135.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="577" y="117" width="160" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="139.2" font-size="12" fill="#166534" text-anchor="middle">Release</text>
  <path d="M557,135.0 L566,135.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="22" y="178" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="200.2" font-size="12" fill="#b45309" text-anchor="middle">Get 会阻塞到对象被创建；首次 Create 会把对象 pin 住</text>
  <rect x="22" y="239" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="261.2" font-size="12" fill="#6b21a8" text-anchor="middle">对象可以留次级副本：主副本随机器丢失时就不用重算</text>
  <text x="380" y="297" font-size="10" fill="#64748b" text-anchor="middle">调度管任务在哪跑，内存管理管值在哪存</text>
</svg>
