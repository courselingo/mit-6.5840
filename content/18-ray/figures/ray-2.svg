<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 217" width="760" height="217"
     role="img" aria-labelledby="fig-ray-ray-2-title fig-ray-ray-2-desc">
  <title id="fig-ray-ray-2-title">Ray 的三个想法</title>
  <desc id="fig-ray-ray-2-desc">一个输入框向右分叉到三个框：future 是计算结果的句柄，actor 在多次调用之间持有状态，ownership 决定关于 future 的状态按归属放在哪台机器上。前两件本身不新，难的是第三件。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="217" fill="#ffffff"/>

  <text x="380" y="32" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Ray 的三个想法</text>
  <rect x="280" y="56" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="78.2" font-size="12" fill="#1e40af" text-anchor="middle">Ray 的</text>
  <text x="380" y="96.2" font-size="12" fill="#1e40af" text-anchor="middle">三个想法</text>
  <rect x="22" y="135" width="222" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="133" y="157.2" font-size="12" fill="#1e40af" text-anchor="middle">future：结果的句柄</text>
  <path d="M380,115 C 380,119.5 133,119.5 133,124" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="269" y="135" width="222" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="157.2" font-size="12" fill="#b45309" text-anchor="middle">actor：跨调用持有状态</text>
  <path d="M380,115 C 380,119.5 380,119.5 380,124" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="516" y="135" width="222" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="627" y="157.2" font-size="12" fill="#166534" text-anchor="middle">ownership：状态按归属分片</text>
  <path d="M380,115 C 380,119.5 627,119.5 627,124" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="193" font-size="10" fill="#64748b" text-anchor="middle">前两件不新，难的是把关于它们的元数据放到正确的机器上</text>
</svg>
