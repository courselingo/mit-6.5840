<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296"
     role="img" aria-labelledby="fig-ray-ray-10-title fig-ray-ray-10-desc">
  <title id="fig-ray-ray-10-title">故障恢复：两种丢失，一条思路</title>
  <desc id="fig-ray-ray-10-desc">中间一条虚线把图分成两半：左半是拥有的对象丢失，沿血缘重新执行、有次级副本就省掉重算；右半是所有者丢失，会留下悬空引用，于是 fate sharing 让引用者把自己也当作崩溃。下方说明谁发起重算由所有权直接给出。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="296" fill="#ffffff"/>

  <text x="380" y="32" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">故障恢复：两种丢失，一条思路</text>
  <rect x="22" y="56" width="344" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="78.2" font-size="12" fill="#9d174d" text-anchor="middle">拥有的对象丢失</text>
  <text x="194" y="96.2" font-size="12" fill="#9d174d" text-anchor="middle">沿血缘重新执行</text>
  <rect x="22" y="135" width="344" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="157.2" font-size="12" fill="#9d174d" text-anchor="middle">有次级副本</text>
  <text x="194" y="175.2" font-size="12" fill="#9d174d" text-anchor="middle">就用副本，省掉重算</text>
  <path d="M194,115 L194,124" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="391" y="56" width="344" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563" y="78.2" font-size="12" fill="#b45309" text-anchor="middle">所有者丢失</text>
  <text x="563" y="96.2" font-size="12" fill="#b45309" text-anchor="middle">别人手里留下悬空引用</text>
  <rect x="391" y="135" width="344" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563" y="157.2" font-size="12" fill="#b45309" text-anchor="middle">fate sharing</text>
  <text x="563" y="175.2" font-size="12" fill="#b45309" text-anchor="middle">引用者也把自己当崩溃</text>
  <path d="M563,115 L563,124" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M378,56 L378,189" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="22" y="214" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="236.2" font-size="12" fill="#166534" text-anchor="middle">谁发起重算不是问出来的：从「谁拥有这个 future」直接得出</text>
  <text x="380" y="272" font-size="10" fill="#64748b" text-anchor="middle">局部无解被转成一个可以上报的失败，恢复责任顺着 ownership 交回调用者</text>
</svg>
