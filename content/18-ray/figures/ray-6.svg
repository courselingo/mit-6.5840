<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336"
     role="img" aria-labelledby="fig-ray-ray-6-title fig-ray-ray-6-desc">
  <title id="fig-ray-ray-6-title">中心方案的瓶颈：两次往返</title>
  <desc id="fig-ray-ray-6-desc">一条横向时间轴上有两段水平的双向箭头，分别是发起与取值各一次往返；轴下方两个框说明 future 数量多、有的只跑几毫秒，协调者成为瓶颈，而按对象 id 分片仍要一次往返。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="336" fill="#ffffff"/>

  <text x="380" y="32" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">中心方案的瓶颈：两次往返</text>
  <path d="M60,150 L700,150" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M60,145 L60,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M124,145 L124,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M188,145 L188,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M252,145 L252,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M316,145 L316,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M380,145 L380,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M444,145 L444,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M508,145 L508,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M572,145 L572,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M636,145 L636,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M700,145 L700,155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M115,126 L319,126" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M330,126 L110,126" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="104" font-size="10" fill="#64748b" text-anchor="middle">发起：一次往返</text>
  <path d="M435,126 L639,126" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M650,126 L430,126" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="104" font-size="10" fill="#64748b" text-anchor="middle">取值：一次往返</text>
  <rect x="22" y="175" width="716" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="197.2" font-size="12" fill="#9d174d" text-anchor="middle">future 数量非常多，其中一些只跑几毫秒</text>
  <text x="380" y="215.2" font-size="12" fill="#9d174d" text-anchor="middle">于是协调者成为可扩展性瓶颈</text>
  <rect x="22" y="254" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="276.2" font-size="12" fill="#b45309" text-anchor="middle">按对象 id 分片可以摊开这张表，但仍然要一次往返</text>
  <text x="380" y="312" font-size="10" fill="#64748b" text-anchor="middle">分片解决容量，没解决「每次都要问一次中心」</text>
</svg>
