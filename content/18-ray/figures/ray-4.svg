<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 335" width="760" height="335"
     role="img" aria-labelledby="fig-ray-ray-4-title fig-ray-ray-4-desc">
  <title id="fig-ray-ray-4-title">Remote 调用扇出，actor 持有状态</title>
  <desc id="fig-ray-ray-4-desc">上半部分：一次 g.remote(0..3) 调用扇出到四个并行任务，再用一次 ray.get 汇总；下半部分：Counter 这个 actor 的状态留在它所在的机器上，调用 increment.remote() 只返回一个 future。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="335" fill="#ffffff"/>

  <text x="380" y="32" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Remote 调用扇出，actor 持有状态</text>
  <rect x="22" y="52" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="74.2" font-size="12" fill="#1e40af" text-anchor="middle">g.remote(0..3)：四次调用立刻返回 future</text>
  <rect x="22" y="113" width="160" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="102" y="135.2" font-size="12" fill="#b45309" text-anchor="middle">并行任务 1</text>
  <path d="M102,93 L102,102" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="207" y="113" width="160" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287" y="135.2" font-size="12" fill="#b45309" text-anchor="middle">并行任务 2</text>
  <path d="M287,93 L287,102" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="392" y="113" width="160" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="135.2" font-size="12" fill="#b45309" text-anchor="middle">并行任务 3</text>
  <path d="M472,93 L472,102" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="577" y="113" width="160" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="657" y="135.2" font-size="12" fill="#b45309" text-anchor="middle">并行任务 4</text>
  <path d="M657,93 L657,102" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="22" y="174" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="196.2" font-size="12" fill="#166534" text-anchor="middle">ray.get 汇总四次结果</text>
  <path d="M102,154 L102,163" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M287,154 L287,163" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M472,154 L472,163" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M657,154 L657,163" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="22" y="235" width="344" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="257.2" font-size="12" fill="#6b21a8" text-anchor="middle">Counter（actor）</text>
  <text x="194" y="275.2" font-size="12" fill="#6b21a8" text-anchor="middle">self.value 留在那台机器上</text>
  <rect x="394" y="235" width="344" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="257.2" font-size="12" fill="#166534" text-anchor="middle">increment.remote() 返回 future</text>
  <text x="566" y="275.2" font-size="12" fill="#166534" text-anchor="middle">返回值不搬走状态</text>
  <path d="M371,262.0 L383,262.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="311" font-size="10" fill="#64748b" text-anchor="middle">一次调用立刻返回 future，四次调用并行跑，最后由 ray.get 收口</text>
</svg>
