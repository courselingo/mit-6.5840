<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266"
     role="img" aria-labelledby="fig-intro-2-title fig-intro-2-desc">
  <title id="fig-intro-2-title">一致性、可用性、性能：三者无法同时满足</title>
  <desc id="fig-intro-2-desc">三项互相拉扯并两两相连，故障发生时只能舍弃其中一个：要一致就得等，要立刻回应就得放弃一致，要快就少协调。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="266" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一致性、可用性、性能：三者无法同时满足</text>

  <rect x="250" y="80" width="260" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="108" font-size="15" fill="#6b21a8" text-anchor="middle">一致性</text>
  <text x="380" y="130" font-size="12" fill="#6b21a8" text-anchor="middle">每次读都要等副本同意</text>

  <rect x="22" y="176" width="344" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="204" font-size="15" fill="#1e40af" text-anchor="middle">可用性</text>
  <text x="194" y="226" font-size="12" fill="#1e40af" text-anchor="middle">缺多数派的一侧必须停服</text>

  <rect x="394" y="176" width="344" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="204" font-size="15" fill="#b45309" text-anchor="middle">性能</text>
  <text x="566" y="226" font-size="12" fill="#b45309" text-anchor="middle">协调与等待越多越慢</text>

  <path d="M245,100 C215,100 200,150 200,165" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M515,100 C545,100 560,150 560,165" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M371,210 L383,210" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
