<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376"
     role="img" aria-labelledby="fig-intro-2-title fig-intro-2-desc">
  <title id="fig-intro-2-title">取舍的形状：三者互相拉扯，而一致性是一根刻度</title>
  <desc id="fig-intro-2-desc">左列是一致性、可用性、性能互相拉扯的三条边，想保住任意两样第三样就会先崩。右列是一致性刻度上的三个位置：左端更强更慢，中间是多数派定案，右端更快但可能读到旧值。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="376" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">取舍的形状：三者互相拉扯，而一致性是一根刻度</text>

  <rect x="22" y="56" width="340" height="298" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="192" y="70" font-size="12" fill="#64748b" text-anchor="middle">三条边互相拉扯</text>

  <rect x="398" y="56" width="340" height="298" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="568" y="70" font-size="12" fill="#64748b" text-anchor="middle">一致性刻度上的选点</text>

  <rect x="38" y="82" width="308" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="192" y="110" font-size="15" fill="#9d174d" text-anchor="middle">一致性</text>
  <text x="192" y="132" font-size="12" fill="#9d174d" text-anchor="middle">每次读都要等副本同意</text>

  <rect x="38" y="176" width="308" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="192" y="204" font-size="15" fill="#9d174d" text-anchor="middle">可用性</text>
  <text x="192" y="226" font-size="12" fill="#9d174d" text-anchor="middle">缺多数派的一侧必须停服</text>

  <rect x="38" y="270" width="308" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="192" y="298" font-size="15" fill="#9d174d" text-anchor="middle">性能</text>
  <text x="192" y="320" font-size="12" fill="#9d174d" text-anchor="middle">协调与等待越多就越慢</text>

  <rect x="414" y="82" width="308" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="568" y="110" font-size="15" fill="#6b21a8" text-anchor="middle">更强、也更慢</text>
  <text x="568" y="132" font-size="12" fill="#6b21a8" text-anchor="middle">linearizability：每次都要协调</text>

  <rect x="414" y="176" width="308" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="568" y="204" font-size="15" fill="#b45309" text-anchor="middle">多数派定案</text>
  <text x="568" y="226" font-size="12" fill="#b45309" text-anchor="middle">Raft 与 Paxos 落在这里</text>

  <rect x="414" y="270" width="308" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="568" y="298" font-size="15" fill="#166534" text-anchor="middle">更快、但可能读到旧值</text>
  <text x="568" y="320" font-size="12" fill="#166534" text-anchor="middle">eventual consistency</text>
</svg>
