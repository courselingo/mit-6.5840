<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278"
     role="img" aria-labelledby="fig-intro-7-title fig-intro-7-desc">
  <title id="fig-intro-7-title">瓶颈不会消失，它只是转移到下一个地方</title>
  <desc id="fig-intro-7-desc">单机时瓶颈在 CPU 与单盘，加上机器后瓶颈移到网络与协调消息，继续加机器则集中在某个协调点上；优化掉一个，下一个立刻顶上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="278" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">瓶颈不会消失，它只是转移到下一个地方</text>

  <path d="M247,100 L259,100" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M495,100 L507,100" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,139 L380,151" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="66" width="220" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="94" font-size="15" fill="#1e40af" text-anchor="middle">单机：CPU 到顶</text>
  <text x="132" y="116" font-size="12" fill="#1e40af" text-anchor="middle">内存与单盘 IO 也是上限</text>

  <rect x="270" y="66" width="220" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="94" font-size="15" fill="#b45309" text-anchor="middle">加机器：通信变多</text>
  <text x="380" y="116" font-size="12" fill="#b45309" text-anchor="middle">一轮协作等最慢的那个</text>

  <rect x="518" y="66" width="220" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="628" y="94" font-size="15" fill="#9d174d" text-anchor="middle">继续加：协调点集中</text>
  <text x="628" y="116" font-size="12" fill="#9d174d" text-anchor="middle">所有机器都要找它</text>

  <rect x="22" y="162" width="716" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="190" font-size="15" fill="#6b21a8" text-anchor="middle">优化掉一个瓶颈，下一个立刻顶上</text>
  <text x="380" y="212" font-size="12" fill="#6b21a8" text-anchor="middle">例如 MapReduce 的中间数据交换，把核心交换机顶成全局瓶颈</text>
  <text x="380" y="255" font-size="10" fill="#94a3b8" text-anchor="middle">（瓶颈搬家这条路线是我们的归纳，源只说了瓶颈会转移）</text>
</svg>
