<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302"
     role="img" aria-labelledby="fig-intro-13-title fig-intro-13-desc">
  <title id="fig-intro-13-title">两种坏法在客户端眼里长得完全不同</title>
  <desc id="fig-intro-13-desc">fail-stop 的节点停下来，客户端收不到任何回应，可以判定它坏了并换一台；byzantine 的节点还在运行却发出错误消息，客户端从响应本身看不出异常。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="302" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种坏法在客户端眼里长得完全不同</text>

  <path d="M194,116 L194,128" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M566,116 L566,128" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="66" width="344" height="45" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="94" font-size="15" fill="#166534" text-anchor="middle">fail-stop：节点停下来，能被察觉</text>

  <rect x="394" y="66" width="344" height="45" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="94" font-size="15" fill="#9d174d" text-anchor="middle">byzantine：还在运行却说错话</text>

  <rect x="22" y="139" width="344" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="167" font-size="15" fill="#166534" text-anchor="middle">客户端看到：没有回应</text>
  <text x="194" y="189" font-size="12" fill="#166534" text-anchor="middle">可以判定它坏了，换一台继续</text>

  <rect x="394" y="139" width="344" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="167" font-size="15" fill="#9d174d" text-anchor="middle">客户端看到：格式正常的错值</text>
  <text x="566" y="189" font-size="12" fill="#9d174d" text-anchor="middle">从响应本身看不出哪里不对</text>

  <rect x="22" y="235" width="716" height="45" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="263" font-size="15" fill="#6b21a8" text-anchor="middle">本课程绝大部分内容只处理上一种，因为它已经足够难</text>
</svg>
