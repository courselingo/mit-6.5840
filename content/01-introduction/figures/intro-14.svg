<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302"
     role="img" aria-labelledby="fig-intro-14-title fig-intro-14-desc">
  <title id="fig-intro-14-title">按键重新分桶：同一个键的值必须汇到同一个 reduce 任务</title>
  <desc id="fig-intro-14-desc">三个 map 任务各自发出中间键值对，框架按键把它们重新分桶，于是同一个键的全部值落进同一个桶，由同一个 reduce 任务求和。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="302" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">按键重新分桶：同一个键的值汇到同一个 reduce 任务</text>

  <path d="M132,139 L132,151" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,139 L380,151" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M628,139 L628,151" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M194,212 L194,224" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M566,212 L566,224" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="66" width="220" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="132" y="94" font-size="15" fill="#b45309" text-anchor="middle">map 1</text>
  <text x="132" y="116" font-size="12" fill="#b45309" text-anchor="middle">发出 (a,1) 与 (b,1)</text>

  <rect x="270" y="66" width="220" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="94" font-size="15" fill="#b45309" text-anchor="middle">map 2</text>
  <text x="380" y="116" font-size="12" fill="#b45309" text-anchor="middle">发出 (a,1)</text>

  <rect x="518" y="66" width="220" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="628" y="94" font-size="15" fill="#b45309" text-anchor="middle">map 3</text>
  <text x="628" y="116" font-size="12" fill="#b45309" text-anchor="middle">发出 (b,1) 与 (c,1)</text>

  <rect x="22" y="162" width="716" height="45" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="190" font-size="15" fill="#6b21a8" text-anchor="middle">框架按键重新分桶：同一个键的全部值进同一个桶</text>

  <rect x="22" y="235" width="344" height="45" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="263" font-size="15" fill="#166534" text-anchor="middle">reduce 任务 1：只处理键 a</text>

  <rect x="394" y="235" width="344" height="45" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="263" font-size="15" fill="#166534" text-anchor="middle">reduce 任务 2：只处理键 b 与 c</text>
</svg>
