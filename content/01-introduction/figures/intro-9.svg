<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 217" width="760" height="217"
     role="img" aria-labelledby="fig-intro-9-title fig-intro-9-desc">
  <title id="fig-intro-9-title">一致性是一根刻度：往左更强也更慢，往右更快但可能读到旧值</title>
  <desc id="fig-intro-9-desc">左端是 linearizability，每次操作都像在某一瞬间生效，代价是协调开销；右端是 eventual consistency，停写后最终收敛，中途可能读到旧值；Raft 与 Paxos 落在中间。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="217" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一致性是一根刻度：往左更强也更慢，往右更快但可能读到旧值</text>

  <rect x="22" y="66" width="220" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="132" y="94" font-size="15" fill="#6b21a8" text-anchor="middle">linearizability</text>
  <text x="132" y="116" font-size="12" fill="#6b21a8" text-anchor="middle">代价：每次操作都要协调</text>

  <rect x="270" y="66" width="220" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="94" font-size="15" fill="#b45309" text-anchor="middle">Raft 与 Paxos 在这里</text>
  <text x="380" y="116" font-size="12" fill="#b45309" text-anchor="middle">多数派同意就返回</text>

  <rect x="518" y="66" width="220" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="628" y="94" font-size="15" fill="#166534" text-anchor="middle">eventual consistency</text>
  <text x="628" y="116" font-size="12" fill="#166534" text-anchor="middle">代价：中途可能读到旧值</text>

  <path d="M40,170 L720,170" fill="none" stroke="#94a3b8"/>

  <text x="170" y="192" font-size="12" fill="#64748b" text-anchor="middle">更慢，但更强</text>
  <text x="566" y="192" font-size="12" fill="#64748b" text-anchor="middle">更快，但可能读到旧值</text>
</svg>
