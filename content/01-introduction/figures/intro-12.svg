<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312"
     role="img" aria-labelledby="fig-intro-12-title fig-intro-12-desc">
  <title id="fig-intro-12-title">两种看着有判据、其实没有判据的失效</title>
  <desc id="fig-intro-12-desc">上排讲顺序：两台机器的本地时钟会给出相反的先后，只有 send 到 receive 定义得了先后。下排讲失败：A 能看到的只是「没有回音」，崩溃、变慢、去程丢包、回程丢包给它同样的观测，超时只是猜测。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="312" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种看着有判据、其实没有判据的失效</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">顺序：时间戳说了不算</text>

  <rect x="22" y="180" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="194" font-size="12" fill="#64748b" text-anchor="middle">失败：没有回音说明不了什么</text>

  <path d="M252,116 L264,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M489,116 L501,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M252,240 L264,240" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M489,240 L501,240" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="142" y="110" font-size="15" fill="#1e40af" text-anchor="middle">两台机器各有时钟</text>
  <text x="142" y="132" font-size="12" fill="#1e40af" text-anchor="middle">A 说写在前，B 说读在前</text>

  <rect x="275" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379" y="110" font-size="15" fill="#9d174d" text-anchor="middle">时间戳判定先后</text>
  <text x="379" y="132" font-size="12" fill="#9d174d" text-anchor="middle">结论会正好反过来</text>

  <rect x="512" y="82" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="110" font-size="15" fill="#166534" text-anchor="middle">只有消息定义先后</text>
  <text x="616" y="132" font-size="12" fill="#166534" text-anchor="middle">send 到 receive</text>

  <rect x="38" y="206" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="142" y="234" font-size="15" fill="#1e40af" text-anchor="middle">A 能看到的全部</text>
  <text x="142" y="256" font-size="12" fill="#1e40af" text-anchor="middle">请求出去，没有回音</text>

  <rect x="275" y="206" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379" y="234" font-size="15" fill="#9d174d" text-anchor="middle">四种来路</text>
  <text x="379" y="256" font-size="12" fill="#9d174d" text-anchor="middle">崩溃／变慢／去程丢／回程丢</text>

  <rect x="512" y="206" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="234" font-size="15" fill="#166534" text-anchor="middle">超时只是猜测</text>
  <text x="616" y="256" font-size="12" fill="#166534" text-anchor="middle">四种处置完全不同</text>
</svg>
