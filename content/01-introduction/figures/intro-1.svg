<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348"
     role="img" aria-labelledby="fig-intro-1-title fig-intro-1-desc">
  <title id="fig-intro-1-title">单机世界的三项保证，在第二台机器上失效</title>
  <desc id="fig-intro-1-desc">三行对照：全局顺序、失败的可见性、唯一的状态在单机上成立，拆成两台机器后分别变成顺序无法裁定、失败不可判定、副本暂时不一致。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="348" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">单机世界的三项保证，在第二台机器上失效</text>

  <rect x="22" y="66" width="344" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="94" font-size="15" fill="#166534" text-anchor="middle">单机：全局顺序</text>
  <text x="194" y="116" font-size="12" fill="#166534" text-anchor="middle">CPU 与锁裁定先后</text>

  <rect x="394" y="66" width="344" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="94" font-size="15" fill="#9d174d" text-anchor="middle">分布式：顺序失效</text>
  <text x="566" y="116" font-size="12" fill="#9d174d" text-anchor="middle">时钟有偏差，时间戳不可用</text>

  <path d="M371,100 L383,100" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="162" width="344" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="190" font-size="15" fill="#166534" text-anchor="middle">单机：失败可见</text>
  <text x="194" y="212" font-size="12" fill="#166534" text-anchor="middle">函数返回或抛异常</text>

  <rect x="394" y="162" width="344" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="190" font-size="15" fill="#9d174d" text-anchor="middle">分布式：失败不可判定</text>
  <text x="566" y="212" font-size="12" fill="#9d174d" text-anchor="middle">四种情况无法区分</text>

  <path d="M371,196 L383,196" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="258" width="344" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="286" font-size="15" fill="#166534" text-anchor="middle">单机：状态唯一</text>
  <text x="194" y="308" font-size="12" fill="#166534" text-anchor="middle">内存只有一份</text>

  <rect x="394" y="258" width="344" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="286" font-size="15" fill="#9d174d" text-anchor="middle">分布式：状态多份</text>
  <text x="566" y="308" font-size="12" fill="#9d174d" text-anchor="middle">副本可以暂时不一致</text>

  <path d="M371,292 L383,292" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
