<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 469" width="760" height="469"
     role="img" aria-labelledby="fig-intro-3-title fig-intro-3-desc">
  <title id="fig-intro-3-title">MapReduce 的分工：用户只写两个函数，其余交给框架</title>
  <desc id="fig-intro-3-desc">左边是应用作者写下的 map 与 reduce，右边是框架接管的分片、调度、容错与数据搬运，两侧之间用一条虚线边界隔开。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="469" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">用户只写 map 与 reduce，其余交给框架</text>

  <rect x="22" y="80" width="336" height="221" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="402" y="80" width="336" height="367" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>

  <rect x="37" y="95" width="306" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="122" font-size="14" fill="#1e40af" text-anchor="middle">用户写的部分</text>

  <rect x="37" y="168" width="306" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="195" font-size="14" fill="#1e40af" text-anchor="middle">map(chunk)：发出中间键值对</text>

  <rect x="37" y="241" width="306" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="268" font-size="14" fill="#1e40af" text-anchor="middle">reduce(key, values)：汇总</text>

  <rect x="417" y="95" width="306" height="45" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="570" y="122" font-size="14" fill="#b45309" text-anchor="middle">框架接管的部分</text>

  <rect x="417" y="168" width="306" height="45" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="570" y="195" font-size="14" fill="#b45309" text-anchor="middle">分片：把输入切成许多段</text>

  <rect x="417" y="241" width="306" height="45" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="570" y="268" font-size="14" fill="#b45309" text-anchor="middle">调度：把任务放到数据所在机器</text>

  <rect x="417" y="314" width="306" height="45" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="570" y="341" font-size="14" fill="#b45309" text-anchor="middle">容错：任务挂了就在别处重跑</text>

  <rect x="417" y="387" width="306" height="45" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="570" y="414" font-size="14" fill="#b45309" text-anchor="middle">数据搬运：按键重分发中间数据</text>

  <path d="M348,117 L406,117" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
