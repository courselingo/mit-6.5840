<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402"
     role="img" aria-labelledby="fig-intro-11-title fig-intro-11-desc">
  <title id="fig-intro-11-title">容错的两笔账：重跑要求函数是纯的，长尾要用备份砍短</title>
  <desc id="fig-intro-11-desc">左列是重跑的代价：同一个 map 算两遍若结果不同，两个 reduce 就各用一个版本，同一份输出混进两个事实，所以用户函数必须是确定性的纯函数。右列是长尾的代价：最后几份任务被复制到空闲机器重跑，谁先完成用谁。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="402" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">容错的两笔账：重跑要求函数是纯的，长尾要用备份砍短</text>

  <rect x="22" y="56" width="340" height="298" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="192" y="70" font-size="12" fill="#64748b" text-anchor="middle">重跑：要允许算两次</text>

  <rect x="398" y="56" width="340" height="298" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="568" y="70" font-size="12" fill="#64748b" text-anchor="middle">长尾：用冗余换时间</text>

  <rect x="38" y="82" width="308" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="192" y="110" font-size="15" fill="#9d174d" text-anchor="middle">同一个 map 算了两遍</text>
  <text x="192" y="132" font-size="12" fill="#9d174d" text-anchor="middle">两次给出的中间结果不同</text>

  <rect x="38" y="176" width="308" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="192" y="204" font-size="15" fill="#9d174d" text-anchor="middle">两个 reduce 各用一个版本</text>
  <text x="192" y="226" font-size="12" fill="#9d174d" text-anchor="middle">同一份输出里混进两个事实</text>

  <rect x="38" y="270" width="308" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="192" y="298" font-size="15" fill="#166534" text-anchor="middle">所以函数必须是纯的</text>
  <text x="192" y="320" font-size="12" fill="#166534" text-anchor="middle">只许看自己的输入，不写外部状态</text>

  <rect x="414" y="82" width="308" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="568" y="110" font-size="15" fill="#b45309" text-anchor="middle">绝大多数任务已完成</text>
  <text x="568" y="132" font-size="12" fill="#b45309" text-anchor="middle">只剩最后几份还在跑</text>

  <rect x="414" y="176" width="308" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="568" y="204" font-size="15" fill="#b45309" text-anchor="middle">把这几个任务复制出去</text>
  <text x="568" y="226" font-size="12" fill="#b45309" text-anchor="middle">放到空闲机器上再跑一遍</text>

  <rect x="414" y="270" width="308" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="568" y="298" font-size="15" fill="#166534" text-anchor="middle">谁先完成就用谁</text>
  <text x="568" y="320" font-size="12" fill="#166534" text-anchor="middle">不去诊断哪台机器慢</text>
  <text x="380" y="379" font-size="10" fill="#94a3b8" text-anchor="middle">（左右两笔账这样并列是我们的归纳，源只分别写了重跑与备份任务）</text>
</svg>
