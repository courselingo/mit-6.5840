<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 325" width="760" height="325"
     role="img" aria-labelledby="fig-intro-11-title fig-intro-11-desc">
  <title id="fig-intro-11-title">同一个 map 被算了两遍：两次输出不同，最终结果就混了</title>
  <desc id="fig-intro-11-desc">第一次执行与重跑如果给出不同的中间结果，两个 reduce 就会分别基于两个版本，同一份最终输出里混进两种事实，所以 map 与 reduce 必须是确定性的纯函数。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="325" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一个 map 被算了两遍：两次输出不同，最终结果就混了</text>

  <path d="M194,139 L194,151" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M566,139 L566,151" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M194,235 L194,247" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M566,235 L566,247" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="66" width="344" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="94" font-size="15" fill="#166534" text-anchor="middle">第一次执行 map</text>
  <text x="194" y="116" font-size="12" fill="#166534" text-anchor="middle">发出 (word, 1)</text>

  <rect x="394" y="66" width="344" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="94" font-size="15" fill="#9d174d" text-anchor="middle">机器挂了，换个地方重跑</text>
  <text x="566" y="116" font-size="12" fill="#9d174d" text-anchor="middle">如果它不纯：发出 (word, 2)</text>

  <rect x="22" y="162" width="344" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="190" font-size="15" fill="#166534" text-anchor="middle">reduce A 用的是第一次的结果</text>
  <text x="194" y="212" font-size="12" fill="#166534" text-anchor="middle">算出 word 出现 1 次</text>

  <rect x="394" y="162" width="344" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="190" font-size="15" fill="#9d174d" text-anchor="middle">reduce B 用的是第二次的结果</text>
  <text x="566" y="212" font-size="12" fill="#9d174d" text-anchor="middle">算出 word 出现 2 次</text>

  <rect x="22" y="258" width="716" height="45" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="286" font-size="15" fill="#9d174d" text-anchor="middle">同一份输出里混着两个版本，所以 map 与 reduce 必须是纯函数</text>
</svg>
