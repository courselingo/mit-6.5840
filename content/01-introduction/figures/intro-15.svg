<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302"
     role="img" aria-labelledby="fig-intro-15-title fig-intro-15-desc">
  <title id="fig-intro-15-title">长尾与备份任务：用冗余把最后那一小截砍短</title>
  <desc id="fig-intro-15-desc">绝大多数任务已经完成时，最后几份被复制到空闲机器上重跑，谁先完成用谁；框架不去诊断哪台机器慢，而是用一份多余的副本换时间。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="302" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">长尾与备份任务：用冗余把最后那一小截砍短</text>

  <path d="M659,116 L659,128" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M659,212 L659,224" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="66" width="158" height="45" fill="#d1fae5" stroke="#22c55e"/>
  <text x="101" y="94" font-size="15" fill="#166534" text-anchor="middle">任务 1 完成</text>

  <rect x="208" y="66" width="158" height="45" fill="#d1fae5" stroke="#22c55e"/>
  <text x="287" y="94" font-size="15" fill="#166534" text-anchor="middle">任务 2 完成</text>

  <rect x="394" y="66" width="158" height="45" fill="#d1fae5" stroke="#22c55e"/>
  <text x="473" y="94" font-size="15" fill="#166534" text-anchor="middle">任务 3 完成</text>

  <rect x="580" y="66" width="158" height="45" fill="#fce7f3" stroke="#ec4899"/>
  <text x="659" y="94" font-size="15" fill="#9d174d" text-anchor="middle">任务 4：落后者</text>

  <rect x="22" y="139" width="344" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="194" y="167" font-size="15" fill="#b45309" text-anchor="middle">三台空闲机器只能空等</text>
  <text x="194" y="189" font-size="12" fill="#b45309" text-anchor="middle">它们帮不上忙</text>

  <rect x="394" y="139" width="344" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="167" font-size="15" fill="#9d174d" text-anchor="middle">备份任务：把最后几份复制出去</text>
  <text x="566" y="189" font-size="12" fill="#9d174d" text-anchor="middle">在空闲机器上重跑一遍</text>

  <rect x="22" y="235" width="716" height="45" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="263" font-size="15" fill="#166534" text-anchor="middle">谁先完成用谁：不去诊断哪台机器慢，用冗余换时间</text>
</svg>
