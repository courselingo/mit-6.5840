<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 425" width="760" height="425"
     role="img" aria-labelledby="fig-intro-5-title fig-intro-5-desc">
  <title id="fig-intro-5-title">五次 Lab 的递进：从框架一路走到分片</title>
  <desc id="fig-intro-5-desc">Lab 1 到 Lab 5 自上而下排成一条链，每一讲用完上一讲的产出：框架、RPC、Raft、容错数据库，最后把数据库切开做分片。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="425" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">五次 Lab 的递进：后一个接手前一个留下的问题</text>

  <path d="M380,116 L380,128" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,189 L380,201" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,262 L380,274" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,335 L380,347" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="66" width="716" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="94" font-size="15" fill="#1e40af" text-anchor="middle">Lab 1：MapReduce 框架，把并行、调度与容错都藏进库里</text>

  <rect x="22" y="139" width="716" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="167" font-size="15" fill="#1e40af" text-anchor="middle">Lab 2：RPC 与线程，在会丢包的网络上传送一次调用</text>

  <rect x="22" y="212" width="716" height="45" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="240" font-size="15" fill="#b45309" text-anchor="middle">Lab 3：Raft，用复制与多数派换来容错</text>

  <rect x="22" y="285" width="716" height="45" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="313" font-size="15" fill="#b45309" text-anchor="middle">Lab 4：容错 KV 数据库，把 Raft 变成能用的存储</text>

  <rect x="22" y="358" width="716" height="45" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="386" font-size="15" fill="#6b21a8" text-anchor="middle">Lab 5：分片，把数据切开，让吞吐量随机器数增长</text>
</svg>
