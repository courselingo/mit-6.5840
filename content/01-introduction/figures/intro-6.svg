<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 439" width="760" height="439"
     role="img" aria-labelledby="fig-intro-6-title fig-intro-6-desc">
  <title id="fig-intro-6-title">选举不要求多数派时，分区两侧各自选主，同一份数据有了两个版本</title>
  <desc id="fig-intro-6-desc">选举不要求多数派时，中间链路断成两半，两侧各自选出主节点并继续接受写入，同一个键于是有了两份冲突历史，这就是 split brain。根因是选举没有多数派约束：只有 2 台的那一侧本不该继续服务，这样才不会出现两份历史。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="439" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">选举不要求多数派时，分区两侧各自选主，同一份数据有了两个版本</text>

  <rect x="22" y="140" width="328" height="196" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="410" y="140" width="328" height="196" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>

  <path d="M380,135 L380,210" fill="none" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <path d="M380,270 L380,344" fill="none" stroke="#94a3b8" stroke-dasharray="6,4"/>

  <path d="M186,135 L186,145" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M574,135 L574,145" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M186,206 L186,218" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M574,206 L574,218" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M186,324 L186,338" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M574,324 L574,338" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="62" width="716" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="90" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">网络分区：两侧无法通信，各自选出主节点</text>
  <text x="380" y="112" font-size="12" fill="#1e40af" text-anchor="middle">前提：这里假设选举不要求多数派，超时就能自封</text>

  <rect x="38" y="156" width="296" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="186" y="184" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">分区 A：3 台</text>

  <rect x="426" y="156" width="296" height="45" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="574" y="184" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">分区 B：2 台，收不到 A 的消息</text>

  <rect x="38" y="229" width="296" height="90" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="186" y="260" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">A 选出自己的主节点</text>
  <text x="186" y="278" font-size="12" fill="#166534" text-anchor="middle">它看不到 B 那边发生了什么</text>
  <text x="186" y="296" font-size="12" fill="#166534" text-anchor="middle">于是继续接受写入</text>

  <rect x="426" y="229" width="296" height="90" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="574" y="260" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">B 也选出一个主节点</text>
  <text x="574" y="278" font-size="12" fill="#9d174d" text-anchor="middle">它同样看不到 A 的存在</text>
  <text x="574" y="296" font-size="12" fill="#9d174d" text-anchor="middle">于是也在接受写入</text>

  <rect x="22" y="349" width="716" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="377" font-size="15" font-weight="600" fill="#6b21a8" text-anchor="middle">中间的链路断开，同一份数据于是有了两份冲突历史</text>
  <text x="380" y="399" font-size="12" fill="#6b21a8" text-anchor="middle">根因是选举不要求多数派：只有 2 台的那一侧本不该继续写入</text>
</svg>
