<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302"
     role="img" aria-labelledby="fig-intro-6-title fig-intro-6-desc">
  <title id="fig-intro-6-title">网络分区之后，两侧各自选主，同一份数据有了两个版本</title>
  <desc id="fig-intro-6-desc">分区把集群切成互不可达的两侧，两侧各自选出主节点并接受写入，于是同一个键在两侧被写成了两个互相冲突的值。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="302" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">网络分区之后，两侧各自选主，同一份数据有了两个版本</text>

  <rect x="22" y="66" width="344" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="94" font-size="15" fill="#1e40af" text-anchor="middle">分区 A：3 台，占多数</text>

  <rect x="394" y="66" width="344" height="45" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="94" font-size="15" fill="#9d174d" text-anchor="middle">分区 B：2 台，收不到 A 的消息</text>

  <path d="M194,116 L194,128" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M566,116 L566,128" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="139" width="344" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="167" font-size="15" fill="#166534" text-anchor="middle">分区 A 选出自己的主节点</text>
  <text x="194" y="189" font-size="12" fill="#166534" text-anchor="middle">继续接受写入</text>

  <rect x="394" y="139" width="344" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="167" font-size="15" fill="#9d174d" text-anchor="middle">分区 B 也选出一个主节点</text>
  <text x="566" y="189" font-size="12" fill="#9d174d" text-anchor="middle">也在接受写入</text>

  <path d="M194,212 L194,224" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M566,212 L566,224" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="235" width="716" height="45" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="263" font-size="15" fill="#9d174d" text-anchor="middle">同一个键因此有了两份互相冲突的历史，这就是 split brain</text>
</svg>
