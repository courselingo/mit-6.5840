<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320"
     role="img" aria-labelledby="fig-intro-6-title fig-intro-6-desc">
  <title id="fig-intro-6-title">网络分区之后，两侧各自选主，同一份数据有了两个版本</title>
  <desc id="fig-intro-6-desc">中间的链路断成两半，两侧各自选出主节点并接受写入，于是同一个键在两侧被写成了两个互相冲突的值，这就是 split brain。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="320" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">网络分区之后，两侧各自选主，同一份数据有了两个版本</text>

  <path d="M380,62 L380,225" fill="none" stroke="#94a3b8" stroke-dasharray="6,4"/>

  <rect x="22" y="62" width="344" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="90" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">分区 A：3 台，占多数</text>

  <rect x="394" y="62" width="344" height="45" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="90" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">分区 B：2 台，收不到 A 的消息</text>

  <path d="M194,112 L194,124" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M566,112 L566,124" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="135" width="344" height="90" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="167" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">A 选出自己的主节点</text>
  <text x="194" y="185" font-size="12" fill="#166534" text-anchor="middle">它看不到 B 那边发生了什么</text>
  <text x="194" y="203" font-size="12" fill="#166534" text-anchor="middle">于是继续接受写入</text>

  <rect x="394" y="135" width="344" height="90" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="167" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">B 也选出一个主节点</text>
  <text x="566" y="185" font-size="12" fill="#9d174d" text-anchor="middle">它同样看不到 A 的存在</text>
  <text x="566" y="203" font-size="12" fill="#9d174d" text-anchor="middle">于是也在接受写入</text>

  <rect x="22" y="253" width="716" height="45" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="281" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">中间的链路断开，同一份数据于是有了两份冲突历史</text>
</svg>
