<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352"
     role="img" aria-labelledby="fig-intro-4-title fig-intro-4-desc">
  <title id="fig-intro-4-title">一次没有回音的请求，A 分不出四种原因中的哪一种</title>
  <desc id="fig-intro-4-desc">左侧是 A 能看到的唯一事实：请求发出后没有回音；右侧四条分别是 B 崩溃、B 变慢、去程丢包、回程丢包，它们给 A 的观测完全相同。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="352" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次没有回音的请求，A 分不出四种原因中的哪一种</text>

  <rect x="22" y="66" width="250" height="264" fill="#fce7f3" stroke="#ec4899"/>
  <text x="147" y="181" font-size="15" fill="#9d174d" text-anchor="middle">A 能看到的全部</text>
  <text x="147" y="203.5" font-size="15" fill="#9d174d" text-anchor="middle">请求发出后没有回音</text>
  <text x="147" y="226" font-size="15" fill="#9d174d" text-anchor="middle">四种原因长得一样</text>

  <path d="M277,88.5 L289,88.5" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M277,161.5 L289,161.5" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M277,234.5 L289,234.5" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M277,307.5 L289,307.5" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="300" y="66" width="438" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="519" y="94" font-size="15" fill="#1e40af" text-anchor="middle">可能一：B 崩溃了，没来得及回应</text>

  <rect x="300" y="139" width="438" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="519" y="167" font-size="15" fill="#1e40af" text-anchor="middle">可能二：B 只是很慢，还在处理</text>

  <rect x="300" y="212" width="438" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="519" y="240" font-size="15" fill="#1e40af" text-anchor="middle">可能三：网络把请求丢在去程的路上</text>

  <rect x="300" y="285" width="438" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="519" y="313" font-size="15" fill="#1e40af" text-anchor="middle">可能四：B 算完了，回程的包丢了</text>
</svg>
