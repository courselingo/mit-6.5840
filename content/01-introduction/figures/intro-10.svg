<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268"
     role="img" aria-labelledby="fig-intro-10-title fig-intro-10-desc">
  <title id="fig-intro-10-title">一次 MapReduce 作业：用户只写两个函数，其余交给框架</title>
  <desc id="fig-intro-10-desc">输入切成 M 段交给 map 任务，中间数据按键重新分发，同一个键的值汇进同一个桶，由 reduce 任务汇总成输出；coordinator 全程记账，任务挂了就换个机器重跑。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="268" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次 MapReduce 作业：用户只写两个函数，其余交给框架</text>

  <path d="M149,116 L161,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M297,116 L309,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M445,116 L457,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M593,116 L605,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="24" y="82" width="120" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="84" y="110" font-size="15" fill="#1e40af" text-anchor="middle">输入分片</text>
  <text x="84" y="132" font-size="12" fill="#1e40af" text-anchor="middle">切成 M 段</text>

  <rect x="172" y="82" width="120" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="232" y="110" font-size="15" fill="#b45309" text-anchor="middle">map 任务</text>
  <text x="232" y="132" font-size="12" fill="#b45309" text-anchor="middle">用户写的</text>

  <rect x="320" y="82" width="120" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="110" font-size="15" fill="#6b21a8" text-anchor="middle">按键重分发</text>
  <text x="380" y="132" font-size="12" fill="#6b21a8" text-anchor="middle">同键进同一个桶</text>

  <rect x="468" y="82" width="120" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="528" y="110" font-size="15" fill="#b45309" text-anchor="middle">reduce 任务</text>
  <text x="528" y="132" font-size="12" fill="#b45309" text-anchor="middle">用户写的</text>

  <rect x="616" y="82" width="120" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="676" y="110" font-size="15" fill="#166534" text-anchor="middle">输出文件</text>
  <text x="676" y="132" font-size="12" fill="#166534" text-anchor="middle">每个桶一个</text>

  <rect x="24" y="178" width="712" height="68" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="206" font-size="15" fill="#1e293b" text-anchor="middle">coordinator 全程记账：分片、调度、容错都由它安排</text>
  <text x="380" y="228" font-size="12" fill="#64748b" text-anchor="middle">任务所在的机器挂了就换一台重跑；它自己却成了新的单点</text>
</svg>
