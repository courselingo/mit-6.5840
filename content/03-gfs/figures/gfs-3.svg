<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 289" width="766" height="289"
     role="img" aria-labelledby="fig-gfs-3-title fig-gfs-3-desc">
  <title id="fig-gfs-3-title">记录追加的代价：重复与填充落在未定义区域</title>
  <desc id="fig-gfs-3-desc">同一个块的副本里会出现填充与重复的记录，这些字节落在未定义区域，客户端读取端必须跳过它们并按唯一 ID 去重。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="289" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">记录追加的代价：重复与填充落在未定义区域</text>

  <rect x="25" y="64" width="716" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="40" y="78" font-size="11" fill="#64748b">块（一个副本）· 记录追加后的字节序列</text>

  <path d="M56,95 H186 V145 H56 Z" fill="#d1fae5" stroke="#22c55e"/>
  <path d="M186,95 H246 V145 H186 Z" fill="#fce7f3" stroke="#ec4899"/>
  <path d="M246,95 H396 V145 H246 Z" fill="#d1fae5" stroke="#22c55e"/>
  <path d="M396,95 H546 V145 H396 Z" fill="#fce7f3" stroke="#ec4899"/>
  <path d="M546,95 H596 V145 H546 Z" fill="#fce7f3" stroke="#ec4899"/>
  <path d="M596,95 H706 V145 H596 Z" fill="#d1fae5" stroke="#22c55e"/>

  <text x="121" y="124" font-size="11" fill="#166534" text-anchor="middle">记录 1</text>
  <text x="216" y="124" font-size="11" fill="#9d174d" text-anchor="middle">填充</text>
  <text x="321" y="124" font-size="11" fill="#166534" text-anchor="middle">记录 2</text>
  <text x="471" y="124" font-size="11" fill="#9d174d" text-anchor="middle">记录 2（重复）</text>
  <text x="571" y="124" font-size="11" fill="#9d174d" text-anchor="middle">填充</text>
  <text x="651" y="124" font-size="11" fill="#166534" text-anchor="middle">记录 3</text>

  <text x="121" y="168" font-size="12" fill="#64748b" text-anchor="middle">已定义区域</text>
  <text x="471" y="168" font-size="12" fill="#64748b" text-anchor="middle">未定义区域：填充或重复，读取端自己跳过</text>

  <path d="M121,189 L121,199" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="210" width="342" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196" y="232" font-size="12" fill="#1e40af" text-anchor="middle">客户端读取端</text>
  <text x="196" y="250" font-size="12" fill="#1e40af" text-anchor="middle">跳过填充，按唯一 ID 去重</text>

  <rect x="395" y="210" width="346" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="568" y="232" font-size="12" fill="#6b21a8" text-anchor="middle">工程上可接受</text>
  <text x="568" y="250" font-size="12" fill="#6b21a8" text-anchor="middle">至少一次语义，应用侧幂等</text>
</svg>
