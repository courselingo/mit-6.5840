<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 330" width="766" height="330"
     role="img" aria-labelledby="fig-gfs-1-title fig-gfs-1-desc">
  <title id="fig-gfs-1-title">GFS 架构：元数据走主节点，数据绕开主节点</title>
  <desc id="fig-gfs-1-desc">客户端只向主节点查询块位置，文件数据直接从三个块服务器读写，主节点不在数据路径上，所以单个主节点撑得住。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="330" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">GFS 架构：元数据走主节点，数据绕开主节点</text>

  <path d="M75,140 L75,129" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M135,204 L135,215" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M383,204 L383,215" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M631,204 L631,215" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="86" font-size="12" fill="#b45309" text-anchor="middle">主节点 master</text>
  <text x="135" y="104" font-size="12" fill="#b45309" text-anchor="middle">只回元数据</text>

  <rect x="25" y="145" width="716" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="45" y="167" font-size="12" fill="#1e40af">客户端</text>
  <text x="721" y="167" font-size="12" fill="#1e40af" text-anchor="end">只向主节点要元数据</text>
  <text x="383" y="185" font-size="12" fill="#1e40af" text-anchor="middle">文件数据直接从块服务器走，不经过主节点</text>

  <text x="200" y="138" font-size="12" fill="#64748b" text-anchor="middle">只问块在哪</text>

  <rect x="25" y="226" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="248" font-size="12" fill="#166534" text-anchor="middle">块服务器 A</text>
  <text x="135" y="266" font-size="12" fill="#166534" text-anchor="middle">存块副本与校验和</text>

  <rect x="273" y="226" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="248" font-size="12" fill="#166534" text-anchor="middle">块服务器 B</text>
  <text x="383" y="266" font-size="12" fill="#166534" text-anchor="middle">按句柄加区间读写</text>

  <rect x="521" y="226" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="631" y="248" font-size="12" fill="#166534" text-anchor="middle">块服务器 C</text>
  <text x="631" y="266" font-size="12" fill="#166534" text-anchor="middle">存在本地磁盘</text>

  <text x="383" y="302" font-size="12" fill="#64748b" text-anchor="middle">数据流绕开主节点，单 master 才撑得住</text>
</svg>
