<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 305" width="766" height="305"
     role="img" aria-labelledby="fig-gfs-21-title fig-gfs-21-desc">
  <title id="fig-gfs-21-title">记录追加的「至少一次」是怎么来的</title>
  <desc id="fig-gfs-21-desc">客户端只提交数据，主副本自己挑偏移写入；某个副本写失败时客户端重试，失败那次的字节留在块里，于是同一块的不同副本可能不再逐字节相同，但记录至少被写了一次。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="305" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">记录追加的「至少一次」是怎么来的</text>

  <path d="M250,91 L262,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M498,91 L510,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M631,123 L631,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M383,204 L383,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">客户端提交一条记录</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">不指定偏移，只给数据</text>

  <rect x="273" y="64" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="86" font-size="12" fill="#166534" text-anchor="middle">主副本挑一个偏移</text>
  <text x="383" y="104" font-size="12" fill="#166534" text-anchor="middle">把这条记录原子地写进去</text>

  <rect x="521" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="631" y="86" font-size="12" fill="#9d174d" text-anchor="middle">某个副本上写失败</text>
  <text x="631" y="104" font-size="12" fill="#9d174d" text-anchor="middle">客户端会重试</text>

  <rect x="25" y="145" width="716" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="383" y="167" font-size="12" fill="#b45309" text-anchor="middle">重试通常成功，失败那一次的字节却留在块里</text>
  <text x="383" y="185" font-size="12" fill="#b45309" text-anchor="middle">同一个块的不同副本因此可能不再逐字节相同</text>

  <rect x="25" y="226" width="716" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="383" y="248" font-size="12" fill="#6b21a8" text-anchor="middle">GFS 只保证这条记录作为原子单元至少被写了一次</text>
  <text x="383" y="266" font-size="12" fill="#6b21a8" text-anchor="middle">逐字节一致不在承诺之内</text>
</svg>
