<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 253" width="766" height="253"
     role="img" aria-labelledby="fig-gfs-19-title fig-gfs-19-desc">
  <title id="fig-gfs-19-title">读路径：元数据只问一次，数据此后都直连</title>
  <desc id="fig-gfs-19-desc">第一次读某个块时客户端向主节点问位置，顺手拿到紧随其后的几个块，并把映射按文件名加块下标缓存起来；之后读同一个块直接找块服务器，不再经过主节点。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="253" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">读路径：元数据只问一次，数据此后都直连</text>

  <path d="M250,91 L262,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M498,91 L510,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M631,123 L631,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">第一次读某个块</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">先向主节点问块在哪</text>

  <rect x="273" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="383" y="86" font-size="12" fill="#1e40af" text-anchor="middle">主节点回句柄与副本</text>
  <text x="383" y="104" font-size="12" fill="#1e40af" text-anchor="middle">顺手带上紧随其后的块</text>

  <rect x="521" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="631" y="86" font-size="12" fill="#1e40af" text-anchor="middle">客户端缓存这份映射</text>
  <text x="631" y="104" font-size="12" fill="#1e40af" text-anchor="middle">键是文件名加块下标</text>

  <rect x="25" y="145" width="716" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="167" font-size="12" fill="#166534" text-anchor="middle">之后读同一个块直接找块服务器，不再打扰主节点</text>
  <text x="383" y="185" font-size="12" fill="#166534" text-anchor="middle">只有缓存过期或文件被重新打开时才需要再问一次</text>

  <text x="383" y="225" font-size="12" fill="#64748b" text-anchor="middle">主节点只回答第一次，读写流量从此不经过它</text>
</svg>
