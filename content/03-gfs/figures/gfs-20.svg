<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 253" width="766" height="253"
     role="img" aria-labelledby="fig-gfs-20-title fig-gfs-20-desc">
  <title id="fig-gfs-20-title">命名空间操作为什么是原子的：只走主节点，还排进日志</title>
  <desc id="fig-gfs-20-desc">创建文件这类请求只发给主节点，主节点给命名空间加锁后把操作追加进操作日志，日志给出全局全序，所以所有客户端看到同一个顺序。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="253" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">命名空间操作为什么是原子的：只走主节点，还排进日志</text>

  <path d="M250,91 L262,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M498,91 L510,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M631,123 L631,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">创建文件这类请求</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">只发给主节点</text>

  <rect x="273" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="383" y="86" font-size="12" fill="#b45309" text-anchor="middle">主节点给命名空间加锁</text>
  <text x="383" y="104" font-size="12" fill="#b45309" text-anchor="middle">同一时刻只有一个操作</text>

  <rect x="521" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="631" y="86" font-size="12" fill="#b45309" text-anchor="middle">操作追加进操作日志</text>
  <text x="631" y="104" font-size="12" fill="#b45309" text-anchor="middle">日志给出全局全序</text>

  <rect x="25" y="145" width="716" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="167" font-size="12" fill="#166534" text-anchor="middle">所有客户端看到的是同一个顺序</text>
  <text x="383" y="185" font-size="12" fill="#166534" text-anchor="middle">所以命名空间操作是原子的</text>

  <text x="383" y="225" font-size="12" fill="#64748b" text-anchor="middle">全序不必协商，它由主节点的一条日志直接给出</text>
</svg>
