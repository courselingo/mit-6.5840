<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 253" width="766" height="253"
     role="img" aria-labelledby="fig-gfs-18-title fig-gfs-18-desc">
  <title id="fig-gfs-18-title">一次读写怎么定位到数据：偏移算出块下标，主节点给句柄</title>
  <desc id="fig-gfs-18-desc">客户端用文件名加字节偏移除以固定块大小得到块下标，向主节点问到块句柄后，块服务器按句柄加字节区间读写本地的普通文件。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="253" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次读写怎么定位到数据：偏移算出块下标，主节点给句柄</text>

  <path d="M250,91 L262,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M498,91 L510,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M631,123 L631,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">文件名 + 字节偏移</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">客户端手里只有这个</text>

  <rect x="273" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="383" y="86" font-size="12" fill="#1e40af" text-anchor="middle">除以块大小得块下标</text>
  <text x="383" y="104" font-size="12" fill="#1e40af" text-anchor="middle">块大小固定，换算是算术</text>

  <rect x="521" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="631" y="86" font-size="12" fill="#b45309" text-anchor="middle">主节点只回块句柄</text>
  <text x="631" y="104" font-size="12" fill="#b45309" text-anchor="middle">不可变的 64 位全局 ID</text>

  <rect x="25" y="145" width="716" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="167" font-size="12" fill="#166534" text-anchor="middle">块服务器把块当成普通 Linux 文件存在本地磁盘上</text>
  <text x="383" y="185" font-size="12" fill="#166534" text-anchor="middle">读写的单位是句柄加字节区间</text>

  <text x="383" y="225" font-size="12" fill="#64748b" text-anchor="middle">文件名加偏移是客户端的语言，句柄加区间是块服务器的语言</text>
</svg>
