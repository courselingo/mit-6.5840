<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-gfs-10-title fig-gfs-10-desc">
  <title id="fig-gfs-10-title">副本从放置到再复制的整条生命周期</title>
  <desc id="fig-gfs-10-desc">放置时主节点考虑三件事：挑磁盘使用率低于平均的机器、限制每台机器最近创建的块数、把副本分散到不同机架。副本数掉到目标以下不会立刻动手：等太短复制白做，等太长窗口一直敞着，所以先带着缺失副本继续跑，判为永久失效才安排再复制，并按损失大小排队。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">副本从放置到再复制的整条生命周期</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">放置时挑机器的三条考虑，各治一个毛病</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">副本数掉到目标以下之后：等多久、先救谁</text>

  <rect x="38" y="82" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="142" y="110" font-size="15" fill="#1e40af" text-anchor="middle">挑使用率低的机器</text>
  <text x="142" y="132" font-size="12" fill="#1e40af" text-anchor="middle">时间一长各台趋于均衡</text>

  <rect x="275" y="82" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="379" y="110" font-size="15" fill="#1e40af" text-anchor="middle">限制最近创建的块数</text>
  <text x="379" y="132" font-size="12" fill="#1e40af" text-anchor="middle">因为新块马上会有大量写入</text>

  <rect x="512" y="82" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="616" y="110" font-size="15" fill="#1e40af" text-anchor="middle">分散到不同机架</text>
  <text x="616" y="132" font-size="12" fill="#1e40af" text-anchor="middle">副本不会挤在一起坏</text>

  <rect x="38" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="142" y="244" font-size="15" fill="#b45309" text-anchor="middle">不会一发现就动手</text>
  <text x="142" y="266" font-size="12" fill="#b45309" text-anchor="middle">等太短则白做，等太长则窗口敞着</text>

  <rect x="275" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="244" font-size="15" fill="#b45309" text-anchor="middle">先带着缺失副本跑</text>
  <text x="379" y="266" font-size="12" fill="#b45309" text-anchor="middle">判为永久失效才安排再复制</text>

  <rect x="512" y="216" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="244" font-size="15" fill="#166534" text-anchor="middle">按损失大小排队</text>
  <text x="616" y="266" font-size="12" fill="#166534" text-anchor="middle">丢两个副本的比丢一个的更急</text>
</svg>
