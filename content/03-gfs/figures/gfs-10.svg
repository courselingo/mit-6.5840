<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 334" width="766" height="334"
     role="img" aria-labelledby="fig-gfs-10-title fig-gfs-10-desc">
  <title id="fig-gfs-10-title">新副本放在哪台机器：三条考虑，各治一个毛病</title>
  <desc id="fig-gfs-10-desc">副本来自块创建、再复制与再均衡；放置时挑磁盘使用率低于平均的机器、限制最近创建的块数、并把副本分散到不同机架，分别治均衡、热点与机架故障。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="334" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">新副本放在哪台机器：三条考虑，各治一个毛病</text>

  <path d="M135,123 L135,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M383,123 L383,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M631,123 L631,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M135,204 L135,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M383,204 L383,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M631,204 L631,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="716" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="383" y="86" font-size="12" fill="#1e40af" text-anchor="middle">副本来自块的创建、再复制与再均衡</text>
  <text x="383" y="104" font-size="12" fill="#1e40af" text-anchor="middle">主节点要决定的是：新副本放到哪台机器上</text>

  <rect x="25" y="145" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="167" font-size="12" fill="#b45309" text-anchor="middle">挑磁盘使用率低的机器</text>
  <text x="135" y="185" font-size="12" fill="#b45309" text-anchor="middle">低于平均的优先</text>

  <rect x="273" y="145" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="383" y="167" font-size="12" fill="#b45309" text-anchor="middle">限制最近创建的块数</text>
  <text x="383" y="185" font-size="12" fill="#b45309" text-anchor="middle">新建往往预示马上大量写</text>

  <rect x="521" y="145" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="631" y="167" font-size="12" fill="#b45309" text-anchor="middle">副本分散到不同机架</text>
  <text x="631" y="185" font-size="12" fill="#b45309" text-anchor="middle">别让一个机架全灭</text>

  <rect x="25" y="226" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="248" font-size="12" fill="#166534" text-anchor="middle">使用率长期趋于均衡</text>
  <text x="135" y="266" font-size="12" fill="#166534" text-anchor="middle">时间一长自然摊平</text>

  <rect x="273" y="226" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="248" font-size="12" fill="#166534" text-anchor="middle">写热点不堆在一台机器</text>
  <text x="383" y="266" font-size="12" fill="#166534" text-anchor="middle">写满之后基本只读</text>

  <rect x="521" y="226" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="631" y="248" font-size="12" fill="#166534" text-anchor="middle">扛得住单个机架故障</text>
  <text x="631" y="266" font-size="12" fill="#166534" text-anchor="middle">副本不会一起消失</text>

  <text x="383" y="306" font-size="12" fill="#64748b" text-anchor="middle">放置策略同时在治均衡、热点和机架故障，不是随便挑一台</text>
</svg>
