<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264"
     role="img" aria-labelledby="fig-gfs-8-title fig-gfs-8-desc">
  <title id="fig-gfs-8-title">块大的代价：小文件变成热点，少数块服务器被打爆</title>
  <desc id="fig-gfs-8-desc">一条链从单块可执行文件走到块服务器被打爆，再落到一组修法上：提高副本数、错开启动时间，长期让客户端之间互读。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="264" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">块大的代价：小文件变成热点，少数块服务器被打爆</text>

  <path d="M247,89 L259,89" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M495,89 L507,89" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M628,121 L628,133" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="62" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="84" font-size="12" fill="#1e40af" text-anchor="middle">一个可执行文件</text>
  <text x="132" y="102" font-size="12" fill="#1e40af" text-anchor="middle">只占一个块</text>

  <rect x="270" y="62" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="84" font-size="12" fill="#1e40af" text-anchor="middle">上百台机器同时启动它</text>
  <text x="380" y="102" font-size="12" fill="#1e40af" text-anchor="middle">都去读同一个块</text>

  <rect x="518" y="62" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="628" y="84" font-size="12" fill="#9d174d" text-anchor="middle">存这个块的少数机器</text>
  <text x="628" y="102" font-size="12" fill="#9d174d" text-anchor="middle">瞬间被压垮</text>

  <rect x="22" y="144" width="716" height="98" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>

  <rect x="37" y="159" width="210" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="142" y="187" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">修法一：提高副本数</text>
  <text x="142" y="209" font-size="12" fill="#166534" text-anchor="middle">把读压力摊给更多机器</text>

  <rect x="275" y="159" width="210" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="187" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">修法二：错开启动时间</text>
  <text x="380" y="209" font-size="12" fill="#166534" text-anchor="middle">别让峰值同时到达</text>

  <rect x="513" y="159" width="210" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="618" y="187" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">长期：客户端之间互读</text>
  <text x="618" y="209" font-size="12" fill="#166534" text-anchor="middle">让数据在客户端间流动</text>
</svg>
