<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-gfs-8-title fig-gfs-8-desc">
  <title id="fig-gfs-8-title">块大的代价：论文列了一条，我们补了两条</title>
  <desc id="fig-gfs-8-desc">热点是论文为块大列出的唯一一条缺点：一个可执行文件被当作单块文件写进 GFS、上百台机器同时启动它，存这个块的少数机器瞬间被压垮，修法是提高副本数并错开启动时间。下面两条是我们的补充，论文没有把它们列为块大的缺点：尾部延迟被放大，链式路径上最慢的一环决定这次写的耗时；粒度代价，1KB 与 64MB 的文件都只占一个块，真正被牺牲的是调度的精细度。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">块大的代价：论文列了一条，我们补了两条</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">热点：论文如实记下的那次启动风暴</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">另外两条代价不在磁盘上（这两条是我们的补充）</text>

  <rect x="38" y="82" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="202" y="110" font-size="15" fill="#9d174d" text-anchor="middle">单块可执行文件被上百台同时启动</text>
  <text x="202" y="132" font-size="12" fill="#9d174d" text-anchor="middle">存这个块的少数机器瞬间被压垮</text>

  <rect x="394" y="82" width="328" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="558" y="110" font-size="15" fill="#b45309" text-anchor="middle">两条应急修法</text>
  <text x="558" y="132" font-size="12" fill="#b45309" text-anchor="middle">给这类文件更高副本数，并错开启动</text>

  <rect x="38" y="216" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="202" y="244" font-size="15" fill="#9d174d" text-anchor="middle">尾部延迟被放大</text>
  <text x="202" y="266" font-size="12" fill="#9d174d" text-anchor="middle">链式路径上最慢的一环决定这次写多久</text>

  <rect x="394" y="216" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="558" y="244" font-size="15" fill="#9d174d" text-anchor="middle">粒度代价</text>
  <text x="558" y="266" font-size="12" fill="#9d174d" text-anchor="middle">1KB 与 64MB 都只占一个块，牺牲的是调度精度</text>
</svg>
