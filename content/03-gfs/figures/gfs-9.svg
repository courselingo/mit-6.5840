<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 305" width="766" height="305"
     role="img" aria-labelledby="fig-gfs-9-title fig-gfs-9-desc">
  <title id="fig-gfs-9-title">延迟分配不浪费空间，但调度粒度变粗了</title>
  <desc id="fig-gfs-9-desc">1KB 的文件和 64MB 的文件都只占一个块，磁盘空间没浪费，可是主节点的内存、后台扫描与负载均衡全都以块为单位记账，被牺牲的是调度精度。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="305" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">延迟分配不浪费空间，但调度粒度变粗了</text>

  <path d="M195,123 L195,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M568,123 L568,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M195,204 L195,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M568,204 L568,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="341" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="86" font-size="12" fill="#1e40af" text-anchor="middle">1KB 的文件</text>
  <text x="195" y="104" font-size="12" fill="#1e40af" text-anchor="middle">占 1 个块</text>

  <rect x="396" y="64" width="345" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="568" y="86" font-size="12" fill="#1e40af" text-anchor="middle">64MB 的文件</text>
  <text x="568" y="104" font-size="12" fill="#1e40af" text-anchor="middle">也占 1 个块</text>

  <rect x="25" y="145" width="341" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195" y="167" font-size="12" fill="#166534" text-anchor="middle">磁盘空间不浪费</text>
  <text x="195" y="185" font-size="12" fill="#166534" text-anchor="middle">副本按需增长、延迟分配</text>

  <rect x="396" y="145" width="345" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="568" y="167" font-size="12" fill="#9d174d" text-anchor="middle">但内存、后台扫描、均衡</text>
  <text x="568" y="185" font-size="12" fill="#9d174d" text-anchor="middle">全都以块为单位记账</text>

  <rect x="25" y="226" width="716" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="383" y="248" font-size="12" fill="#6b21a8" text-anchor="middle">小文件和大文件在「占几个块」上一样贵</text>
  <text x="383" y="266" font-size="12" fill="#6b21a8" text-anchor="middle">被牺牲掉的是调度精度，不是磁盘空间</text>
</svg>
