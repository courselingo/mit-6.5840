<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 287" width="760" height="287"
     role="img" aria-labelledby="fig-gfs-26-title fig-gfs-26-desc">
  <title id="fig-gfs-26-title">再复制的时机：等太短白做，等太长就危险</title>
  <desc id="fig-gfs-26-desc">等得太短会把可能自己回来的机器当成死了，复制工作白做还占带宽；等得太长，副本不足的窗口一直敞着，期间再坏一块就真的丢数据。设计选的是中间那条路：先带着缺失副本跑，等到判为永久失效才开始再复制。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="287" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">再复制的时机：等太短白做，等太长就危险</text>

  <rect x="22" y="62" width="344" height="90" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="94" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">等得太短</text>
  <text x="194" y="112" font-size="12" fill="#9d174d" text-anchor="middle">刚静默的机器磁盘完好，常常回来</text>
  <text x="194" y="130" font-size="12" fill="#9d174d" text-anchor="middle">复制白做，还占掉别处要用的带宽</text>

  <rect x="394" y="62" width="344" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="94" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">等得太长</text>
  <text x="566" y="112" font-size="12" fill="#b45309" text-anchor="middle">副本不足的窗口一直敞着</text>
  <text x="566" y="130" font-size="12" fill="#b45309" text-anchor="middle">期间再坏一块就真的丢数据</text>

  <path d="M233,207 L245,207" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M509,207 L521,207" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="180" width="206" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="125" y="202" font-size="12" fill="#1e40af" text-anchor="middle">块服务器静默</text>
  <text x="125" y="220" font-size="12" fill="#1e40af" text-anchor="middle">副本数掉到目标以下</text>

  <rect x="256" y="180" width="248" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="202" font-size="12" fill="#b45309" text-anchor="middle">等待期：带着缺失的副本跑</text>
  <text x="380" y="220" font-size="12" fill="#b45309" text-anchor="middle">主副本不断重试那个副本</text>

  <rect x="532" y="180" width="206" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="635" y="202" font-size="12" fill="#166534" text-anchor="middle">判为永久失效</text>
  <text x="635" y="220" font-size="12" fill="#166534" text-anchor="middle">这时才开始再复制</text>

  <text x="380" y="262" font-size="12" fill="#64748b" text-anchor="middle">等待期一过才安排再复制，顺序按离目标有多远排</text>
</svg>
