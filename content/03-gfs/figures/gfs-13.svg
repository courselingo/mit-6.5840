<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 334" width="766" height="334"
     role="img" aria-labelledby="fig-gfs-13-title fig-gfs-13-desc">
  <title id="fig-gfs-13-title">读的时候先验校验和，坏块从别的副本修回来</title>
  <desc id="fig-gfs-13-desc">每个块切成 64KB 小块各配 32 位校验和，读时先验证再返回；不匹配就报错上报，请求方改读别的副本，主节点从有效副本克隆并让报错机器删掉坏副本。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="334" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">读的时候先验校验和，坏块从别的副本修回来</text>

  <path d="M195,123 L195,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M568,123 L568,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M371,172 L385,172" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M195,204 L195,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M568,204 L568,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M371,253 L385,253" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="716" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="383" y="86" font-size="12" fill="#1e40af" text-anchor="middle">每个块再切成 64KB 小块，每小块配一个 32 位校验和</text>
  <text x="383" y="104" font-size="12" fill="#1e40af" text-anchor="middle">校验和与用户数据分开存放，并随日志一起持久化</text>

  <rect x="25" y="145" width="341" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195" y="167" font-size="12" fill="#b45309" text-anchor="middle">读时先验证再返回</text>
  <text x="195" y="185" font-size="12" fill="#b45309" text-anchor="middle">坏数据不会传给别的机器</text>

  <rect x="396" y="145" width="345" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="568" y="167" font-size="12" fill="#9d174d" text-anchor="middle">不匹配就向请求方报错</text>
  <text x="568" y="185" font-size="12" fill="#9d174d" text-anchor="middle">同时上报主节点</text>

  <rect x="25" y="226" width="341" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195" y="248" font-size="12" fill="#166534" text-anchor="middle">请求方改读别的副本</text>
  <text x="195" y="266" font-size="12" fill="#166534" text-anchor="middle">先把读服务续上</text>

  <rect x="396" y="226" width="345" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="568" y="248" font-size="12" fill="#166534" text-anchor="middle">主节点从有效副本克隆这个块</text>
  <text x="568" y="266" font-size="12" fill="#166534" text-anchor="middle">再让报错的机器删掉坏副本</text>

  <text x="383" y="306" font-size="12" fill="#64748b" text-anchor="middle">宁可暂时不可用，也不把损坏的字节返回给客户端</text>
</svg>
