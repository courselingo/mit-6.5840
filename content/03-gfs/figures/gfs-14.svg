<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 252" width="762" height="252"
     role="img" aria-labelledby="fig-gfs-14-title fig-gfs-14-desc">
  <title id="fig-gfs-14-title">一致性模型的三档：已定义、一致但未定义、不一致且未定义</title>
  <desc id="fig-gfs-14-desc">三档排成一条刻度，越往右承诺越弱：串行成功的修改是已定义，并发成功的修改一致但未定义，有副本出错的修改不一致也未定义，GFS 的底线落在中间那一档。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="762" height="252" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一致性模型的三档：已定义、一致但未定义、不一致且未定义</text>

  <path d="M22,190 L738,190" fill="none" stroke="#94a3b8"/>
  <path d="M132,183 L132,197" fill="none" stroke="#94a3b8"/>
  <path d="M380,183 L380,197" fill="none" stroke="#94a3b8"/>
  <path d="M628,183 L628,197" fill="none" stroke="#94a3b8"/>

  <rect x="22" y="62" width="220" height="90" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="132" y="94" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">已定义</text>
  <text x="132" y="112" font-size="12" fill="#166534" text-anchor="middle">串行成功的修改</text>
  <text x="132" y="130" font-size="12" fill="#166534" text-anchor="middle">读者看到完整的写入</text>

  <rect x="270" y="62" width="220" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="94" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">一致但未定义</text>
  <text x="380" y="112" font-size="12" fill="#b45309" text-anchor="middle">并发成功的修改</text>
  <text x="380" y="130" font-size="12" fill="#b45309" text-anchor="middle">字节一样，是碎片拼的</text>

  <rect x="518" y="62" width="220" height="90" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="628" y="94" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">不一致且未定义</text>
  <text x="628" y="112" font-size="12" fill="#9d174d" text-anchor="middle">有副本出错的修改</text>
  <text x="628" y="130" font-size="12" fill="#9d174d" text-anchor="middle">不同副本读到不同字节</text>

  <text x="380" y="225" font-size="12" fill="#64748b" text-anchor="middle">越往右承诺越弱；GFS 的底线只到中间那一档，不到「已定义」</text>
</svg>
