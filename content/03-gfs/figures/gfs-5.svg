<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 327" width="672" height="327"
     role="img" aria-labelledby="fig-gfs-5-title fig-gfs-5-desc">
  <title id="fig-gfs-5-title">三条因果链：工作负载决定了块大小、一致性和带宽</title>
  <desc id="fig-gfs-5-desc">三条链各占一行，左端是工作负载，右端是它推出的设计选择：大块连续推出 64MB 的块，只追加推出弱一致性，吞吐优先推出优化带宽。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="672" height="327" fill="#ffffff"/>

  <text x="336" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三条因果链：工作负载决定了块大小、一致性和带宽</text>

  <path d="M327,89 L339,89" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M327,168 L339,168" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M327,247 L339,247" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="62" width="300" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="172" y="84" font-size="12" fill="#1e40af" text-anchor="middle">读写都是大块、连续</text>
  <text x="172" y="102" font-size="12" fill="#1e40af" text-anchor="middle">小随机读要批量排序</text>

  <rect x="350" y="62" width="300" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="500" y="84" font-size="12" fill="#166534" text-anchor="middle">块可以做到 64MB</text>
  <text x="500" y="102" font-size="12" fill="#166534" text-anchor="middle">元数据因此很小</text>

  <rect x="22" y="141" width="300" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="172" y="163" font-size="12" fill="#1e40af" text-anchor="middle">写几乎只有追加</text>
  <text x="172" y="181" font-size="12" fill="#1e40af" text-anchor="middle">多客户端并发追加</text>

  <rect x="350" y="141" width="300" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="500" y="163" font-size="12" fill="#166534" text-anchor="middle">敢把一致性放松</text>
  <text x="500" y="181" font-size="12" fill="#166534" text-anchor="middle">应用自己补齐</text>

  <rect x="22" y="220" width="300" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="172" y="242" font-size="12" fill="#1e40af" text-anchor="middle">吞吐比延迟重要</text>
  <text x="172" y="260" font-size="12" fill="#1e40af" text-anchor="middle">不在乎单次响应时间</text>

  <rect x="350" y="220" width="300" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="500" y="242" font-size="12" fill="#166534" text-anchor="middle">优化带宽而非延迟</text>
  <text x="500" y="260" font-size="12" fill="#166534" text-anchor="middle">链式分发摊薄主节点的带宽压力</text>

  <text x="336" y="302" font-size="12" fill="#64748b" text-anchor="middle">每条链两步：左端是工作负载，右端是它推出的设计选择</text>
</svg>
