<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 253" width="766" height="253"
     role="img" aria-labelledby="fig-gfs-5-title fig-gfs-5-desc">
  <title id="fig-gfs-5-title">三条因果链：工作负载决定了块大小、一致性和带宽</title>
  <desc id="fig-gfs-5-desc">读写都是大块连续，所以块可以做到 64MB；写几乎只有追加，所以敢放松一致性；吞吐比延迟重要，所以优化带宽。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="253" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三条因果链：工作负载决定了块大小、一致性和带宽</text>

  <path d="M135,123 L135,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M383,123 L383,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M631,123 L631,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">读写都是大块、连续</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">小随机读要批量排序</text>

  <rect x="273" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="383" y="86" font-size="12" fill="#1e40af" text-anchor="middle">写几乎只有追加</text>
  <text x="383" y="104" font-size="12" fill="#1e40af" text-anchor="middle">多客户端并发追加</text>

  <rect x="521" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="631" y="86" font-size="12" fill="#1e40af" text-anchor="middle">吞吐比延迟重要</text>
  <text x="631" y="104" font-size="12" fill="#1e40af" text-anchor="middle">不在乎单次响应时间</text>

  <rect x="25" y="145" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="167" font-size="12" fill="#166534" text-anchor="middle">块可以做到 64MB</text>
  <text x="135" y="185" font-size="12" fill="#166534" text-anchor="middle">元数据因此很小</text>

  <rect x="273" y="145" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="167" font-size="12" fill="#166534" text-anchor="middle">敢把一致性放松</text>
  <text x="383" y="185" font-size="12" fill="#166534" text-anchor="middle">应用自己补齐</text>

  <rect x="521" y="145" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="631" y="167" font-size="12" fill="#166534" text-anchor="middle">优化带宽而非延迟</text>
  <text x="631" y="185" font-size="12" fill="#166534" text-anchor="middle">链式分发摊薄延迟</text>

  <text x="383" y="225" font-size="12" fill="#64748b" text-anchor="middle">六条假设读成一句话：故障是日常；其余几条决定了系统形状</text>
</svg>
