<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" width="760" height="298"
     role="img" aria-labelledby="fig-gfs-17-title fig-gfs-17-desc">
  <title id="fig-gfs-17-title">租约的三种去向：续期、被撤销、等它过期</title>
  <desc id="fig-gfs-17-desc">一次租约授予之后分三路：块上一直在写就搭着心跳续期，要改文件名时主节点提前撤销，和主副本失去联络就只等它过期，时间因此成了旧权威已失效的证据。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="298" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">租约的三种去向：续期、被撤销、等它过期</text>

  <rect x="22" y="62" width="716" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="90" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">主节点把一个块的租约授予某个副本</text>

  <path d="M132,112 L132,124" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,112 L380,124" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M628,112 L628,124" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="135" width="220" height="68" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="132" y="163" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">继续当主副本</text>
  <text x="132" y="185" font-size="12" fill="#166534" text-anchor="middle">块一直在写，搭心跳续期</text>

  <rect x="270" y="135" width="220" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="163" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">被主节点撤销</text>
  <text x="380" y="185" font-size="12" fill="#b45309" text-anchor="middle">文件要改名，先冻结修改</text>

  <rect x="518" y="135" width="220" height="68" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="628" y="163" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">等到租约过期</text>
  <text x="628" y="185" font-size="12" fill="#9d174d" text-anchor="middle">失去联络时不猜，只等时间</text>

  <rect x="22" y="231" width="716" height="45" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="259" font-size="15" font-weight="600" fill="#6b21a8" text-anchor="middle">时间在这里充当证据：租约一过期，旧权威就一定已经失效</text>
</svg>
