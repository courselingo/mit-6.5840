<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 253" width="766" height="253"
     role="img" aria-labelledby="fig-gfs-12-title fig-gfs-12-desc">
  <title id="fig-gfs-12-title">掉线又回来的副本，靠块版本号被认出来</title>
  <desc id="fig-gfs-12-desc">授予租约时版本号加一，联系不上的副本不会被推进，重启后它自报的旧版本号让主节点一眼看出它落后，于是当它不存在并在垃圾回收时清掉。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="253" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">掉线又回来的副本，靠块版本号被认出来</text>

  <path d="M250,91 L262,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M498,91 L510,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M631,123 L631,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">授予租约时版本号加一</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">先写进最新副本的持久状态</text>

  <rect x="273" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="383" y="86" font-size="12" fill="#9d174d" text-anchor="middle">当时联系不上的副本</text>
  <text x="383" y="104" font-size="12" fill="#9d174d" text-anchor="middle">停在旧版本号上</text>

  <rect x="521" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="631" y="86" font-size="12" fill="#b45309" text-anchor="middle">它重启后自报版本号</text>
  <text x="631" y="104" font-size="12" fill="#b45309" text-anchor="middle">主节点一眼看出它落后</text>

  <rect x="25" y="145" width="716" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="167" font-size="12" fill="#166534" text-anchor="middle">落后的副本：主节点当它不存在，不派它参与修改，也不告诉客户端</text>
  <text x="383" y="185" font-size="12" fill="#166534" text-anchor="middle">垃圾回收时清掉它；若它报的版本号更大，就认较大的那个</text>

  <text x="383" y="225" font-size="12" fill="#64748b" text-anchor="middle">没有版本号，掉过线的副本会带着过期数据重新混进来</text>
</svg>
