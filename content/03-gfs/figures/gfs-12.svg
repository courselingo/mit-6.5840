<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-gfs-12-title fig-gfs-12-desc">
  <title id="fig-gfs-12-title">掉线又回来的副本靠版本号认出，数据损坏靠校验和认出</title>
  <desc id="fig-gfs-12-desc">授予租约时版本号加一并通知所有仍然最新的副本；联系不上的副本停在旧号，重启自报时被一眼认出，垃圾回收时清掉，之前当它不存在。完整性走另一条路：每个块切成 64KB 小块各配 32 位校验和，读时先验证，不匹配就报错、改读别的副本，并从有效副本克隆修回。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">掉线又回来的副本靠版本号认出，数据损坏靠校验和认出</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">版本号让「落后」变成可比较的数字</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">数据完整性走的是另一条路</text>

  <rect x="38" y="82" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="142" y="110" font-size="15" fill="#1e40af" text-anchor="middle">授予租约时加一</text>
  <text x="142" y="132" font-size="12" fill="#1e40af" text-anchor="middle">先写进副本的持久状态</text>

  <rect x="275" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379" y="110" font-size="15" fill="#9d174d" text-anchor="middle">联系不上的那台</text>
  <text x="379" y="132" font-size="12" fill="#9d174d" text-anchor="middle">停在旧号，重启自报时被认出</text>

  <rect x="512" y="82" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="110" font-size="15" fill="#166534" text-anchor="middle">落后的副本被清掉</text>
  <text x="616" y="132" font-size="12" fill="#166534" text-anchor="middle">之前干脆当它不存在</text>

  <rect x="38" y="216" width="328" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="202" y="244" font-size="15" fill="#b45309" text-anchor="middle">每 64KB 小块一个校验和</text>
  <text x="202" y="266" font-size="12" fill="#b45309" text-anchor="middle">与用户数据分开存放，读时先验证</text>

  <rect x="394" y="216" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="244" font-size="15" fill="#166534" text-anchor="middle">不匹配就报错并修回来</text>
  <text x="558" y="266" font-size="12" fill="#166534" text-anchor="middle">改读别的副本，从有效副本克隆</text>
</svg>
