<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 253" width="766" height="253"
     role="img" aria-labelledby="fig-gfs-23-title fig-gfs-23-desc">
  <title id="fig-gfs-23-title">应用怎么把未定义区域挡在业务之外</title>
  <desc id="fig-gfs-23-desc">应用用追加而非改写、写完原子改名、周期写检查点、记录自带校验和与唯一标识，让重复与填充天然落在业务之外，代价是这些约定要由应用自己守住。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="253" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">应用怎么把未定义区域挡在业务之外</text>

  <path d="M135,123 L135,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M383,123 L383,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M631,123 L631,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">写：只追加，不改写</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">全部写完再原子改名</text>

  <rect x="273" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="383" y="86" font-size="12" fill="#1e40af" text-anchor="middle">周期写检查点</text>
  <text x="383" y="104" font-size="12" fill="#1e40af" text-anchor="middle">读者只处理到最后一个检查点</text>

  <rect x="521" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="631" y="86" font-size="12" fill="#1e40af" text-anchor="middle">记录自带校验和与唯一 ID</text>
  <text x="631" y="104" font-size="12" fill="#1e40af" text-anchor="middle">消费端幂等或自行去重</text>

  <rect x="25" y="145" width="716" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="167" font-size="12" fill="#166534" text-anchor="middle">重复与填充因此落在业务之外，正确性不受影响</text>
  <text x="383" y="185" font-size="12" fill="#166534" text-anchor="middle">代价是这些约定必须由应用自己守住</text>

  <text x="383" y="225" font-size="12" fill="#64748b" text-anchor="middle">GFS 把一部分复杂度从存储系统下推给了应用</text>
</svg>
