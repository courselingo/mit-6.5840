<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 305" width="766" height="305"
     role="img" aria-labelledby="fig-gfs-11-title fig-gfs-11-desc">
  <title id="fig-gfs-11-title">什么时候立刻再复制，先救谁</title>
  <desc id="fig-gfs-11-desc">可用副本数掉到目标值以下就立刻再复制，触发原因包括机器不可用、自报损坏、磁盘停用与调高目标；恢复按损失大小排队，丢两个副本的最急。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="305" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">什么时候立刻再复制，先救谁</text>

  <path d="M195,123 L195,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M568,123 L568,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M195,204 L195,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M568,204 L568,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="716" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="383" y="86" font-size="12" fill="#9d174d" text-anchor="middle">可用副本数掉到目标值以下，主节点立刻再复制</text>
  <text x="383" y="104" font-size="12" fill="#9d174d" text-anchor="middle">触发原因：机器不可用、自报损坏、磁盘停用、调高目标</text>

  <rect x="25" y="145" width="341" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195" y="167" font-size="12" fill="#b45309" text-anchor="middle">优先级：丢两个副本的最急</text>
  <text x="195" y="185" font-size="12" fill="#b45309" text-anchor="middle">丢得越多，排得越前</text>

  <rect x="396" y="145" width="345" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="568" y="167" font-size="12" fill="#b45309" text-anchor="middle">管理员调高副本目标也算触发</text>
  <text x="568" y="185" font-size="12" fill="#b45309" text-anchor="middle">和掉线一样排队处理</text>

  <rect x="25" y="226" width="716" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="383" y="248" font-size="12" fill="#6b21a8" text-anchor="middle">恢复资源有限时，按损失大小排队</text>
  <text x="383" y="266" font-size="12" fill="#6b21a8" text-anchor="middle">而不是按发现顺序排队</text>
</svg>
