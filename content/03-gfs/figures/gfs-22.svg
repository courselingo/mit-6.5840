<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 253" width="766" height="253"
     role="img" aria-labelledby="fig-gfs-22-title fig-gfs-22-desc">
  <title id="fig-gfs-22-title">块满时的边界：先填满、再换块，记录不超过块的四分之一</title>
  <desc id="fig-gfs-22-desc">追加会让块超过 64MB 时，主节点先把当前块填满到上限并让所有副本照做，再告诉客户端换下一个块重试；单条记录因此被限制在块大小的四分之一以内。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="253" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">块满时的边界：先填满、再换块，记录不超过块的四分之一</text>

  <path d="M250,91 L262,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M498,91 L510,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M631,123 L631,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">追加会让块超过 64MB</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">主节点会先发现</text>

  <rect x="273" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="383" y="86" font-size="12" fill="#b45309" text-anchor="middle">把当前块填满到上限</text>
  <text x="383" y="104" font-size="12" fill="#b45309" text-anchor="middle">所有副本照做，字节一致</text>

  <rect x="521" y="64" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="631" y="86" font-size="12" fill="#166534" text-anchor="middle">告诉客户端换下一块重试</text>
  <text x="631" y="104" font-size="12" fill="#166534" text-anchor="middle">记录本身没有丢</text>

  <rect x="25" y="145" width="716" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="383" y="167" font-size="12" fill="#6b21a8" text-anchor="middle">所以单条记录被限制在块大小的四分之一以内</text>
  <text x="383" y="185" font-size="12" fill="#6b21a8" text-anchor="middle">否则最坏情况下的碎片不可接受</text>

  <text x="383" y="225" font-size="12" fill="#64748b" text-anchor="middle">填满的字节落进未定义区域，和重复一样由读取端跳过</text>
</svg>
