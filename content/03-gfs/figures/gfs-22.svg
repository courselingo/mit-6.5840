<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-gfs-22-title fig-gfs-22-desc">
  <title id="fig-gfs-22-title">弱一致性的另一面：块满的边界与应用要守的三条约定</title>
  <desc id="fig-gfs-22-desc">追加会让块超过 64MB 时，主副本把块填满到上限、让所有次副本照做，再告诉客户端换下一个块重试，这是第一条边界；第二条边界是单条记录的大小，它被限制在块的四分之一以内，否则最坏情况下的碎片不可接受。应用这边要守三条约定：用追加而不是改写、写完原子改名；周期性写检查点；记录自带校验和与唯一标识，让重复可以被安全处理。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">弱一致性的另一面：块满的边界与应用要守的三条约定</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">块满时还有两条边界要交代</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">应用这边也要守三条约定，把未定义区域挡在业务之外</text>

  <rect x="38" y="82" width="328" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="202" y="110" font-size="15" fill="#b45309" text-anchor="middle">边界一：块满 64MB</text>
  <text x="202" y="132" font-size="12" fill="#b45309" text-anchor="middle">主副本填满到上限，次副本照做，再换块重试</text>

  <rect x="394" y="82" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="110" font-size="15" fill="#166534" text-anchor="middle">边界二：单条记录的大小</text>
  <text x="558" y="132" font-size="12" fill="#166534" text-anchor="middle">限制在块的四分之一以内，否则碎片不可接受</text>

  <rect x="38" y="216" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="142" y="244" font-size="15" fill="#1e40af" text-anchor="middle">只追加不改写</text>
  <text x="142" y="266" font-size="12" fill="#1e40af" text-anchor="middle">全部写完后原子改名</text>

  <rect x="275" y="216" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="379" y="244" font-size="15" fill="#1e40af" text-anchor="middle">周期性写检查点</text>
  <text x="379" y="266" font-size="12" fill="#1e40af" text-anchor="middle">读者只处理到最后一个检查点</text>

  <rect x="512" y="216" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616" y="244" font-size="15" fill="#166534" text-anchor="middle">自带校验和与标识</text>
  <text x="616" y="266" font-size="12" fill="#166534" text-anchor="middle">重复就能被安全地处理</text>
</svg>
