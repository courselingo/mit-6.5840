<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-gfs-2-title fig-gfs-2-desc">
  <title id="fig-gfs-2-title">多个客户端怎么排成一个顺序，以及一次写的七步</title>
  <desc id="fig-gfs-2-desc">A 与 B 的写同时到达时，主副本按到达顺序分配连续序号，次副本按同一顺序应用；全局顺序来自租约先后与租约内的序号两件事。七步里最关键的是先推数据、后发写请求：客户端先问主节点要租约，把数据推给所有副本，此刻还没发写请求，之后再向主副本发写请求定序，次副本按同一顺序应用，出错就重试。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">多个客户端怎么排成一个顺序，以及一次写的七步</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">多个客户端的修改要排成一个顺序</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">一次写的完整步骤：先推数据，后发写请求</text>

  <path d="M193,250 L205,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M371,250 L383,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M549,250 L561,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="142" y="110" font-size="15" fill="#1e40af" text-anchor="middle">A 与 B 的写同时到达</text>
  <text x="142" y="132" font-size="12" fill="#1e40af" text-anchor="middle">主副本按到达顺序定序</text>

  <rect x="275" y="82" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="110" font-size="15" fill="#b45309" text-anchor="middle">分配连续序号</text>
  <text x="379" y="132" font-size="12" fill="#b45309" text-anchor="middle">次副本按同一顺序应用</text>

  <rect x="512" y="82" width="209" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="616" y="110" font-size="15" fill="#6b21a8" text-anchor="middle">全局顺序来自两件事</text>
  <text x="616" y="132" font-size="12" fill="#6b21a8" text-anchor="middle">租约先后 + 租约内的序号</text>

  <rect x="38" y="216" width="150" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="113" y="244" font-size="15" fill="#1e40af" text-anchor="middle">问主节点要租约</text>
  <text x="113" y="266" font-size="12" fill="#1e40af" text-anchor="middle">拿到主副本与位置</text>

  <rect x="216" y="216" width="150" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="291" y="244" font-size="15" fill="#b45309" text-anchor="middle">数据先铺开</text>
  <text x="291" y="266" font-size="12" fill="#b45309" text-anchor="middle">此刻还没发写请求</text>

  <rect x="394" y="216" width="150" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="469" y="244" font-size="15" fill="#b45309" text-anchor="middle">再发写请求</text>
  <text x="469" y="266" font-size="12" fill="#b45309" text-anchor="middle">主副本定序并应用</text>

  <rect x="572" y="216" width="150" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="647" y="244" font-size="15" fill="#166534" text-anchor="middle">次副本照做</text>
  <text x="647" y="266" font-size="12" fill="#166534" text-anchor="middle">任何副本出错就重试</text>
</svg>
