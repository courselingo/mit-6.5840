<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 305" width="766" height="305"
     role="img" aria-labelledby="fig-gfs-2-title fig-gfs-2-desc">
  <title id="fig-gfs-2-title">一次写入的关键路径：数据流与控制流分开</title>
  <desc id="fig-gfs-2-desc">客户端先向主节点要租约，再把数据推给所有副本，最后才发写请求；主副本定序后转发给次副本，数据流与控制流是两条分开的路径。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="305" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次写入的关键路径：数据流与控制流分开</text>

  <path d="M75,140 L75,129" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M195,123 L195,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M250,161 L262,161" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M250,183 L262,183" fill="none" stroke="#f59e0b" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <path d="M310,204 L310,215" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M456,204 L456,215" fill="none" stroke="#f59e0b" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <path d="M498,239 L510,239" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M498,261 L510,261" fill="none" stroke="#f59e0b" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <path d="M383,221 L383,210" fill="none" stroke="#f59e0b" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="86" font-size="12" fill="#b45309" text-anchor="middle">主节点</text>
  <text x="135" y="104" font-size="12" fill="#b45309" text-anchor="middle">只发租约，不搬数据</text>

  <rect x="25" y="145" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="167" font-size="12" fill="#1e40af" text-anchor="middle">客户端</text>
  <text x="135" y="185" font-size="12" fill="#1e40af" text-anchor="middle">先推数据，后发请求</text>

  <rect x="273" y="145" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="167" font-size="12" fill="#166534" text-anchor="middle">主副本（持租约）</text>
  <text x="383" y="185" font-size="12" fill="#166534" text-anchor="middle">定序后转给次副本</text>

  <rect x="273" y="226" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="383" y="248" font-size="12" fill="#166534" text-anchor="middle">次副本 A</text>
  <text x="383" y="266" font-size="12" fill="#166534" text-anchor="middle">按同一顺序应用</text>

  <rect x="521" y="226" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="631" y="248" font-size="12" fill="#166534" text-anchor="middle">次副本 B</text>
  <text x="631" y="266" font-size="12" fill="#166534" text-anchor="middle">沿链继续转发</text>

  <text x="620" y="163" font-size="12" fill="#64748b" text-anchor="middle">绿：数据先推给所有副本</text>
  <text x="620" y="181" font-size="12" fill="#64748b" text-anchor="middle">橙：写请求与定序</text>
  <text x="620" y="199" font-size="12" fill="#64748b" text-anchor="middle">先推数据后发请求，主副本不占带宽</text>
</svg>
