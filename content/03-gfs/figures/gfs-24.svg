<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 334" width="766" height="334"
     role="img" aria-labelledby="fig-gfs-24-title fig-gfs-24-desc">
  <title id="fig-gfs-24-title">多个客户端的修改，怎么被排成同一个顺序</title>
  <desc id="fig-gfs-24-desc">客户端 A 与 B 的写请求可能同时到达，主副本按到达顺序分配连续序号完成串行化，次副本按同一顺序应用，顺序一致但内容仍可能逐字节不同。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="334" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">多个客户端的修改，怎么被排成同一个顺序</text>

  <path d="M195,123 L195,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M568,123 L568,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M195,204 L195,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M568,204 L568,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="341" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="86" font-size="12" fill="#1e40af" text-anchor="middle">客户端 A 的写请求</text>
  <text x="195" y="104" font-size="12" fill="#1e40af" text-anchor="middle">数据已经先推送到位</text>

  <rect x="396" y="64" width="345" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="568" y="86" font-size="12" fill="#1e40af" text-anchor="middle">客户端 B 的写请求</text>
  <text x="568" y="104" font-size="12" fill="#1e40af" text-anchor="middle">可能和 A 同时到达</text>

  <rect x="25" y="145" width="716" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="383" y="167" font-size="12" fill="#b45309" text-anchor="middle">主副本按到达顺序给它们分配连续序号</text>
  <text x="383" y="185" font-size="12" fill="#b45309" text-anchor="middle">这一步把并发的修改串行化</text>

  <rect x="25" y="226" width="341" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195" y="248" font-size="12" fill="#166534" text-anchor="middle">次副本 A 按同一顺序应用</text>
  <text x="195" y="266" font-size="12" fill="#166534" text-anchor="middle">不自己决定顺序</text>

  <rect x="396" y="226" width="345" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="568" y="248" font-size="12" fill="#166534" text-anchor="middle">次副本 B 按同一顺序应用</text>
  <text x="568" y="266" font-size="12" fill="#166534" text-anchor="middle">顺序一致，内容仍可能不同</text>

  <text x="383" y="306" font-size="12" fill="#64748b" text-anchor="middle">全局顺序 = 主节点授予租约的先后 + 主副本在租约内分配的序号</text>
</svg>
