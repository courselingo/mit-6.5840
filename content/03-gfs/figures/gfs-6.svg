<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-gfs-6-title fig-gfs-6-desc">
  <title id="fig-gfs-6-title">三类元数据的去处各不相同，读只在第一次经过主节点</title>
  <desc id="fig-gfs-6-desc">命名空间与文件到块的映射会持久化：写进操作日志并配周期性检查点；块副本的位置刻意不持久化，主节点启动或块服务器加入时直接问它。读路径只在第一次经过主节点，客户端缓存这份映射，之后直接与块服务器通信，过期或重新打开文件才再问一次。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三类元数据的去处各不相同，读只在第一次经过主节点</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">存什么与不存什么，判断依据是「块服务器自己最清楚」</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">读路径只在第一次经过主节点</text>

  <rect x="38" y="82" width="328" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="202" y="110" font-size="15" fill="#1e40af" text-anchor="middle">命名空间与文件到块的映射</text>
  <text x="202" y="132" font-size="12" fill="#1e40af" text-anchor="middle">写进操作日志，并配周期性检查点</text>

  <rect x="394" y="82" width="328" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="558" y="110" font-size="15" fill="#6b21a8" text-anchor="middle">块副本的位置</text>
  <text x="558" y="132" font-size="12" fill="#6b21a8" text-anchor="middle">不持久化，启动时逐个问块服务器</text>

  <rect x="38" y="216" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="142" y="244" font-size="15" fill="#1e40af" text-anchor="middle">第一次读</text>
  <text x="142" y="266" font-size="12" fill="#1e40af" text-anchor="middle">问主节点，并把映射缓存下来</text>

  <rect x="275" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="244" font-size="15" fill="#b45309" text-anchor="middle">之后再读同一个块</text>
  <text x="379" y="266" font-size="12" fill="#b45309" text-anchor="middle">不必打扰主节点，直接找块服务器</text>

  <rect x="512" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="616" y="244" font-size="15" fill="#b45309" text-anchor="middle">缓存过期或重新打开</text>
  <text x="616" y="266" font-size="12" fill="#b45309" text-anchor="middle">才再问一次，还顺带问后面几块</text>
</svg>
