<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 334" width="766" height="334"
     role="img" aria-labelledby="fig-gfs-6-title fig-gfs-6-desc">
  <title id="fig-gfs-6-title">主节点的三类元数据：谁落盘，谁靠问出来</title>
  <desc id="fig-gfs-6-desc">命名空间与文件到块的映射会持久化到操作日志并配周期检查点；块副本的位置刻意不持久化，主节点启动时直接问块服务器。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="766" height="334" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">主节点的三类元数据：谁落盘，谁靠问出来</text>

  <rect x="25" y="64" width="341" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="86" font-size="12" fill="#1e40af" text-anchor="middle">命名空间 + 文件到块的映射</text>
  <text x="195" y="104" font-size="12" fill="#1e40af" text-anchor="middle">这两类会持久化</text>

  <rect x="25" y="145" width="341" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="167" font-size="12" fill="#1e40af" text-anchor="middle">写进本地操作日志</text>
  <text x="195" y="185" font-size="12" fill="#1e40af" text-anchor="middle">本质就是一份预写日志</text>

  <rect x="25" y="226" width="341" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="248" font-size="12" fill="#1e40af" text-anchor="middle">改动可见前先刷到本地与远程盘</text>
  <text x="195" y="266" font-size="12" fill="#1e40af" text-anchor="middle">再用周期检查点压小日志</text>

  <rect x="396" y="64" width="345" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="568" y="86" font-size="12" fill="#9d174d" text-anchor="middle">块副本当前的位置</text>
  <text x="568" y="104" font-size="12" fill="#9d174d" text-anchor="middle">刻意不持久化</text>

  <rect x="396" y="145" width="345" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="568" y="167" font-size="12" fill="#9d174d" text-anchor="middle">启动时逐个问块服务器</text>
  <text x="568" y="185" font-size="12" fill="#9d174d" text-anchor="middle">你都存了哪些块</text>

  <rect x="396" y="226" width="345" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="568" y="248" font-size="12" fill="#9d174d" text-anchor="middle">位置只是一份缓存视图</text>
  <text x="568" y="266" font-size="12" fill="#9d174d" text-anchor="middle">块服务器自己最清楚</text>

  <text x="383" y="306" font-size="12" fill="#64748b" text-anchor="middle">放弃一份随时能重建的映射，换来元数据小到能全放进内存</text>
</svg>
