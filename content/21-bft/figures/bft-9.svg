<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" width="760" height="282"
     role="img" aria-labelledby="fig-bft-9-title fig-bft-9-desc">
  <title id="fig-bft-9-title">本页的记号：f 是数量，F 是那台坏服务器，v 与 n 各是什么</title>
  <desc id="fig-bft-9-desc">上面一条说明这张图讲的是本页的记号。第二排三格分别是：f 只用作数量，表示允许坏掉的台数；F 表示举例里那台具体的坏服务器，与 f 分开以免混淆；v 是视图号，表示现在是第几任主。最下面一条补上 n：它是操作编号，与视图号 v 不是一回事。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="282" fill="#ffffff"/>

  <text x="380" y="36" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">本页的记号：f 是数量，F 是那台坏服务器，v 与 n 各是什么</text>
  <rect x="25" y="72" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="92.35" font-size="11" fill="#1e40af" text-anchor="middle">本页的记号：f 是数量，F 是那台坏服务器，v 与 n 各是什么</text>
  <rect x="25" y="133" width="220" height="66" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="153.35" font-size="11" fill="#1e40af" text-anchor="middle">f</text>
  <text x="135" y="169.85" font-size="11" fill="#1e40af" text-anchor="middle">只用作数量</text>
  <text x="135" y="186.35" font-size="11" fill="#1e40af" text-anchor="middle">允许坏掉的台数</text>
  <rect x="270" y="133" width="220" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="153.35" font-size="11" fill="#b45309" text-anchor="middle">F</text>
  <text x="380" y="169.85" font-size="11" fill="#b45309" text-anchor="middle">举例里那台具体的坏服务器</text>
  <text x="380" y="186.35" font-size="11" fill="#b45309" text-anchor="middle">与 f 分开以免混淆</text>
  <rect x="515" y="133" width="220" height="66" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="153.35" font-size="11" fill="#166534" text-anchor="middle">v</text>
  <text x="625" y="169.85" font-size="11" fill="#166534" text-anchor="middle">视图号</text>
  <text x="625" y="186.35" font-size="11" fill="#166534" text-anchor="middle">现在是第几任主</text>
  <rect x="25" y="227" width="710" height="30" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="245.5" font-size="10" fill="#6b21a8" text-anchor="middle">n 是操作编号，表示这是第几个操作；它与视图号 v 不是一回事</text>
</svg>
