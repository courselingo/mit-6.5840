<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 279" width="760" height="279"
     role="img" aria-labelledby="fig-raft-1-title fig-raft-1-desc">
  <title id="fig-raft-1-title">复制的适用边界与副本数量的取舍</title>
  <desc id="fig-raft-1-desc">复制擅长对付单台副本的停止型失效，例如风扇停转、过热关机、被拔掉线或磁盘满；它对付不了缺陷与人为误操作（往往不是停止型，还可能相关），以及地震这类大范围失效（除非副本地理分开）。副本数量上是取舍：3 到 5 个最常见，2 个只能容忍同时坏一台。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="279" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">复制的适用边界与副本数量的取舍</text>
  <rect x="22" y="58" width="344" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="80" font-size="12" fill="#9d174d" text-anchor="middle">停止型失效：机器停下不动</text>
  <rect x="394" y="58" width="344" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="80" font-size="12" fill="#9d174d" text-anchor="middle">缺陷与误操作：不是停止型，还可能相关</text>
  <rect x="22" y="120" width="344" height="36.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="194" y="142" font-size="12" fill="#b45309" text-anchor="middle">大范围失效：副本地理分开才管用</text>
  <rect x="394" y="120" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="142" font-size="12" fill="#1e40af" text-anchor="middle">副本数量：3 到 5 个最常见</text>
  <rect x="22" y="182" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="204" font-size="12" fill="#1e40af" text-anchor="middle">只有 2 个副本：只能容忍同时坏一台</text>
  <rect x="394" y="182" width="344" height="36.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="204" font-size="12" fill="#b45309" text-anchor="middle">太多太贵，太少撑不过边修边坏</text>
  <text x="380" y="254" font-size="11" fill="#64748b" text-anchor="middle">复制能救的是机器停下，救不了机器算错与整片区域出事</text>
</svg>
