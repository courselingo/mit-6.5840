<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 403" width="760" height="403"
     role="img" aria-labelledby="fig-raft-12-title fig-raft-12-desc">
  <title id="fig-raft-12-title">论文导读与本页的分工</title>
  <desc id="fig-raft-12-desc">论文导读负责论文本身的深水区：选举限制、提交条件、任期提交规则、成员变更的联合共识以及论文的主张与代价；本页负责课堂笔记那条线：复制状态机的条件与边界、Raft 的实验室形态与日志的用处、任期与选举的全流程。两页只在一处展开同一件事，另一处只负责指路。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="403" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">论文导读与本页的分工</text>
  <rect x="22" y="58" width="344" height="36.0" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="80" font-size="12" fill="#6b21a8" text-anchor="middle">论文导读负责：候选者日志「至少和新的一样新」</text>
  <rect x="394" y="58" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="80" font-size="12" fill="#1e40af" text-anchor="middle">本页负责：复制状态机的条件与边界</text>
  <rect x="22" y="120" width="344" height="36.0" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="142" font-size="12" fill="#6b21a8" text-anchor="middle">论文导读负责：条目算提交的条件、任期提交规则</text>
  <rect x="394" y="120" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="142" font-size="12" fill="#1e40af" text-anchor="middle">本页负责：Raft 的实验室形态与日志的用处</text>
  <rect x="22" y="182" width="344" height="36.0" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="204" font-size="12" fill="#6b21a8" text-anchor="middle">论文导读负责：成员变更为什么需要联合共识</text>
  <rect x="394" y="182" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="204" font-size="12" fill="#1e40af" text-anchor="middle">本页负责：任期、选举触发与至多一个领导者</text>
  <rect x="22" y="244" width="344" height="36.0" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="266" font-size="12" fill="#6b21a8" text-anchor="middle">论文导读负责：论文的主张与代价</text>
  <rect x="394" y="244" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="266" font-size="12" fill="#1e40af" text-anchor="middle">本页负责：心跳、分裂投票、随机化与超时取舍</text>
  <rect x="22" y="306" width="344" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="328" font-size="12" fill="#166534" text-anchor="middle">交接处：两页只在一处展开，另一处只指路</text>
  <rect x="394" y="306" width="344" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="328" font-size="12" fill="#166534" text-anchor="middle">日志分叉的处理与那条选举限制都指向下一讲</text>
  <text x="380" y="378" font-size="11" fill="#64748b" text-anchor="middle">同一件事只在一处展开，另一处负责把你送过去</text>
</svg>
