<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 403" width="760" height="403"
     role="img" aria-labelledby="fig-raft-9-title fig-raft-9-desc">
  <title id="fig-raft-9-title">分裂投票为什么必然发生以及随机化如何打破对称</title>
  <desc id="fig-raft-9-desc">不做处理时所有选举定时器几乎同时到期，每个候选人都投给自己，于是人人恰好一票、没有人过半，选举经常失败。解法是给选举超时加随机量来打破对称：总有一台延迟最短，它拉够票之后其他人看到心跳就不再参选。超时要至少几个心跳间隔、够短以便快速响应并能重试，随机部分要够长到让一位候选人成功。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="403" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">分裂投票为什么必然发生以及随机化如何打破对称</text>
  <rect x="22" y="58" width="344" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="80" font-size="12" fill="#9d174d" text-anchor="middle">不做处理：所有选举定时器几乎同时到期</text>
  <rect x="394" y="58" width="344" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="80" font-size="12" fill="#9d174d" text-anchor="middle">每个候选人都投给自己，人人恰好一票</text>
  <rect x="22" y="120" width="344" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="142" font-size="12" fill="#9d174d" text-anchor="middle">结果：没有人过半，选举经常失败</text>
  <rect x="394" y="120" width="344" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="142" font-size="12" fill="#166534" text-anchor="middle">解法：给选举超时加一段随机量</text>
  <rect x="22" y="182" width="344" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="204" font-size="12" fill="#166534" text-anchor="middle">随机量打破对称：总有一台延迟最短</text>
  <rect x="394" y="182" width="344" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="204" font-size="12" fill="#166534" text-anchor="middle">它拉够票，其他人看到心跳就不再参选</text>
  <rect x="22" y="244" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="266" font-size="12" fill="#1e40af" text-anchor="middle">超时至少要是几个心跳间隔</text>
  <rect x="394" y="244" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="266" font-size="12" fill="#1e40af" text-anchor="middle">还要够短：快速响应失效，且 5 秒内完成选举</text>
  <rect x="22" y="306" width="344" height="36.0" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="328" font-size="12" fill="#6b21a8" text-anchor="middle">随机部分要够长：让一位候选人在下一个开始前成功</text>
  <rect x="394" y="306" width="344" height="36.0" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="566" y="328" font-size="12" fill="#6b21a8" text-anchor="middle">随机化延迟是网络协议里常见的手法</text>
  <text x="380" y="378" font-size="11" fill="#64748b" text-anchor="middle">这里靠的不是更严格的规则，而是主动引入随机</text>
</svg>
