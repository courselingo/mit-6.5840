<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 210" width="574" height="210"
     role="img" aria-labelledby="fig-bitcoin-8-title fig-bitcoin-8-desc">
  <title id="fig-bitcoin-8-title">等待的块数取决于商品的价值</title>
  <desc id="fig-bitcoin-8-desc">贵重物品要等到交易后面跟了好几个块再发货；便宜物品只等一部分节点看到并验证过就可以。确认的把握是用等待换来的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="574" height="210" fill="#ffffff"/>

  <text x="287" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">等待的块数取决于商品的价值</text>

  <rect x="23" y="64" width="250" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="148" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">贵重物品</text>
  <text x="148" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">等交易后面跟好几个块</text>

  <rect x="301" y="64" width="250" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="426" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">便宜物品</text>
  <text x="426" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">只等节点验证过即可</text>

  <path d="M148,123 L148,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M426,123 L426,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="146" width="528" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="287" y="171.2" font-size="12" fill="#166534" text-anchor="middle">确认的把握是用等待换来的</text>
</svg>
