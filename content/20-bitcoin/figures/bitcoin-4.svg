<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 198" width="612" height="198"
     role="img" aria-labelledby="fig-bitcoin-4-title fig-bitcoin-4-desc">
  <title id="fig-bitcoin-4-title">对等网络：完整副本加泛洪，任何人不经许可就能加入</title>
  <desc id="fig-bitcoin-4-desc">每个节点保存整条链的完整副本、只与少数邻居建 TCP 连接；新块与交易都靠转发泛洪；任何人都可以加入，因此设计假设诚实者远多于作恶者。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="612" height="198" fill="#ffffff"/>

  <text x="306" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">完整副本加泛洪，任何人不经许可就能加入</text>

  <rect x="23" y="64" width="566" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="306" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">每个节点：整条链的完整副本，只与少数邻居建 TCP 连接</text>

  <path d="M306,111 L306,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="170" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="108" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">新块靠转发泛洪</text>

  <rect x="221" y="134" width="170" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="306" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">交易也靠泛洪扩散</text>

  <rect x="419" y="134" width="170" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="504" y="159.2" font-size="12" fill="#9d174d" text-anchor="middle">任何人可加入，必有坏人</text>
</svg>
