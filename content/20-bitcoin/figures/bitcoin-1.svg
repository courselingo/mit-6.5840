<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 222" width="566" height="222"
     role="img" aria-labelledby="fig-bitcoin-1-title fig-bitcoin-1-desc">
  <title id="fig-bitcoin-1-title">骨架相同，区别在分叉怎么办</title>
  <desc id="fig-bitcoin-1-desc">上一讲的稻草人与比特币都是带签名的操作日志加密码学哈希链接，区别是前者靠版本向量发现分叉、后者靠算力压平分叉。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="566" height="222" fill="#ffffff"/>

  <text x="283" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">骨架相同，区别在分叉怎么办</text>

  <rect x="23" y="64" width="520" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="283" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">上一讲的稻草人</text>
  <text x="283" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">签名日志加哈希链接，用版本向量发现分叉</text>

  <rect x="23" y="146" width="520" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="283" y="168.2" font-size="12" fill="#166534" text-anchor="middle">这一讲的比特币</text>
  <text x="283" y="186.2" font-size="12" fill="#166534" text-anchor="middle">同样的骨架，用算力把分叉自动压平</text>
</svg>
