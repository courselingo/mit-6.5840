<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 222" width="566" height="222"
     role="img" aria-labelledby="fig-bitcoin-9-title fig-bitcoin-9-desc">
  <title id="fig-bitcoin-9-title">51% 攻击：算力比例就是安全边界</title>
  <desc id="fig-bitcoin-9-desc">攻击者要改变历史，必须先造出比主链更长的分叉；只有当他的算力超过所有诚实节点的总和，他才可能追上，从而让所有人切到他的链上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="566" height="222" fill="#ffffff"/>

  <text x="283" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">51% 攻击：算力比例就是安全边界</text>

  <rect x="23" y="64" width="520" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="283" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">想改变历史，先要造出比主链更长的分叉</text>
  <text x="283" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">只有算力超过所有诚实节点之和时才追得上</text>

  <path d="M283,123 L283,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="146" width="520" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="283" y="168.2" font-size="12" fill="#9d174d" text-anchor="middle">越过这条线，最长链的归属就换了主人</text>
  <text x="283" y="186.2" font-size="12" fill="#9d174d" text-anchor="middle">于是他能把自己的交易撤掉，双重支付成功</text>
</svg>
