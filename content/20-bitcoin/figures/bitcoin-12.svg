<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260"
     role="img" aria-labelledby="fig-btc-12-title fig-btc-12-desc">
  <title id="fig-btc-12-title">两种「多数」不能混用</title>
  <desc id="fig-btc-12-desc">上排两条等宽方框分别是按节点个数算的多数与按算力算的多数，两条直线箭头汇入一条通栏方框：诚实节点很多，而安全边界按算力算，超过所有诚实节点的算力总和才构成 51% 攻击；底部方框说明节点多并不等于算力多。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="260" fill="#ffffff"/>

  <text x="380" y="32" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种「多数」不能混用</text>
  <rect x="22" y="60" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">按节点个数算的多数</text>
  <rect x="394" y="60" width="344" height="36.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="82.2" font-size="12" fill="#b45309" text-anchor="middle">按算力算的多数</text>
  <rect x="22" y="121.0" width="716" height="54.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="143.2" font-size="12" fill="#166534" text-anchor="middle">诚实节点很多，一台机器可以跑很多个节点</text>
  <text x="380" y="161.2" font-size="12" fill="#166534" text-anchor="middle">而安全边界按算力算：超过所有诚实节点的算力总和才有 51% 攻击</text>
  <path d="M194,101.0 L194,110.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,101.0 L566,110.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="22" y="200.0" width="716" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="222.2" font-size="12" fill="#9d174d" text-anchor="middle">节点多并不等于算力多，这两句话不能互相替代</text>
</svg>
