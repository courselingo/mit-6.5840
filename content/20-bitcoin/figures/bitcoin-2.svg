<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 210" width="612" height="210"
     role="img" aria-labelledby="fig-bitcoin-2-title fig-bitcoin-2-desc">
  <title id="fig-bitcoin-2-title">双重支付：两笔交易各自合法，合起来是欺骗</title>
  <desc id="fig-bitcoin-2-desc">Y 用同一枚币造出两笔交易，都指向同一个前序哈希、签名都有效，分别给 Z 和 Q 看，两边各自验证都通过。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="612" height="210" fill="#ffffff"/>

  <text x="306" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">双重支付：两笔交易各自合法，合起来是欺骗</text>

  <rect x="23" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="108" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">Y 造两笔交易</text>
  <text x="108" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">一笔付给 Z，一笔给 Q</text>

  <rect x="221" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="306" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">都指向同一前序</text>
  <text x="306" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">哈希与签名都正确</text>

  <rect x="419" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="504" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">分头给两个人看</text>
  <text x="504" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">彼此不知道对方那笔</text>

  <path d="M306,123 L306,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="146" width="566" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="306" y="171.2" font-size="12" fill="#9d174d" text-anchor="middle">结果：两边各自验证都通过，于是两份三明治都给了出去</text>
</svg>
