<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242"
     role="img" aria-labelledby="fig-btc-13-title fig-btc-13-desc">
  <title id="fig-btc-13-title">块的哈希算的是整块内容</title>
  <desc id="fig-btc-13-desc">上排五条等宽方框是前块哈希、奖励交易、交易列表、随机数、时间戳，五条直线箭头汇入一条通栏方框说明它们合起来算出块的哈希、其中只有随机数能随手改；再向下指向一条方框：哈希必须有 N 个前导零，否则这个块不算数。随机数用粉色标出。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="242" fill="#ffffff"/>

  <text x="380" y="32" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">块的哈希算的是整块内容</text>
  <rect x="22" y="60" width="123" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="83.5" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">前块哈希</text>
  <rect x="170" y="60" width="123" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="231.5" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">奖励交易</text>
  <rect x="318" y="60" width="123" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="379.5" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">交易列表</text>
  <rect x="466" y="60" width="123" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="527.5" y="82.2" font-size="12" fill="#9d174d" text-anchor="middle">随机数</text>
  <rect x="614" y="60" width="123" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="675.5" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">时间戳</text>
  <rect x="22" y="121.0" width="716" height="36.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="143.2" font-size="12" fill="#b45309" text-anchor="middle">这五样字段合起来算出块的哈希，其中只有随机数能随手改</text>
  <path d="M83,101.0 L83,110.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M231,101.0 L231,110.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M379,101.0 L379,110.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M527,101.0 L527,110.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M675,101.0 L675,110.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="22" y="182.0" width="716" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="204.2" font-size="12" fill="#166534" text-anchor="middle">哈希必须有 N 个前导零，否则这个块不算数</text>
  <path d="M380,162.0 L380,171.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
