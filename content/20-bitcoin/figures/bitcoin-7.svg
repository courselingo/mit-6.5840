<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 198" width="574" height="198"
     role="img" aria-labelledby="fig-bitcoin-7-title fig-bitcoin-7-desc">
  <title id="fig-bitcoin-7-title">临时分叉与节点的选择规则</title>
  <desc id="fig-bitcoin-7-desc">两个块几乎同时产生或网络太慢会让链临时分叉；节点的做法是先在自己先听到的那一支上继续挖，一旦听说更长的链就切过去。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="574" height="198" fill="#ffffff"/>

  <text x="287" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">临时分叉与节点的选择规则</text>

  <rect x="23" y="64" width="528" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="287" y="89.2" font-size="12" fill="#9d174d" text-anchor="middle">两种情形：几乎同时出块，或者网络太慢</text>

  <path d="M148,111 L148,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="250" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="148" y="159.2" font-size="12" fill="#1e40af" text-anchor="middle">先在先听到的那一支上挖</text>

  <rect x="301" y="134" width="250" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="426" y="159.2" font-size="12" fill="#166534" text-anchor="middle">见到更长的链就切过去</text>
</svg>
