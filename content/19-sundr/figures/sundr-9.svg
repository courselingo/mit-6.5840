<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 626 210" width="626" height="210"
     role="img" aria-labelledby="fig-sundr-9-title fig-sundr-9-desc">
  <title id="fig-sundr-9-title">序列化 SUNDR：每个用户一棵哈希树，handle 里带版本号与版本向量</title>
  <desc id="fig-sundr-9-desc">文件系统是各用户树的并集，每棵树有一个带签名的 handle，里面装着根哈希、自己的版本号、以及上次读到的其他每个用户的版本。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="626" height="210" fill="#ffffff"/>

  <text x="313" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">每个用户一棵树，handle 里带版本信息</text>

  <rect x="23" y="64" width="580" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="313" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">handle 里装着四样东西（并列）</text>


  <rect x="23" y="134" width="124" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="85" y="156.2" font-size="12" fill="#b45309" text-anchor="middle">根哈希</text>
  <text x="85" y="174.2" font-size="12" fill="#b45309" text-anchor="middle">指向整棵树</text>

  <rect x="175" y="134" width="124" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="237" y="156.2" font-size="12" fill="#b45309" text-anchor="middle">自己的版本号</text>
  <text x="237" y="174.2" font-size="12" fill="#b45309" text-anchor="middle">第几个版本</text>

  <rect x="327" y="134" width="124" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="389" y="156.2" font-size="12" fill="#6b21a8" text-anchor="middle">版本向量</text>
  <text x="389" y="174.2" font-size="12" fill="#6b21a8" text-anchor="middle">看到过谁的哪一版</text>

  <rect x="479" y="134" width="124" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="541" y="156.2" font-size="12" fill="#166534" text-anchor="middle">块签名</text>
  <text x="541" y="174.2" font-size="12" fill="#166534" text-anchor="middle">只签这个块</text>
</svg>
