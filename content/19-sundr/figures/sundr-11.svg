<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 642 140" width="642" height="140"
     role="img" aria-labelledby="fig-sundr-11-title fig-sundr-11-desc">
  <title id="fig-sundr-11-title">三件可复用的工具</title>
  <desc id="fig-sundr-11-desc">哈希树回答数据有没有被改，整体签名回答这些改动的顺序对不对，版本向量回答谁看到过谁的哪一版。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="642" height="140" fill="#ffffff"/>

  <text x="321" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三件可复用的工具</text>

  <rect x="23" y="64" width="180" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="113" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">哈希树</text>
  <text x="113" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">数据有没有被改</text>

  <rect x="231" y="64" width="180" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="321" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">整体签名</text>
  <text x="321" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">改动的顺序对不对</text>

  <rect x="439" y="64" width="180" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="529" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">版本向量</text>
  <text x="529" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">谁看到过谁的哪一版</text>
</svg>
