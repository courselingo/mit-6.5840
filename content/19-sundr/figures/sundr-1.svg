<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 408" width="566" height="408"
     role="img" aria-labelledby="fig-sundr-1-title fig-sundr-1-desc">
  <title id="fig-sundr-1-title">把数据交给别人保管：哪些环节不受我们控制</title>
  <desc id="fig-sundr-1-desc">使用者要能验证取回的数据，而服务器那一侧有四类不受他控制的来源：软硬件缺陷、管理员密码被猜、员工失职、以及被改过而未被察觉的软件。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="566" height="408" fill="#ffffff"/>

  <text x="283" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">哪些环节不受我们控制</text>

  <rect x="23" y="64" width="520" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="283" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">使用者：要能验证取回的数据（以下四条并列）</text>


  <rect x="23" y="134" width="520" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="283" y="159.2" font-size="12" fill="#9d174d" text-anchor="middle">服务器软件或硬件有缺陷，可能被利用</text>

  <rect x="23" y="204" width="520" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="283" y="229.2" font-size="12" fill="#9d174d" text-anchor="middle">管理员密码被猜到，软件被改掉</text>

  <rect x="23" y="274" width="520" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="283" y="299.2" font-size="12" fill="#9d174d" text-anchor="middle">服务商的员工失职，或者本身就是坏的</text>

  <rect x="23" y="344" width="520" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="283" y="369.2" font-size="12" fill="#9d174d" text-anchor="middle">攻击者改完源码，可能不被察觉</text>
</svg>
