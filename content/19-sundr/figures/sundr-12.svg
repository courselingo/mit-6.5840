<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 338" width="486" height="338"
     role="img" aria-labelledby="fig-sundr-12-title fig-sundr-12-desc">
  <title id="fig-sundr-12-title">三层叠起来，才是一份可验证的存储</title>
  <desc id="fig-sundr-12-desc">哈希负责命名与校验，签名负责归属与顺序，版本向量负责比较与发现分叉，三层合起来才能在不可信的服务器上给出可验证的存储。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="486" height="338" fill="#ffffff"/>

  <text x="243" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三层叠起来，才是一份可验证的存储</text>

  <rect x="23" y="64" width="440" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="243" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">命名与校验：哈希</text>

  <path d="M243,111 L243,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="440" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="243" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">归属与顺序：签名</text>

  <path d="M243,181 L243,193" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="204" width="440" height="42" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="243" y="229.2" font-size="12" fill="#6b21a8" text-anchor="middle">比较与发现：版本向量</text>

  <path d="M243,251 L243,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="274" width="440" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="243" y="299.2" font-size="12" fill="#166534" text-anchor="middle">结果：不可信服务器上的可验证存储</text>
</svg>
