<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 268" width="574" height="268"
     role="img" aria-labelledby="fig-sundr-13-title fig-sundr-13-desc">
  <title id="fig-sundr-13-title">哈希树：签根哈希等于签整棵树</title>
  <desc id="fig-sundr-13-desc">根哈希由左右两棵子树的哈希算出，而子哈希存放在父节点里，所以只要签了根哈希，整棵树的内容就都被覆盖了；任何一处改动都会让根哈希变掉。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="574" height="268" fill="#ffffff"/>

  <text x="287" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">哈希树：签根哈希等于签整棵树</text>

  <rect x="23" y="64" width="528" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="287" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">根哈希 = 哈希（左子哈希 拼上 右子哈希）</text>

  <path d="M148,111 L148,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M426,111 L426,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="250" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="148" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">左子树全部内容的哈希</text>

  <rect x="301" y="134" width="250" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="426" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">右子树全部内容的哈希</text>

  <rect x="23" y="204" width="528" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="287" y="229.2" font-size="12" fill="#166534" text-anchor="middle">子哈希存放在父节点里，所以根哈希一签，整棵树都被覆盖</text>
</svg>
