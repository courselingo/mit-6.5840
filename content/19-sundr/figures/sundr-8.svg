<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 222" width="566" height="222"
     role="img" aria-labelledby="fig-sundr-8-title fig-sundr-8-desc">
  <title id="fig-sundr-8-title">分叉一致性：能藏、能永久分叉，但合不回去</title>
  <desc id="fig-sundr-8-desc">服务器能做到的是藏起更新并永久把用户分叉开；它做不到的是把一个已经产生的分叉愈合，因为任何揭示动作都会让版本序列出现矛盾。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="566" height="222" fill="#ffffff"/>

  <text x="283" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">能藏、能永久分叉，但合不回去</text>

  <rect x="23" y="64" width="520" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="283" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">服务器能做到的</text>
  <text x="283" y="104.2" font-size="12" fill="#9d174d" text-anchor="middle">藏起更新，让两个用户永久看到不同的世界</text>

  <rect x="23" y="146" width="520" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="283" y="168.2" font-size="12" fill="#166534" text-anchor="middle">服务器做不到的</text>
  <text x="283" y="186.2" font-size="12" fill="#166534" text-anchor="middle">把已经裂开的两半重新接上</text>
</svg>
