<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 222" width="612" height="222"
     role="img" aria-labelledby="fig-sundr-5-title fig-sundr-5-desc">
  <title id="fig-sundr-5-title">单条数据都验签通过，整体却可以矛盾</title>
  <desc id="fig-sundr-5-desc">X 提交代码第一版、A 修掉 bug、B 公告已修；C 先读公告再读代码时，服务器可以给 C 新的公告配旧的代码，两份签名都正确，结论却是错的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="612" height="222" fill="#ffffff"/>

  <text x="306" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">单条数据都验签通过，整体却可以矛盾</text>

  <rect x="23" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="108" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">X 提交代码 v1</text>
  <text x="108" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">（起始版本）</text>

  <rect x="221" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="306" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">A 提交 v2</text>
  <text x="306" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">修掉一个 bug</text>

  <rect x="419" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="504" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">B 更新公告</text>
  <text x="504" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">宣布 bug 已修</text>

  <path d="M157,123 L157,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="146" width="269" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="157" y="168.2" font-size="12" fill="#166534" text-anchor="middle">C 读公告</text>
  <text x="157" y="186.2" font-size="12" fill="#166534" text-anchor="middle">拿到新的那一份</text>

  <rect x="320" y="146" width="269" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="454" y="168.2" font-size="12" fill="#9d174d" text-anchor="middle">C 读代码</text>
  <text x="454" y="186.2" font-size="12" fill="#9d174d" text-anchor="middle">拿到旧的 v1，签名也对</text>
</svg>
