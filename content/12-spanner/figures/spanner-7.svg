<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 217" width="760" height="217"
     role="img" aria-labelledby="fig-spanner-7-title fig-spanner-7-desc">
  <title id="fig-spanner-7-title">副本用见过的更晚写来判断自己收齐了</title>
  <desc id="fig-spanner-7-desc">副本在服务一个时间戳 20 的读之前，先检查自己是否已经见过时间戳大于 20 的写：见过说明小于 20 的写都已到齐，可以正常回答；没见过就说明可能还有写在路上，于是推迟回答。另外，如果本机存在已 prepare 但尚未提交的读/写事务，也要推迟。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="217" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">副本用见过的更晚写来判断自己收齐了</text>
  <rect x="22" y="58" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="80" font-size="12" fill="#1e40af" text-anchor="middle">副本收到一个时间戳 20 的读</text>
  <rect x="394" y="58" width="344" height="36.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="80" font-size="12" fill="#b45309" text-anchor="middle">先看自己是否见过时间戳大于 20 的写</text>
  <rect x="22" y="120" width="344" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="142" font-size="12" fill="#166534" text-anchor="middle">见过：说明小于 20 的写都已到齐，正常回答</text>
  <rect x="394" y="120" width="344" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="142" font-size="12" fill="#9d174d" text-anchor="middle">没见过：可能还有写在路上，推迟回答等它到齐</text>
  <text x="380" y="192" font-size="11" fill="#64748b" text-anchor="middle">本机若有已 prepare 但尚未提交的读/写事务，也要推迟回答</text>
</svg>
