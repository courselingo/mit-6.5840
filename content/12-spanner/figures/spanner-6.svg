<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 217" width="760" height="217"
     role="img" aria-labelledby="fig-spanner-6-title fig-spanner-6-desc">
  <title id="fig-spanner-6-title">多版本按时间戳排开，T3 在 15 处读</title>
  <desc id="fig-spanner-6-desc">x 与 y 各有两个版本，分别带时间戳 10 与 20；T3 的时间戳是 15，所以它的两次读都取时间戳 10 那一层的版本，读到 x=9 与 y=11，而不是更新的那一层。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="217" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">多版本按时间戳排开，T3 在 15 处读</text>
  <rect x="22" y="58" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="80" font-size="12" fill="#1e40af" text-anchor="middle">x@10 = 9</text>
  <rect x="394" y="58" width="344" height="36.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="80" font-size="12" fill="#b45309" text-anchor="middle">x@20 = 8</text>
  <rect x="22" y="120" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="142" font-size="12" fill="#1e40af" text-anchor="middle">y@10 = 11</text>
  <rect x="394" y="120" width="344" height="36.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="142" font-size="12" fill="#b45309" text-anchor="middle">y@20 = 12</text>
  <text x="380" y="192" font-size="11" fill="#64748b" text-anchor="middle">T3 的时间戳是 15，于是它的两次读都取时间戳 10 那一层的版本</text>
</svg>
