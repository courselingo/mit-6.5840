<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270"
     role="img" aria-labelledby="fig-spanner-2-title fig-spanner-2-desc">
  <title id="fig-spanner-2-title">同一份数据的分片副本横跨三个数据中心</title>
  <desc id="fig-spanner-2-desc">三个数据中心各有本地客户端，也各存着 a-m 与 n-z 两个分片的副本；同一个分片的副本组成一个 Paxos 组（领导者放在数据中心 A），客户端就近读自己这里的副本。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="270" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一份数据的分片副本横跨三个数据中心</text>
  <rect x="22" y="58" width="220" height="33.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="132" y="78" font-size="11" fill="#166534" text-anchor="middle">数据中心 A：分片 a-m 副本</text>
  <rect x="270" y="58" width="220" height="33.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="78" font-size="11" fill="#1e40af" text-anchor="middle">数据中心 A：分片 n-z 副本</text>
  <rect x="518" y="58" width="220" height="33.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="628" y="78" font-size="11" fill="#b45309" text-anchor="middle">数据中心 A：本地客户端</text>
  <rect x="22" y="117" width="220" height="33.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="132" y="137" font-size="11" fill="#166534" text-anchor="middle">数据中心 B：分片 a-m 副本</text>
  <rect x="270" y="117" width="220" height="33.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="137" font-size="11" fill="#1e40af" text-anchor="middle">数据中心 B：分片 n-z 副本</text>
  <rect x="518" y="117" width="220" height="33.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="628" y="137" font-size="11" fill="#b45309" text-anchor="middle">数据中心 B：本地客户端</text>
  <rect x="22" y="176" width="220" height="33.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="132" y="196" font-size="11" fill="#166534" text-anchor="middle">数据中心 C：分片 a-m 副本</text>
  <rect x="270" y="176" width="220" height="33.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="196" font-size="11" fill="#1e40af" text-anchor="middle">数据中心 C：分片 n-z 副本</text>
  <rect x="518" y="176" width="220" height="33.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="628" y="196" font-size="11" fill="#b45309" text-anchor="middle">数据中心 C：本地客户端</text>
  <text x="380" y="245" font-size="11" fill="#64748b" text-anchor="middle">同一个分片的副本组成一个 Paxos 组，领导者放在数据中心 A；客户端就近读本地副本</text>
</svg>
