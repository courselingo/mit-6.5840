<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 279" width="760" height="279"
     role="img" aria-labelledby="fig-spanner-5-title fig-spanner-5-desc">
  <title id="fig-spanner-5-title">三事务的交错与 T3 的两次读</title>
  <desc id="fig-spanner-5-desc">T1 与 T2 各写一次 x 与 y 后提交，T3 的两次读落在 T1 之后、T2 之中。要求 T3 要么看到 T2 的两笔写、要么两笔都看不到，而且两次读必须来自同一个时间点。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="279" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三事务的交错与 T3 的两次读</text>
  <rect x="22" y="58" width="220" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="132" y="80" font-size="12" fill="#9d174d" text-anchor="middle">T1：写 x</text>
  <rect x="270" y="58" width="220" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="80" font-size="12" fill="#9d174d" text-anchor="middle">T1：写 y</text>
  <rect x="518" y="58" width="220" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="628" y="80" font-size="12" fill="#166534" text-anchor="middle">T1：提交</text>
  <rect x="22" y="120" width="220" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="132" y="142" font-size="12" fill="#9d174d" text-anchor="middle">T2：写 x</text>
  <rect x="270" y="120" width="220" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="142" font-size="12" fill="#9d174d" text-anchor="middle">T2：写 y</text>
  <rect x="518" y="120" width="220" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="628" y="142" font-size="12" fill="#166534" text-anchor="middle">T2：提交</text>
  <rect x="270" y="182" width="220" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="204" font-size="12" fill="#1e40af" text-anchor="middle">T3：读 x</text>
  <rect x="518" y="182" width="220" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="628" y="204" font-size="12" fill="#1e40af" text-anchor="middle">T3：读 y</text>
  <text x="380" y="254" font-size="11" fill="#64748b" text-anchor="middle">T3 的两次读都落在 T1 之后、T2 之中，所以必须来自同一个时间点</text>
</svg>
