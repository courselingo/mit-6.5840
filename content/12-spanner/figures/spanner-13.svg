<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 279" width="760" height="279"
     role="img" aria-labelledby="fig-spanner-13-title fig-spanner-13-desc">
  <title id="fig-spanner-13-title">三件东西的接口与它们合起来的效果</title>
  <desc id="fig-spanner-13-desc">这一讲的机制由三件东西拼成：快照隔离与多版本让只读事务在不加锁时也可串行化；TrueTime 与提交等待让时间戳具备真实时间的含义；safe time 让落后的本地副本也能被放心地读。三件东西各解决一个接口问题，缺一件另外两件就接不上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="279" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三件东西的接口与它们合起来的效果</text>
  <rect x="22" y="58" width="344" height="36.0" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="80" font-size="12" fill="#6b21a8" text-anchor="middle">快照隔离：让只读事务可串行化</text>
  <rect x="394" y="58" width="344" height="36.0" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="566" y="80" font-size="12" fill="#6b21a8" text-anchor="middle">多版本：让按时间戳读变成查表</text>
  <rect x="22" y="120" width="344" height="36.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="194" y="142" font-size="12" fill="#b45309" text-anchor="middle">TrueTime 与提交等待：让时间戳有真实时间的含义</text>
  <rect x="394" y="120" width="344" height="36.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="142" font-size="12" fill="#b45309" text-anchor="middle">safe time：让落后的本地副本也能被读</text>
  <rect x="22" y="182" width="344" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="204" font-size="12" fill="#9d174d" text-anchor="middle">没有其中任何一件，另外两件都接不上</text>
  <rect x="394" y="182" width="344" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="204" font-size="12" fill="#166534" text-anchor="middle">于是只读事务既快又正确</text>
  <text x="380" y="254" font-size="11" fill="#64748b" text-anchor="middle">三件东西各解决一个接口问题，合起来才是这一讲的机制</text>
</svg>
