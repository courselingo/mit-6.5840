<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 279" width="760" height="279"
     role="img" aria-labelledby="fig-spanner-17-title fig-spanner-17-desc">
  <title id="fig-spanner-17-title">两种事务各有一条取时间戳的规则</title>
  <desc id="fig-spanner-17-desc">读/写事务在提交开始时取 latest 再提交等待，只读事务只取 latest 并按其读取；两条规则合起来让真实时间上的先后写成可证明的不等式。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="279" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种事务各有一条取时间戳的规则</text>
  <rect x="22" y="58" width="344" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="194" y="80" font-size="12" fill="#b45309" text-anchor="middle">读/写事务走两步：开始规则取 latest</text>
  <rect x="394" y="58" width="344" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="80" font-size="12" fill="#b45309" text-anchor="middle">然后提交等待，一直等到该时间戳落到过去</text>
  <rect x="22" y="120" width="344" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="142" font-size="12" fill="#1e40af" text-anchor="middle">只读事务只走一步：取 latest 后按它读</text>
  <rect x="394" y="120" width="344" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="142" font-size="12" fill="#1e40af" text-anchor="middle">取 latest 使它必然不在过去</text>
  <rect x="22" y="182" width="344" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="204" font-size="12" fill="#6b21a8" text-anchor="middle">两条规则的共同目标：让真实时间上的先后可比</text>
  <rect x="394" y="182" width="344" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="566" y="204" font-size="12" fill="#6b21a8" text-anchor="middle">于是外部一致性可以被证明，而不是被假设</text>
  <text x="380" y="254" font-size="11" fill="#64748b" text-anchor="middle">两条规则不是对称的，但它们的目标是同一个</text>
</svg>
