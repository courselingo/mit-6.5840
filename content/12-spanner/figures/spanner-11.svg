<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 279" width="760" height="279"
     role="img" aria-labelledby="fig-spanner-11-title fig-spanner-11-desc">
  <title id="fig-spanner-11-title">四条收益与它们各自的对价</title>
  <desc id="fig-spanner-11-desc">这一讲的基本组织换来四条收益：分片靠并行堆吞吐，跨站点副本能扛整站失效，只要求多数派所以慢副本不拖后腿，客户端就近读所以读很快。而前两条的对价是跨分片协调更复杂，第四条的对价是本地副本可能落后。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="279" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">四条收益与它们各自的对价</text>
  <rect x="22" y="58" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="80" font-size="12" fill="#1e40af" text-anchor="middle">分片：靠并行堆吞吐</text>
  <rect x="394" y="58" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="80" font-size="12" fill="#1e40af" text-anchor="middle">跨站点副本：扛整站失效</text>
  <rect x="22" y="120" width="344" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="142" font-size="12" fill="#166534" text-anchor="middle">只要求多数派：慢副本不拖后腿</text>
  <rect x="394" y="120" width="344" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="142" font-size="12" fill="#166534" text-anchor="middle">客户端就近读：读很快</text>
  <rect x="22" y="182" width="344" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="204" font-size="12" fill="#9d174d" text-anchor="middle">对价：跨分片协调变复杂</text>
  <rect x="394" y="182" width="344" height="36.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="204" font-size="12" fill="#9d174d" text-anchor="middle">对价：本地副本可能落后</text>
  <text x="380" y="254" font-size="11" fill="#64748b" text-anchor="middle">四条收益里，就近读省下的往返正是后来必须补上正确性代价的来源</text>
</svg>
