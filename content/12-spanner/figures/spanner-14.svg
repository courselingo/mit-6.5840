<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 279" width="760" height="279"
     role="img" aria-labelledby="fig-spanner-14-title fig-spanner-14-desc">
  <title id="fig-spanner-14-title">读/写事务八步的顺序</title>
  <desc id="fig-spanner-14-desc">八步依次是客户端读、领导者加锁、写交给协调者、记 prepare、答复、协调者定决定、通知提交、参与者记录并释放锁。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="279" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">读/写事务八步的顺序</text>
  <rect x="22" y="58" width="220" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="80" font-size="12" fill="#1e40af" text-anchor="middle">1 客户端读</text>
  <rect x="270" y="58" width="220" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="80" font-size="12" fill="#b45309" text-anchor="middle">2 领导者加锁</text>
  <rect x="518" y="58" width="220" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="628" y="80" font-size="12" fill="#1e40af" text-anchor="middle">3 写交给协调者</text>
  <rect x="22" y="120" width="220" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="132" y="142" font-size="12" fill="#b45309" text-anchor="middle">4 记 prepare</text>
  <rect x="270" y="120" width="220" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="142" font-size="12" fill="#b45309" text-anchor="middle">5 答复</text>
  <rect x="518" y="120" width="220" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="628" y="142" font-size="12" fill="#166534" text-anchor="middle">6 协调者定决定</text>
  <rect x="22" y="182" width="220" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="132" y="204" font-size="12" fill="#166534" text-anchor="middle">7 通知提交</text>
  <rect x="270" y="182" width="220" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="204" font-size="12" fill="#166534" text-anchor="middle">8 记录并释放锁</text>
  <rect x="518" y="182" width="220" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="628" y="204" font-size="12" fill="#6b21a8" text-anchor="middle">至此事务结束</text>
  <text x="380" y="254" font-size="11" fill="#64748b" text-anchor="middle">前半段在争锁与传写，后半段在传播决定</text>
</svg>
