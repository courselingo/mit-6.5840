<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" width="760" height="215"
     role="img" aria-labelledby="fig-spanner-9-title fig-spanner-9-desc">
  <title id="fig-spanner-9-title">TrueTime 给出区间，并给出两条保证</title>
  <desc id="fig-spanner-9-desc">TrueTime 返回的是一个区间而不是一个点：真实时间以很高的概率落在 earliest 与 latest 之间；小于 earliest 的时间戳保证在过去，大于 latest 的时间戳保证在未来。区间宽度由实测网络延迟、实测时钟漂移与距上次同步的时间算出。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="215" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">TrueTime 给出区间，并给出两条保证</text>
  <rect x="142" y="58" width="432" height="34" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="358" y="79" font-size="11" fill="#1e40af" text-anchor="middle">真实时间以很高的概率落在这个区间里</text>
  <line x1="142" y1="50" x2="142" y2="92" stroke="#64748b" stroke-width="1.5"/>
  <line x1="574" y1="50" x2="574" y2="92" stroke="#64748b" stroke-width="1.5"/>
  <text x="142" y="44" font-size="11" fill="#64748b" text-anchor="middle">earliest</text>
  <text x="574" y="44" font-size="11" fill="#64748b" text-anchor="middle">latest</text>
  <rect x="22" y="118" width="344" height="36.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="140" font-size="12" fill="#166534" text-anchor="middle">小于 earliest 的时间戳：保证在过去</text>
  <rect x="394" y="118" width="344" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="140" font-size="12" fill="#1e40af" text-anchor="middle">大于 latest 的时间戳：保证在未来</text>
  <text x="380" y="190.0" font-size="11" fill="#64748b" text-anchor="middle">区间宽度由实测网络延迟、实测时钟漂移与距上次同步的时间算出</text>
</svg>
