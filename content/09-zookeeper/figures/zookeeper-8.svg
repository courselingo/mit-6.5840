<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-zookeeper-8-title fig-zookeeper-8-desc">
  <title id="fig-zookeeper-8-title">一次写：定位置、分配 zxid、多数派确认</title>
  <desc id="fig-zookeeper-8-desc">写请求经所连服务器转给领导者，领导者定位置并分配 zxid，副本按序执行，多数派接受后才回复客户端。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次写：定位置、分配 zxid、多数派确认</text>

  <rect x="25" y="64" width="122" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="86" y="86" font-size="12" fill="#1e40af" text-anchor="middle">客户端把写请求</text>
  <text x="86" y="104" font-size="12" fill="#1e40af" text-anchor="middle">发给所连服务器</text>
  <rect x="172" y="64" width="122" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="233" y="86" font-size="12" fill="#b45309" text-anchor="middle">若那是跟随者</text>
  <text x="233" y="104" font-size="12" fill="#b45309" text-anchor="middle">就转发给领导者</text>
  <rect x="319" y="64" width="122" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">领导者定全序位置</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">并分配 zxid</text>
  <rect x="466" y="64" width="122" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="527" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">所有副本</text>
  <text x="527" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">按 zxid 顺序执行</text>
  <rect x="613" y="64" width="122" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="674" y="86" font-size="12" fill="#166534" text-anchor="middle">多数派接受后</text>
  <text x="674" y="104" font-size="12" fill="#166534" text-anchor="middle">才回复客户端</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="165" font-size="12" fill="#1e40af" text-anchor="middle">读走另一条路</text>
  <text x="135" y="183" font-size="12" fill="#1e40af" text-anchor="middle">在本地副本完成</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="165" font-size="12" fill="#166534" text-anchor="middle">好处：读不压领导者</text>
  <text x="380" y="183" font-size="12" fill="#166534" text-anchor="middle">吞吐更高</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="165" font-size="12" fill="#9d174d" text-anchor="middle">代价：副本可能落后</text>
  <text x="625" y="183" font-size="12" fill="#9d174d" text-anchor="middle">读到旧值</text>

  <path d="M152,91 L161,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M299,91 L308,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M446,91 L455,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M593,91 L602,91" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
