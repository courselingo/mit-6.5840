<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-zookeeper-14-title fig-zookeeper-14-desc">
  <title id="fig-zookeeper-14-title">会话超时取短还是取长，两头都要付代价</title>
  <desc id="fig-zookeeper-14-desc">取短：网络一抖就误杀活着的客户端，临时节点被删、主被换掉；取长：真崩了要等更久才切换。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">会话超时取短还是取长，两头都要付代价</text>

  <rect x="25" y="64" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195" y="86" font-size="12" fill="#9d174d" text-anchor="middle">取短：网络一抖</text>
  <text x="195" y="104" font-size="12" fill="#9d174d" text-anchor="middle">就误杀活着的客户端</text>
  <rect x="395" y="64" width="340" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="565" y="86" font-size="12" fill="#9d174d" text-anchor="middle">临时节点被删</text>
  <text x="565" y="104" font-size="12" fill="#9d174d" text-anchor="middle">主也被换掉</text>
  <rect x="25" y="143" width="340" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195" y="165" font-size="12" fill="#b45309" text-anchor="middle">取长：真的崩了</text>
  <text x="195" y="183" font-size="12" fill="#b45309" text-anchor="middle">要等更久才能切换</text>
  <rect x="395" y="143" width="340" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="565" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">这段时间谁来服务</text>
  <text x="565" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">笔记没有给答案</text>
</svg>
