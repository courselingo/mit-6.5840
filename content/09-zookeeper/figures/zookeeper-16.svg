<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 259" width="756" height="259" role="img" aria-labelledby="fig-zookeeper-16-title fig-zookeeper-16-desc">
  <title id="fig-zookeeper-16-title">成员表就是 workers 下的临时节点列表</title>
  <desc id="fig-zookeeper-16-desc">每个工作节点在 /workers 下建一个临时顺序节点，子节点列表就是活着的成员，监视它就能知道变化。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="259" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">成员表就是 workers 下的临时节点列表</text>

  <rect x="25" y="76" width="710" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="45" y="104" font-size="12" fill="#64748b" text-anchor="start">/workers</text>
  <rect x="45" y="126" width="203" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="146.5" y="148" font-size="12" fill="#1e40af" text-anchor="middle">每个工作节点启动时</text>
  <text x="146.5" y="166" font-size="12" fill="#1e40af" text-anchor="middle">在 /workers 下建临时节点</text>
  <text x="146.5" y="184" font-size="12" fill="#1e40af" text-anchor="middle">名字带上顺序号</text>
  <text x="146.5" y="202" font-size="12" fill="#1e40af" text-anchor="middle">以免撞名</text>
  <rect x="278" y="126" width="203" height="90" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379.5" y="148" font-size="12" fill="#166534" text-anchor="middle">于是子节点列表</text>
  <text x="379.5" y="166" font-size="12" fill="#166534" text-anchor="middle">就是当前活着的工作节点</text>
  <text x="379.5" y="184" font-size="12" fill="#166534" text-anchor="middle">想知道成员变化</text>
  <text x="379.5" y="202" font-size="12" fill="#166534" text-anchor="middle">监视子节点列表就可以</text>
  <rect x="511" y="126" width="203" height="90" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="612.5" y="148" font-size="12" fill="#9d174d" text-anchor="middle">节点崩溃或断连</text>
  <text x="612.5" y="166" font-size="12" fill="#9d174d" text-anchor="middle">临时节点随会话消失</text>
  <text x="612.5" y="184" font-size="12" fill="#9d174d" text-anchor="middle">成员表不需要人维护</text>
  <text x="612.5" y="202" font-size="12" fill="#9d174d" text-anchor="middle">它自己会长</text>
</svg>
