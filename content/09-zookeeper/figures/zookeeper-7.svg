<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 309" width="756" height="309" role="img" aria-labelledby="fig-zookeeper-7-title fig-zookeeper-7-desc">
  <title id="fig-zookeeper-7-title">setData 带版本号：一笔最小的比较并交换</title>
  <desc id="fig-zookeeper-7-desc">客户端读到版本号 3，写入时带上 3，版本对得上就生效并变成 4；另一个客户端也带 3，比较不通过就失败。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="309" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">setData 带版本号：一笔最小的比较并交换</text>

  <rect x="25" y="140" width="331" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190.5" y="162" font-size="12" fill="#1e40af" text-anchor="middle">客户端读到版本号 3</text>
  <text x="190.5" y="180" font-size="12" fill="#1e40af" text-anchor="middle">手上就有了一个凭据</text>
  <text x="190.5" y="198" font-size="12" fill="#1e40af" text-anchor="middle">写入时把版本 3 带上</text>
  <text x="190.5" y="216" font-size="12" fill="#1e40af" text-anchor="middle">服务端做一次比较</text>
  <rect x="384" y="76" width="351" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="559.5" y="98" font-size="12" fill="#166534" text-anchor="middle">版本对得上就生效</text>
  <text x="559.5" y="116" font-size="12" fill="#166534" text-anchor="middle">版本号变成 4</text>
  <rect x="384" y="160" width="351" height="126" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="559.5" y="182" font-size="12" fill="#9d174d" text-anchor="middle">另一个客户端也带 3</text>
  <text x="559.5" y="200" font-size="12" fill="#9d174d" text-anchor="middle">但它读到的是旧快照</text>
  <text x="559.5" y="218" font-size="12" fill="#9d174d" text-anchor="middle">服务端上已经是 4</text>
  <text x="559.5" y="236" font-size="12" fill="#9d174d" text-anchor="middle">比较不通过</text>
  <text x="559.5" y="254" font-size="12" fill="#9d174d" text-anchor="middle">这次写入失败</text>
  <text x="559.5" y="272" font-size="12" fill="#9d174d" text-anchor="middle">谁都没改坏数据</text>
  <path d="M361,165 C370,120 372,103 373,103" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M361,205 L373,205" fill="none" stroke="#ec4899" marker-end="url(#arrow-pink)"/>
</svg>
