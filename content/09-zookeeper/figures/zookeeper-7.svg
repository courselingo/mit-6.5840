<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-zookeeper-7-title fig-zookeeper-7-desc">
  <title id="fig-zookeeper-7-title">setData 带版本号：一笔最小的比较并交换</title>
  <desc id="fig-zookeeper-7-desc">客户端读到版本号 3，写入时带上 3，版本对得上就生效并变成 4；另一个客户端也带 3，比较不通过就失败。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">setData 带版本号：一笔最小的比较并交换</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">客户端读到版本号 3</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">手上就有了一个凭据</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">写入时把版本 3 带上</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">服务端做一次比较</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="86" font-size="12" fill="#166534" text-anchor="middle">版本对得上就生效</text>
  <text x="625" y="104" font-size="12" fill="#166534" text-anchor="middle">版本号变成 4</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">另一个客户端也带 3</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">但它读到的是旧快照</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="165" font-size="12" fill="#9d174d" text-anchor="middle">服务端上已经是 4</text>
  <text x="380" y="183" font-size="12" fill="#9d174d" text-anchor="middle">比较不通过</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">这次写入失败</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">谁都没改坏数据</text>
</svg>
