<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-zookeeper-15-title fig-zookeeper-15-desc">
  <title id="fig-zookeeper-15-title">监视点的三个坑，以及那个循环</title>
  <desc id="fig-zookeeper-15-desc">通知不保证次数与时机，收到后要重新读状态；注册与读之间节点可能又变，所以往往要写成循环。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">监视点的三个坑，以及那个循环</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="86" font-size="12" fill="#9d174d" text-anchor="middle">通知不保证次数</text>
  <text x="135" y="104" font-size="12" fill="#9d174d" text-anchor="middle">也可能在预料之外到来</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">收到通知的正确做法</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">是重新读一遍状态</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="625" y="86" font-size="12" fill="#9d174d" text-anchor="middle">不能认为状态</text>
  <text x="625" y="104" font-size="12" fill="#9d174d" text-anchor="middle">已经是你要的样子</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">通知与重新注册之间</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">节点可能又变一次</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="165" font-size="12" fill="#b45309" text-anchor="middle">读、注册、再检查</text>
  <text x="380" y="183" font-size="12" fill="#b45309" text-anchor="middle">往往要写成一个循环</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">注册和读是两个操作</text>
  <text x="625" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">不指望通知与值配套</text>
</svg>
