<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 237" width="756" height="237" role="img" aria-labelledby="fig-zookeeper-4-title fig-zookeeper-4-desc">
  <title id="fig-zookeeper-4-title">复制的是计算：每次状态变化都要先变成日志</title>
  <desc id="fig-zookeeper-4-desc">业务本来只是几十行顺序代码，用复制协议后要拆成一串事件处理函数，每次变化先变成日志条目再回放。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="237" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">复制的是计算：每次状态变化都要先变成日志</text>

  <rect x="25" y="76" width="158" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="104" y="98" font-size="12" fill="#1e40af" text-anchor="middle">业务本来是顺序代码</text>
  <text x="104" y="116" font-size="12" fill="#1e40af" text-anchor="middle">几十行就写完了</text>
  <rect x="209" y="76" width="158" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="288" y="98" font-size="12" fill="#b45309" text-anchor="middle">却要拆成事件处理函数</text>
  <text x="288" y="116" font-size="12" fill="#b45309" text-anchor="middle">每个变化都要接管</text>
  <rect x="393" y="76" width="158" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="98" font-size="12" fill="#b45309" text-anchor="middle">状态变化先变成日志</text>
  <text x="472" y="116" font-size="12" fill="#b45309" text-anchor="middle">提交之后才执行</text>
  <rect x="577" y="76" width="158" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="656" y="98" font-size="12" fill="#6b21a8" text-anchor="middle">应用自己还要盯日志下标</text>
  <text x="656" y="116" font-size="12" fill="#6b21a8" text-anchor="middle">还要盯快照与成员变更</text>
  <path d="M188,103 L198,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,103 L382,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M556,103 L566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="25" y="160" width="710" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="182" font-size="12" fill="#9d174d" text-anchor="middle">多出来的复杂度，几乎全部来自框架</text>
  <text x="380" y="200" font-size="12" fill="#9d174d" text-anchor="middle">业务本身没有被复制，被复制的是计算</text>
</svg>
