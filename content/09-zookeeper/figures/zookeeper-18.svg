<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-zookeeper-18-title fig-zookeeper-18-desc">
  <title id="fig-zookeeper-18-title">隔离令牌：把判决的效力带到资源那一侧</title>
  <desc id="fig-zookeeper-18-desc">会话终结的拒绝只管得到 ZooKeeper 客户端；被保护的资源要用单调递增的隔离令牌挡住旧编号的请求。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">隔离令牌：把判决的效力带到资源那一侧</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="86" font-size="12" fill="#b45309" text-anchor="middle">会话终结时拒绝请求</text>
  <text x="135" y="104" font-size="12" fill="#b45309" text-anchor="middle">挡住的是这个客户端</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">如果被保护的资源在别处</text>
  <text x="380" y="104" font-size="12" fill="#9d174d" text-anchor="middle">拒绝请求就管不到它</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="86" font-size="12" fill="#1e40af" text-anchor="middle">所以要给它配隔离令牌</text>
  <text x="625" y="104" font-size="12" fill="#1e40af" text-anchor="middle">一个单调递增的编号</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">老主带着旧编号上门</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">资源端直接拒绝</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="165" font-size="12" fill="#166534" text-anchor="middle">新主拿到更大的编号</text>
  <text x="380" y="183" font-size="12" fill="#166534" text-anchor="middle">天然排在老主后面</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">判决可能出错这件事</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">就由令牌兜住了</text>
</svg>
