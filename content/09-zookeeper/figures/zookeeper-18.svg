<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 356" width="756" height="356" role="img" aria-labelledby="fig-zookeeper-18-title fig-zookeeper-18-desc">
  <title id="fig-zookeeper-18-title">隔离令牌：把判决的效力带到资源那一侧</title>
  <desc id="fig-zookeeper-18-desc">会话终结的拒绝只管得到 ZooKeeper 客户端；如果被保护的资源在别处，就要给它配一个单调递增的隔离令牌来挡住旧编号的请求。要说明的是：令牌这一层是我们的补白 —— 两个源里只有 fencing 这个词与「拒绝被判死客户端的请求」这个含义，没有出现「token」。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="356" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">隔离令牌：把判决的效力带到资源那一侧</text>

  <text x="190" y="62" font-size="12" fill="#64748b" text-anchor="middle">ZooKeeper 这一侧</text>
  <text x="570" y="62" font-size="12" fill="#64748b" text-anchor="middle">被保护的资源那一侧</text>
  <rect x="25" y="76" width="330" height="257" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="405" y="76" width="330" height="257" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="40" y="96" width="300" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="190" y="118" font-size="12" fill="#9d174d" text-anchor="middle">会话终结时拒绝请求</text>
  <text x="190" y="136" font-size="12" fill="#9d174d" text-anchor="middle">挡住的是这个客户端</text>
  <rect x="40" y="180" width="300" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="190" y="202" font-size="12" fill="#9d174d" text-anchor="middle">如果被保护的资源在别处</text>
  <text x="190" y="220" font-size="12" fill="#9d174d" text-anchor="middle">拒绝请求就管不到它</text>
  <rect x="40" y="264" width="300" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="286" font-size="12" fill="#1e40af" text-anchor="middle">所以要给它配隔离令牌</text>
  <text x="190" y="304" font-size="12" fill="#1e40af" text-anchor="middle">一个单调递增的编号（我们补的）</text>
  <rect x="420" y="96" width="300" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="570" y="118" font-size="12" fill="#9d174d" text-anchor="middle">老主带着旧编号上门</text>
  <text x="570" y="136" font-size="12" fill="#9d174d" text-anchor="middle">资源端直接拒绝</text>
  <rect x="420" y="180" width="300" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="570" y="202" font-size="12" fill="#166534" text-anchor="middle">新主拿到更大的编号</text>
  <text x="570" y="220" font-size="12" fill="#166534" text-anchor="middle">天然排在老主后面</text>
  <rect x="420" y="264" width="300" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="570" y="286" font-size="12" fill="#6b21a8" text-anchor="middle">判决可能出错这件事</text>
  <text x="570" y="304" font-size="12" fill="#6b21a8" text-anchor="middle">就由令牌兜住了</text>
  <path d="M345,291 C 380,291 380,207 409,207" fill="none" stroke="#ef4444" marker-end="url(#arrow-red)"/>
</svg>
