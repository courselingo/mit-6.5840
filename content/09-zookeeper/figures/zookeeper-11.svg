<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="fig-zookeeper-11-title fig-zookeeper-11-desc">
  <title id="fig-zookeeper-11-title">更新只做了一半：三种收尾写法</title>
  <desc id="fig-zookeeper-11-desc">跨 znode 的更新可能只做一半，所以要以一次提交写收尾：全塞进一个节点、用 ready 当闸门、或最后改指针。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">更新只做了一半：三种收尾写法</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="86" font-size="12" fill="#9d174d" text-anchor="middle">跨 znode 的更新</text>
  <text x="135" y="104" font-size="12" fill="#9d174d" text-anchor="middle">可能只完成一半</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">所以要设计成</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">以一次提交写收尾</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="86" font-size="12" fill="#166534" text-anchor="middle">新主上任时</text>
  <text x="625" y="104" font-size="12" fill="#166534" text-anchor="middle">才能一眼看出做完没有</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="165" font-size="12" fill="#b45309" text-anchor="middle">写法一：全塞进一个节点</text>
  <text x="135" y="183" font-size="12" fill="#b45309" text-anchor="middle">一次写入就是全有或全无</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="165" font-size="12" fill="#9d174d" text-anchor="middle">省事，但数据被挤在</text>
  <text x="380" y="183" font-size="12" fill="#9d174d" text-anchor="middle">一个节点里</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">它仍然是 ZooKeeper 里</text>
  <text x="625" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">最小的数据</text>
  <rect x="25" y="222" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="244" font-size="12" fill="#b45309" text-anchor="middle">写法二：ready 当闸门</text>
  <text x="135" y="262" font-size="12" fill="#b45309" text-anchor="middle">先删 ready，改完再建</text>
  <rect x="270" y="222" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="244" font-size="12" fill="#b45309" text-anchor="middle">或者写全新一套节点</text>
  <text x="380" y="262" font-size="12" fill="#b45309" text-anchor="middle">最后改一个指针指向它</text>
  <rect x="515" y="222" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="244" font-size="12" fill="#166534" text-anchor="middle">三种写法的共同点</text>
  <text x="625" y="262" font-size="12" fill="#166534" text-anchor="middle">都是最后一次写入定胜负</text>
</svg>
