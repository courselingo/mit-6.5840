<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 383" width="766" height="383"
     role="img" aria-labelledby="fig-zk-1-title fig-zk-1-desc">
  <title id="fig-zk-1-title">ZooKeeper 的数据树与三类节点</title>
  <desc id="fig-zk-1-desc">左列是一条逐层变长的路径，每一层都是上一层的子节点，最下面那个临时顺序节点是成员。右列是普通、临时、顺序三类节点各自的存活与命名规则，最后一行说明命名方式可以与任一种存活方式叠加。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="766" height="383" fill="#ffffff"/>

  <text x="383" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">ZooKeeper 的数据树与三类节点</text>

  <path d="M195,123 L195,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M195,204 L195,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M195,285 L195,296" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="25" y="64" width="340" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="86" font-size="12" fill="#1e40af" text-anchor="middle">/ 根节点</text>
  <text x="195" y="104" font-size="12" fill="#1e40af" text-anchor="middle">所有 znode 都挂在这棵树下面</text>

  <rect x="25" y="145" width="340" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="167" font-size="12" fill="#1e40af" text-anchor="middle">/app</text>
  <text x="195" y="185" font-size="12" fill="#1e40af" text-anchor="middle">普通节点：内容带版本号</text>

  <rect x="25" y="226" width="340" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="248" font-size="12" fill="#1e40af" text-anchor="middle">/app/workers</text>
  <text x="195" y="266" font-size="12" fill="#1e40af" text-anchor="middle">普通节点：一串成员挂在这下面</text>

  <rect x="25" y="307" width="340" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195" y="329" font-size="12" fill="#1e40af" text-anchor="middle">/app/workers/w-0000000001</text>
  <text x="195" y="347" font-size="12" fill="#1e40af" text-anchor="middle">临时 + 顺序：上线创建，掉线消失</text>

  <rect x="393" y="64" width="348" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="567" y="86" font-size="12" fill="#b45309" text-anchor="middle">普通节点 regular</text>
  <text x="567" y="104" font-size="12" fill="#b45309" text-anchor="middle">除非显式删除，它会一直存在</text>

  <rect x="393" y="145" width="348" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="567" y="167" font-size="12" fill="#9d174d" text-anchor="middle">临时节点 ephemeral</text>
  <text x="567" y="185" font-size="12" fill="#9d174d" text-anchor="middle">会话一结束，服务端就删掉它</text>

  <rect x="393" y="226" width="348" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="567" y="248" font-size="12" fill="#6b21a8" text-anchor="middle">顺序节点 sequential</text>
  <text x="567" y="266" font-size="12" fill="#6b21a8" text-anchor="middle">创建时由服务端追加递增序号</text>

  <rect x="393" y="307" width="348" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="567" y="329" font-size="12" fill="#166534" text-anchor="middle">命名方式可与存活方式叠加</text>
  <text x="567" y="347" font-size="12" fill="#166534" text-anchor="middle">临时 + 顺序 = 会排队的临时成员</text>
</svg>
