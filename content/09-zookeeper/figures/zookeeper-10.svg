<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 360" width="756" height="360" role="img" aria-labelledby="fig-zookeeper-10-title fig-zookeeper-10-desc">
  <title id="fig-zookeeper-10-title">惊群：全体监视锁节点 vs 只监视前一个</title>
  <desc id="fig-zookeeper-10-desc">全体监视锁节点会在解锁时叫醒所有人，只有一个成功；只监视前一个则只叫醒一人，队列本来就有序。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="360" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">惊群：全体监视锁节点 vs 只监视前一个</text>

  <rect x="25" y="62" width="341" height="275" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="394" y="62" width="341" height="275" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <circle cx="195" cy="104" r="16" fill="#fce7f3" stroke="#ec4899"/>
  <circle cx="110" cy="72" r="9" fill="#ffffff" stroke="#64748b"/>
  <circle cx="280" cy="72" r="9" fill="#ffffff" stroke="#64748b"/>
  <circle cx="110" cy="146" r="9" fill="#ffffff" stroke="#64748b"/>
  <circle cx="280" cy="146" r="9" fill="#ffffff" stroke="#64748b"/>
  <path d="M195,104 C175,95 150,85 118,76" fill="none" stroke="#ec4899"/>
  <path d="M195,104 C215,95 240,85 272,76" fill="none" stroke="#ec4899"/>
  <path d="M195,104 C170,118 145,132 118,142" fill="none" stroke="#ec4899"/>
  <path d="M195,104 C220,118 245,132 272,142" fill="none" stroke="#ec4899"/>
  <text x="195" y="172" font-size="12" fill="#9d174d" text-anchor="middle">锁节点</text>
  <circle cx="440" cy="104" r="12" fill="#ffffff" stroke="#64748b"/>
  <circle cx="520" cy="104" r="12" fill="#ffffff" stroke="#64748b"/>
  <circle cx="600" cy="104" r="12" fill="#ffffff" stroke="#64748b"/>
  <circle cx="680" cy="104" r="12" fill="#ffffff" stroke="#64748b"/>
  <path d="M452,104 L497,104" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M532,104 L577,104" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M612,104 L657,104" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <rect x="40" y="196" width="311" height="126" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.5" y="218" font-size="12" fill="#9d174d" text-anchor="middle">所有人都监视锁节点</text>
  <text x="195.5" y="236" font-size="12" fill="#9d174d" text-anchor="middle">解锁时一起通知</text>
  <text x="195.5" y="254" font-size="12" fill="#9d174d" text-anchor="middle">全部等待者同时被叫醒</text>
  <text x="195.5" y="272" font-size="12" fill="#9d174d" text-anchor="middle">一起冲上去抢</text>
  <text x="195.5" y="290" font-size="12" fill="#9d174d" text-anchor="middle">只有一个人成功</text>
  <text x="195.5" y="308" font-size="12" fill="#9d174d" text-anchor="middle">其余重新排队</text>
  <rect x="409" y="196" width="311" height="126" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="564.5" y="218" font-size="12" fill="#166534" text-anchor="middle">只监视自己前面那一个</text>
  <text x="564.5" y="236" font-size="12" fill="#166534" text-anchor="middle">队列本来就有序</text>
  <text x="564.5" y="254" font-size="12" fill="#166534" text-anchor="middle">解锁只叫醒一个人</text>
  <text x="564.5" y="272" font-size="12" fill="#166534" text-anchor="middle">不会挤在一起</text>
  <text x="564.5" y="290" font-size="12" fill="#166534" text-anchor="middle">临时节点加顺序号</text>
  <text x="564.5" y="308" font-size="12" fill="#166534" text-anchor="middle">已经把顺序排好了</text>
</svg>
