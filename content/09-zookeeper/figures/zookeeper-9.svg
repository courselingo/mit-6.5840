<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-zk-9-title fig-zk-9-desc">
  <title id="fig-zk-9-title">顺序不同终值就不同，所以写要走同一条全序</title>
  <desc id="fig-zk-9-desc">同一批事务换个顺序终值就不一样：先加一再乘二得 4，先乘二再加一得 3。所以写请求交给所连服务器后转给领导者，由领导者定全序位置并分配 zxid，副本按序执行，多数派接受后才回复客户端；读走另一条路，在本地副本完成。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">顺序不同终值就不同，所以写要走同一条全序</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">同一批事务：先加一，再乘二</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">一次写：定位置、分配 zxid、多数派确认</text>

  <path d="M157,250 L169,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M299,250 L311,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M441,250 L453,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M583,250 L595,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="328" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="202" y="110" font-size="15" fill="#6b21a8" text-anchor="middle">顺序一</text>
  <text x="202" y="132" font-size="12" fill="#6b21a8" text-anchor="middle">先加一得 2，再乘二得 4</text>

  <rect x="394" y="82" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="558" y="110" font-size="15" fill="#9d174d" text-anchor="middle">顺序二</text>
  <text x="558" y="132" font-size="12" fill="#9d174d" text-anchor="middle">先乘二得 2，再加一得 3</text>

  <rect x="38" y="216" width="114" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="95" y="244" font-size="15" fill="#1e40af" text-anchor="middle">客户端发请求</text>
  <text x="95" y="266" font-size="12" fill="#1e40af" text-anchor="middle">发给所连服务器</text>

  <rect x="180" y="216" width="114" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="237" y="244" font-size="15" fill="#1e40af" text-anchor="middle">转给领导者</text>
  <text x="237" y="266" font-size="12" fill="#1e40af" text-anchor="middle">由它定全序位置</text>

  <rect x="322" y="216" width="114" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="244" font-size="15" fill="#b45309" text-anchor="middle">分配 zxid</text>
  <text x="379" y="266" font-size="12" fill="#b45309" text-anchor="middle">副本按序执行</text>

  <rect x="464" y="216" width="114" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="521" y="244" font-size="15" fill="#b45309" text-anchor="middle">多数派接受</text>
  <text x="521" y="266" font-size="12" fill="#b45309" text-anchor="middle">才回复客户端</text>

  <rect x="606" y="216" width="114" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="663" y="244" font-size="15" fill="#166534" text-anchor="middle">读走另一条路</text>
  <text x="663" y="266" font-size="12" fill="#166534" text-anchor="middle">在本地副本完成</text>
</svg>
