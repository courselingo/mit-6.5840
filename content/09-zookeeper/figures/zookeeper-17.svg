<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-zookeeper-17-title fig-zookeeper-17-desc">
  <title id="fig-zookeeper-17-title">配置管理：一个节点加一次带版本号的写入</title>
  <desc id="fig-zookeeper-17-desc">配置存在一个节点的内容里，修改时带版本号，其他人注册监视点；通知只有一次，收到后要重新读。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">配置管理：一个节点加一次带版本号的写入</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">配置写在一个节点的内容里</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">读的人只看这一个节点</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">修改时带上版本号</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">版本对不上就改不动</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="86" font-size="12" fill="#b45309" text-anchor="middle">其他人在路径上注册监视点</text>
  <text x="625" y="104" font-size="12" fill="#b45309" text-anchor="middle">改完收到一次通知</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">通知只有一次</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">收到后重新读一遍配置</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="165" font-size="12" fill="#166534" text-anchor="middle">配置小、变更少</text>
  <text x="380" y="183" font-size="12" fill="#166534" text-anchor="middle">正好适合放在内存里</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">大块数据不放这里</text>
  <text x="625" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">它属于别的存储</text>
</svg>
