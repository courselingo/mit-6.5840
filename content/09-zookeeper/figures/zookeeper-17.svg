<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 303" width="756" height="303" role="img" aria-labelledby="fig-zookeeper-17-title fig-zookeeper-17-desc">
  <title id="fig-zookeeper-17-title">配置管理：一个节点加一次带版本号的写入</title>
  <desc id="fig-zookeeper-17-desc">配置存在一个节点的内容里，修改时带版本号，其他人注册监视点；通知只有一次，收到后要重新读。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="303" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">配置管理：一个节点加一次带版本号的写入</text>

  <rect x="25" y="62" width="710" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="84" font-size="12" fill="#1e40af" text-anchor="middle">配置写在一个节点的内容里，读的人只看这一个节点</text>
  <text x="380" y="102" font-size="12" fill="#1e40af" text-anchor="middle">修改时带上版本号，版本对不上就改不动</text>
  <rect x="25" y="144" width="710" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="166" font-size="12" fill="#b45309" text-anchor="middle">其他人在路径上注册监视点，改完收到一次通知</text>
  <text x="380" y="184" font-size="12" fill="#b45309" text-anchor="middle">通知只有一次，收到后重新读一遍配置</text>
  <rect x="25" y="226" width="710" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="248" font-size="12" fill="#166534" text-anchor="middle">配置小、变更少，正好适合放在内存里</text>
  <text x="380" y="266" font-size="12" fill="#166534" text-anchor="middle">大块数据不放这里，它属于别的存储</text>
  <path d="M380,121 L380,133" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,203 L380,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
