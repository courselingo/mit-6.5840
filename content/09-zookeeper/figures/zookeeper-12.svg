<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 373" width="756" height="373" role="img" aria-labelledby="fig-zookeeper-12-title fig-zookeeper-12-desc">
  <title id="fig-zookeeper-12-title">判死后原子做两件事，把还活着的老主挡住</title>
  <desc id="fig-zookeeper-12-desc">心跳停后服务端先删该会话的临时节点，再拒绝它的请求；老主还活着也写不了，据此知道已不是主。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="373" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">判死后原子做两件事，把还活着的老主挡住</text>

  <rect x="25" y="62" width="710" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="84" font-size="12" fill="#1e40af" text-anchor="middle">老主的心跳停了</text>
  <text x="380" y="102" font-size="12" fill="#1e40af" text-anchor="middle">服务端判定会话已死</text>
  <rect x="25" y="146" width="341" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.5" y="168" font-size="12" fill="#b45309" text-anchor="middle">先删掉它建的临时节点</text>
  <text x="195.5" y="186" font-size="12" fill="#b45309" text-anchor="middle">选主从这里开始</text>
  <rect x="394" y="146" width="341" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="564.5" y="168" font-size="12" fill="#b45309" text-anchor="middle">再从此拒绝这个会话请求</text>
  <text x="564.5" y="186" font-size="12" fill="#b45309" text-anchor="middle">两件事必须一起做</text>
  <rect x="25" y="230" width="710" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="252" font-size="12" fill="#9d174d" text-anchor="middle">老主其实还活着，它仍以为自己是主</text>
  <text x="380" y="270" font-size="12" fill="#9d174d" text-anchor="middle">但它写不了：请求被拒，客户端库抛出异常</text>
  <rect x="25" y="314" width="710" height="36" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="336" font-size="12" fill="#166534" text-anchor="middle">程序据此知道自己已经不是主了</text>
</svg>
