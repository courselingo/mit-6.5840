<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-zookeeper-12-title fig-zookeeper-12-desc">
  <title id="fig-zookeeper-12-title">判死后原子做两件事，把还活着的老主挡住</title>
  <desc id="fig-zookeeper-12-desc">心跳停后服务端先删该会话的临时节点，再拒绝它的请求；老主还活着也写不了，据此知道已不是主。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">判死后原子做两件事，把还活着的老主挡住</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">老主的心跳停了</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">服务端判定会话已死</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="86" font-size="12" fill="#b45309" text-anchor="middle">先删掉它建的临时节点</text>
  <text x="380" y="104" font-size="12" fill="#b45309" text-anchor="middle">选主从这里开始</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="86" font-size="12" fill="#b45309" text-anchor="middle">再从此拒绝这个会话请求</text>
  <text x="625" y="104" font-size="12" fill="#b45309" text-anchor="middle">两件事必须一起做</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">老主其实还活着</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">它仍以为自己是主</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="165" font-size="12" fill="#9d174d" text-anchor="middle">它写不了：请求被拒</text>
  <text x="380" y="183" font-size="12" fill="#9d174d" text-anchor="middle">客户端库抛出异常</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="165" font-size="12" fill="#166534" text-anchor="middle">程序据此知道</text>
  <text x="625" y="183" font-size="12" fill="#166534" text-anchor="middle">自己已经不是主了</text>
</svg>
