<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-zookeeper-5-title fig-zookeeper-5-desc">
  <title id="fig-zookeeper-5-title">三种直觉做法与它们各自挡路的地方</title>
  <desc id="fig-zookeeper-5-desc">状态写本机磁盘会随机器一起丢，只复制存储要先有容错存储，自己用 Raft 也仍要写对检测死亡与选主。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三种直觉做法与它们各自挡路的地方</text>

  <rect x="25" y="64" width="158" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="104" y="86" font-size="12" fill="#9d174d" text-anchor="middle">状态写本机磁盘</text>
  <text x="104" y="104" font-size="12" fill="#9d174d" text-anchor="middle">机器崩了就没了</text>
  <rect x="209" y="64" width="158" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="288" y="86" font-size="12" fill="#b45309" text-anchor="middle">只复制存储</text>
  <text x="288" y="104" font-size="12" fill="#b45309" text-anchor="middle">得先有容错存储</text>
  <rect x="393" y="64" width="158" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="86" font-size="12" fill="#b45309" text-anchor="middle">自己用 Raft 存</text>
  <text x="472" y="104" font-size="12" fill="#b45309" text-anchor="middle">这几件事仍要写对</text>
  <rect x="577" y="64" width="158" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="656" y="86" font-size="12" fill="#166534" text-anchor="middle">ZooKeeper</text>
  <text x="656" y="104" font-size="12" fill="#166534" text-anchor="middle">打包成现成服务</text>
  <rect x="25" y="143" width="158" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="104" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">要能检测</text>
  <text x="104" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">老协调者已死</text>
  <rect x="209" y="143" width="158" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="288" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">要能选出</text>
  <text x="288" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">唯一的新协调者</text>
  <rect x="393" y="143" width="158" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="472" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">要能从只做一半</text>
  <text x="472" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">的更新里恢复</text>
  <rect x="577" y="143" width="158" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="656" y="165" font-size="12" fill="#9d174d" text-anchor="middle">老主还活着</text>
  <text x="656" y="183" font-size="12" fill="#9d174d" text-anchor="middle">却不知道自己被判死</text>
</svg>
