<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-zk-20-title fig-zk-20-desc">
  <title id="fig-zk-20-title">读本地化与全内存换来的边界：读可能旧，能力也有缺口</title>
  <desc id="fig-zk-20-desc">上排是什么时候能接受旧值：只是给人看或纯只读可以，读-改-写不行；一组数据要一起一致时，追上最新有两条路，先做一次写再读，或者用 ready znode 当闸门，sync 只是更高效的那条（论文称它是「一次慢读」）。下排是数据全在内存的代价与能力缺口：读快正是全靠内存，所以只放路径、状态这类小数据，大块文件放别的存储；跨 znode 的更新不是事务，这是它最大的能力缺口。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">读本地化与全内存换来的边界：读可能旧，能力也有缺口</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">旧值什么时候能接受，什么时候不能</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">数据全在内存的代价与能力缺口</text>

  <rect x="38" y="82" width="209" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="142" y="110" font-size="15" fill="#166534" text-anchor="middle">只是给人看</text>
  <text x="142" y="132" font-size="12" fill="#166534" text-anchor="middle">或者本来就纯只读</text>

  <rect x="275" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379" y="110" font-size="15" fill="#9d174d" text-anchor="middle">读-改-写不行</text>
  <text x="379" y="132" font-size="12" fill="#9d174d" text-anchor="middle">计数器加一这种</text>

  <rect x="512" y="82" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="616" y="110" font-size="15" fill="#9d174d" text-anchor="middle">一组数据要一起一致</text>
  <text x="616" y="132" font-size="12" fill="#9d174d" text-anchor="middle">先写一次再读，或用 ready 闸门</text>

  <rect x="38" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="142" y="244" font-size="15" fill="#b45309" text-anchor="middle">读快，因为数据全在内存</text>
  <text x="142" y="266" font-size="12" fill="#b45309" text-anchor="middle">所以只放小数据：路径与状态</text>

  <rect x="275" y="216" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="379" y="244" font-size="15" fill="#1e40af" text-anchor="middle">大块文件放别的存储</text>
  <text x="379" y="266" font-size="12" fill="#1e40af" text-anchor="middle">两者各管一段</text>

  <rect x="512" y="216" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="616" y="244" font-size="15" fill="#9d174d" text-anchor="middle">跨 znode 的更新不是事务</text>
  <text x="616" y="266" font-size="12" fill="#9d174d" text-anchor="middle">这是它最大的能力缺口</text>
</svg>
