<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-zookeeper-6-title fig-zookeeper-6-desc">
  <title id="fig-zookeeper-6-title">不暴露共识：对外只有树与通知</title>
  <desc id="fig-zookeeper-6-desc">内部是领导者、跟随者、多数派与全序日志；对外只有一棵像文件系统的树和一次性通知，看不到投票与任期。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">不暴露共识：对外只有树与通知</text>

  <rect x="25" y="64" width="340" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195" y="86" font-size="12" fill="#166534" text-anchor="middle">对外只有一棵树</text>
  <text x="195" y="104" font-size="12" fill="#166534" text-anchor="middle">加上「变了就叫我一声」</text>
  <rect x="395" y="64" width="340" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="565" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">内部是复制组</text>
  <text x="565" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">领导者、跟随者、多数派、全序日志</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="165" font-size="12" fill="#1e40af" text-anchor="middle">应用看不到投票</text>
  <text x="135" y="183" font-size="12" fill="#1e40af" text-anchor="middle">也不用管谁投了谁</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="165" font-size="12" fill="#1e40af" text-anchor="middle">看不到任期编号</text>
  <text x="380" y="183" font-size="12" fill="#1e40af" text-anchor="middle">也不用比对日志下标</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="165" font-size="12" fill="#b45309" text-anchor="middle">想等就在客户端等</text>
  <text x="625" y="183" font-size="12" fill="#b45309" text-anchor="middle">服务端不替任何人排队</text>
</svg>
