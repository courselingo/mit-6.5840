<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 325" width="756" height="325" role="img" aria-labelledby="fig-zookeeper-19-title fig-zookeeper-19-desc">
  <title id="fig-zookeeper-19-title">性能按读与通知优化：四条做法</title>
  <desc id="fig-zookeeper-19-desc">客户端分散连接、监视点就近记、异步批量编号、数据全放内存，于是读不必碰磁盘，写才要落盘。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="325" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">性能按读与通知优化：四条做法</text>

  <rect x="25" y="62" width="341" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.5" y="84" font-size="12" fill="#1e40af" text-anchor="middle">客户端分散连到多台跟随者</text>
  <text x="195.5" y="102" font-size="12" fill="#1e40af" text-anchor="middle">读在本地完成</text>
  <rect x="394" y="62" width="341" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="564.5" y="84" font-size="12" fill="#1e40af" text-anchor="middle">监视点记在客户端所连那台</text>
  <text x="564.5" y="102" font-size="12" fill="#1e40af" text-anchor="middle">不集中到领导者</text>
  <rect x="25" y="146" width="341" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.5" y="168" font-size="12" fill="#b45309" text-anchor="middle">客户端可以异步批量发操作</text>
  <text x="195.5" y="186" font-size="12" fill="#b45309" text-anchor="middle">服务端按编号的顺序执行</text>
  <rect x="394" y="146" width="341" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="564.5" y="168" font-size="12" fill="#166534" text-anchor="middle">数据全放内存</text>
  <text x="564.5" y="186" font-size="12" fill="#166534" text-anchor="middle">读不必碰磁盘</text>
  <rect x="25" y="230" width="710" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="252" font-size="12" fill="#6b21a8" text-anchor="middle">写要落盘写日志，并定期做快照</text>
  <text x="380" y="270" font-size="12" fill="#6b21a8" text-anchor="middle">所以它优化的是读与通知</text>
  <text x="380" y="288" font-size="12" fill="#6b21a8" text-anchor="middle">写是次要目标</text>
</svg>
