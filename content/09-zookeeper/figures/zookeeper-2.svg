<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456"
     role="img" aria-labelledby="fig-zk-2-title fig-zk-2-desc">
  <title id="fig-zk-2-title">用临时顺序节点实现一把锁，以及为什么只盯前一个</title>
  <desc id="fig-zk-2-desc">三个客户端各建一个临时顺序节点，序号最小的持锁，其余只监视自己前面那个；全体监视锁节点会惊群，解锁时叫醒所有人却只有一个成功。持锁者崩溃后心跳停、会话超时、临时节点被删掉，下一个收到通知接手。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="456" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">用临时顺序节点实现一把锁，以及为什么只盯前一个</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">三个客户端抢同一把锁</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">全体监视锁节点 vs 只监视前一个</text>

  <rect x="22" y="324" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="338" font-size="12" fill="#64748b" text-anchor="middle">持锁者崩溃之后</text>

  <path d="M193,116 L205,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M371,116 L383,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M549,116 L561,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="150" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="113" y="110" font-size="15" fill="#1e40af" text-anchor="middle">三个客户端</text>
  <text x="113" y="132" font-size="12" fill="#1e40af" text-anchor="middle">同时想拿这把锁</text>

  <rect x="216" y="82" width="150" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="291" y="110" font-size="15" fill="#b45309" text-anchor="middle">各建一个</text>
  <text x="291" y="132" font-size="12" fill="#b45309" text-anchor="middle">临时顺序节点</text>

  <rect x="394" y="82" width="150" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="469" y="110" font-size="15" fill="#166534" text-anchor="middle">序号最小的持锁</text>
  <text x="469" y="132" font-size="12" fill="#166534" text-anchor="middle">其余排队等待</text>

  <rect x="572" y="82" width="150" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="647" y="110" font-size="15" fill="#6b21a8" text-anchor="middle">只盯前一个</text>
  <text x="647" y="132" font-size="12" fill="#6b21a8" text-anchor="middle">不惊动所有人</text>

  <rect x="38" y="216" width="328" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="202" y="244" font-size="15" fill="#9d174d" text-anchor="middle">全体监视锁节点</text>
  <text x="202" y="266" font-size="12" fill="#9d174d" text-anchor="middle">解锁时叫醒所有人，只有一个成功</text>

  <rect x="394" y="216" width="328" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="558" y="244" font-size="15" fill="#166534" text-anchor="middle">只监视自己前面那个</text>
  <text x="558" y="266" font-size="12" fill="#166534" text-anchor="middle">解锁只叫醒一个人，队列本来有序</text>

  <rect x="38" y="350" width="684" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="378" font-size="15" fill="#b45309" text-anchor="middle">心跳停、会话超时、临时节点被自动删掉</text>
  <text x="380" y="400" font-size="12" fill="#b45309" text-anchor="middle">下一个收到通知并接手，不必轮询，也不会叫醒所有人</text>
</svg>
