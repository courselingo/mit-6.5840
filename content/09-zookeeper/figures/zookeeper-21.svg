<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 756 378" width="756" height="378" role="img" aria-labelledby="fig-zookeeper-21-title fig-zookeeper-21-desc">
  <title id="fig-zookeeper-21-title">数据必须装在内存里：大块数据放别处</title>
  <desc id="fig-zookeeper-21-desc">读快靠数据全在内存，所以 ZooKeeper 只留路径、地址与状态这类小东西，大块文件放到别的存储里。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/>
    </marker>
  </defs>

  <rect x="2" y="0" width="756" height="378" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">数据必须装在内存里：大块数据放别处</text>

  <rect x="25" y="62" width="710" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="84" font-size="12" fill="#1e40af" text-anchor="middle">读快正是靠数据全在内存</text>
  <text x="380" y="102" font-size="12" fill="#1e40af" text-anchor="middle">所以不能放大的东西进去</text>
  <rect x="25" y="210" width="341" height="125" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="394" y="210" width="341" height="125" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="40" y="230" width="311" height="90" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.5" y="252" font-size="12" fill="#166534" text-anchor="middle">这里只留路径、地址、状态</text>
  <text x="195.5" y="270" font-size="12" fill="#166534" text-anchor="middle">这类小东西</text>
  <text x="195.5" y="288" font-size="12" fill="#166534" text-anchor="middle">大块文件放别的存储</text>
  <text x="195.5" y="306" font-size="12" fill="#166534" text-anchor="middle">两者各管一段</text>
  <rect x="409" y="230" width="311" height="90" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="564.5" y="252" font-size="12" fill="#9d174d" text-anchor="middle">跨多个节点的事务不是事务</text>
  <text x="564.5" y="270" font-size="12" fill="#9d174d" text-anchor="middle">这是它最大的能力缺口</text>
  <text x="564.5" y="288" font-size="12" fill="#9d174d" text-anchor="middle">于是用 ready 当闸门</text>
  <text x="564.5" y="306" font-size="12" fill="#9d174d" text-anchor="middle">或者最后改一个指针</text>
  <path d="M300,121 C270,170 195,160 195,219" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M460,121 C490,170 565,160 565,219" fill="none" stroke="#ec4899" marker-end="url(#arrow-pink)"/>
  <text x="380" y="352" font-size="12" fill="#64748b" text-anchor="middle">下一讲要处理的，正是跨对象的事务</text>
</svg>
