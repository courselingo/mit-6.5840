<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221" role="img" aria-labelledby="fig-zookeeper-21-title fig-zookeeper-21-desc">
  <title id="fig-zookeeper-21-title">数据必须装在内存里：大块数据放别处</title>
  <desc id="fig-zookeeper-21-desc">读快靠数据全在内存，所以 ZooKeeper 只留路径、地址与状态这类小东西，大块文件放到别的存储里。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">数据必须装在内存里：大块数据放别处</text>

  <rect x="25" y="64" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="86" font-size="12" fill="#1e40af" text-anchor="middle">读快正是靠数据全在内存</text>
  <text x="135" y="104" font-size="12" fill="#1e40af" text-anchor="middle">所以不能放大的东西</text>
  <rect x="270" y="64" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="86" font-size="12" fill="#166534" text-anchor="middle">这里只留路径、地址、状态</text>
  <text x="380" y="104" font-size="12" fill="#166534" text-anchor="middle">这类小东西</text>
  <rect x="515" y="64" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">大块文件放别的存储</text>
  <text x="625" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">两者各管一段</text>
  <rect x="25" y="143" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="135" y="165" font-size="12" fill="#9d174d" text-anchor="middle">跨多个节点的事务不是事务</text>
  <text x="135" y="183" font-size="12" fill="#9d174d" text-anchor="middle">这是它最大的能力缺口</text>
  <rect x="270" y="143" width="220" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="165" font-size="12" fill="#b45309" text-anchor="middle">于是用 ready 当闸门</text>
  <text x="380" y="183" font-size="12" fill="#b45309" text-anchor="middle">或者最后改一个指针</text>
  <rect x="515" y="143" width="220" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="165" font-size="12" fill="#6b21a8" text-anchor="middle">下一讲要处理的</text>
  <text x="625" y="183" font-size="12" fill="#6b21a8" text-anchor="middle">正是跨对象的事务</text>
</svg>
