<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350"
     role="img" aria-labelledby="rpc-and-threads-2-title rpc-and-threads-2-desc">
  <title id="rpc-and-threads-2-title">第 2 讲在整门课里的位置</title>
  <desc id="rpc-and-threads-2-desc">第 1 讲是总论，第 3 讲起进入 GFS、Paxos、Raft；第 2 讲夹在中间，交出 goroutine 与 RPC 两块砖，后面每个实验都踩在它们上面。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="350" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第 2 讲在整门课里的位置</text>

  <rect x="22" y="68" width="220" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="132" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">第 1 讲</text>
  <text x="132" y="118" font-size="12" fill="#64748b" text-anchor="middle">总论：为什么分布式</text>

  <rect x="270" y="68" width="220" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">第 2 讲 · 本讲</text>
  <text x="380" y="118" font-size="12" fill="#64748b" text-anchor="middle">并发与 RPC</text>

  <rect x="518" y="68" width="220" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="628" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">第 3 讲起</text>
  <text x="628" y="118" font-size="12" fill="#64748b" text-anchor="middle">GFS、Paxos、Raft</text>

  <path d="M247,96 L 259,96" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M495,96 L 507,96" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M380,141 L 380,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="164" width="716" height="68" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="380" y="192" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">这一讲交出的两块砖</text>
  <text x="380" y="214" font-size="12" fill="#64748b" text-anchor="middle">goroutine 让一个程序同时推进很多件事，RPC 让消息在机器之间往返</text>

  <path d="M380,237 L 380,249" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="260" width="716" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="288" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">后面每个实验都踩在这两块砖上</text>
  <text x="380" y="310" font-size="12" fill="#64748b" text-anchor="middle">GFS 要让成百上千个客户端同时读写，Paxos 与 Raft 要把提案送到一台台机器上</text>
</svg>
