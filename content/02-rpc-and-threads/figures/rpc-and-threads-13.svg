<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350"
     role="img" aria-labelledby="rpc-and-threads-13-title rpc-and-threads-13-desc">
  <title id="rpc-and-threads-13-title">重发让一次逻辑操作变成两次真实执行</title>
  <desc id="rpc-and-threads-13-desc">客户端依次写 k = 10、k = 20，两次都报告成功；第一个请求只是慢，等不及的重发迟到落地，旧值 10 覆盖了 20，最终读出来是 10。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="350" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">重发让一次逻辑操作变成两次真实执行</text>

  <rect x="22" y="68" width="716" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="96" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">客户端依次写 k = 10、k = 20，两次都报告成功</text>
  <text x="380" y="118" font-size="12" fill="#64748b" text-anchor="middle">第一次请求只是慢，客户端等不及，重发了一次</text>

  <path d="M380,141 L 380,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="164" width="716" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="192" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">迟到的重发包落地，它带着旧值 10</text>
  <text x="380" y="214" font-size="12" fill="#64748b" text-anchor="middle">服务器照单执行：后到的 10 覆盖了先到的 20</text>

  <path d="M380,237 L 380,249" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="260" width="716" height="68" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="380" y="288" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">最终读出来是 10，不是 20</text>
  <text x="380" y="310" font-size="12" fill="#64748b" text-anchor="middle">一次逻辑操作因为重试变成两次真实执行，而两次都带着副作用</text>
</svg>
