<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" height="394"
     role="img" aria-labelledby="rpc-and-threads-11-title rpc-and-threads-11-desc">
  <title id="rpc-and-threads-11-title">Call() 的返回值与回复里的 Err 是两层错</title>
  <desc id="rpc-and-threads-11-desc">Call() 的返回值只说明有没有收到回复，收不到就是传输层失败，服务器执行没执行无从得知；业务失败写在回复的 Err 字段里，说明服务器确实收到并处理了请求。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="394" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Call() 的返回值与回复里的 Err 是两层错</text>

  <rect x="22" y="68" width="344" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="194" y="100" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">Call() 的返回值</text>
  <text x="194" y="118" font-size="12" fill="#64748b" text-anchor="middle">只说明这次调用有没有收到回复</text>
  <text x="194" y="136" font-size="12" fill="#64748b" text-anchor="middle">没收到就是传输层失败</text>

  <rect x="394" y="68" width="344" height="90" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="566" y="100" font-size="15" font-weight="600" fill="#6b21a8" text-anchor="middle">回复里的 Err 字段</text>
  <text x="566" y="118" font-size="12" fill="#64748b" text-anchor="middle">说明业务层是怎么失败的</text>
  <text x="566" y="136" font-size="12" fill="#64748b" text-anchor="middle">收到回复之后才谈得上它</text>

  <path d="M194,163 L 194,175" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,163 L 566,175" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="186" width="344" height="90" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="194" y="218" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">传输失败</text>
  <text x="194" y="236" font-size="12" fill="#64748b" text-anchor="middle">不知道服务器执行了没有</text>
  <text x="194" y="254" font-size="12" fill="#64748b" text-anchor="middle">业务结果根本无从谈起</text>

  <rect x="394" y="186" width="344" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="566" y="218" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">业务失败</text>
  <text x="566" y="236" font-size="12" fill="#64748b" text-anchor="middle">服务器确实收到并处理了请求</text>
  <text x="566" y="254" font-size="12" fill="#64748b" text-anchor="middle">只是拒绝了这一次</text>

  <rect x="22" y="304" width="716" height="68" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="380" y="332" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">两层错误互不覆盖，必须分开处理</text>
  <text x="380" y="354" font-size="12" fill="#64748b" text-anchor="middle">把「没收到回复」当成业务失败，就会做出错误的补偿动作</text>
</svg>
