<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372"
     role="img" aria-labelledby="rpc-and-threads-8-title rpc-and-threads-8-desc">
  <title id="rpc-and-threads-8-title">两种爬虫结构：谁持有那张「已抓取」表</title>
  <desc id="rpc-and-threads-8-desc">共享表加互斥锁的版本让所有 worker 抢同一把锁，靠临界区保证检查加标记不被打断；channel 版本让 coordinator 独占那张表，worker 只负责收发 URL，用不共享免掉加锁。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="372" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种爬虫结构：谁持有那张「已抓取」表</text>

  <rect x="22" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="194" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">共享表加互斥锁</text>
  <text x="194" y="118" font-size="12" fill="#64748b" text-anchor="middle">每个页面一个 goroutine，抢同一把锁</text>

  <rect x="394" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="566" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">channel 加 coordinator</text>
  <text x="566" y="118" font-size="12" fill="#64748b" text-anchor="middle">URL 走 channel，表只有一个读者</text>

  <path d="M194,141 L 194,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,141 L 566,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="164" width="344" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="194" y="196" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">临界区里做完检查加标记</text>
  <text x="194" y="214" font-size="12" fill="#64748b" text-anchor="middle">同一时刻只有一个线程进得去</text>
  <text x="194" y="232" font-size="12" fill="#64748b" text-anchor="middle">结束靠 WaitGroup 计数归零</text>

  <rect x="394" y="164" width="344" height="90" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="566" y="196" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">那张表根本没有被共享</text>
  <text x="566" y="214" font-size="12" fill="#64748b" text-anchor="middle">worker 抓完把 URL 列表发进 channel</text>
  <text x="566" y="232" font-size="12" fill="#64748b" text-anchor="middle">coordinator 见到新 URL 再起一个 worker</text>

  <rect x="22" y="282" width="716" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="380" y="310" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">两条路都能走通，选择取决于你怎么想问题</text>
  <text x="380" y="332" font-size="12" fill="#64748b" text-anchor="middle">状态用共享内存加锁，通信用 channel：课程对实验的建议</text>
</svg>
