<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" width="760" height="338"
     role="img" aria-labelledby="rpc-and-threads-8-title rpc-and-threads-8-desc">
  <title id="rpc-and-threads-8-title">两种爬虫结构：谁持有那张「已抓取」表</title>
  <desc id="rpc-and-threads-8-desc">上面是共享表加互斥锁：三个 goroutine 都指向同一张表，靠临界区保证检查加标记不被打断；下面是一条链：worker 把 URL 发进 channel，coordinator 独占那张表，再按新 URL 起新的 worker。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="338" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种爬虫结构：谁持有那张「已抓取」表</text>

  <rect x="22" y="62" width="716" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="380" y="84" font-size="12" fill="#9d174d" text-anchor="middle">共享表：已经抓过的 URL</text>
  <text x="380" y="102" font-size="12" fill="#9d174d" text-anchor="middle">所有 goroutine 都直接读写它，靠一把互斥锁保护</text>

  <path d="M132,139 L132,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M380,139 L380,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M628,139 L628,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="144" width="220" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="132" y="172" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">goroutine 1</text>

  <rect x="270" y="144" width="220" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="172" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">goroutine 2</text>

  <rect x="518" y="144" width="220" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="628" y="172" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">goroutine 3</text>

  <path d="M185,251 L197,251" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M371,251 L383,251" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M557,251 L569,251" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="217" width="158" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="101" y="245" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">worker 抓页面</text>
  <text x="101" y="267" font-size="12" fill="#64748b" text-anchor="middle">把 URL 列表发进 channel</text>

  <rect x="208" y="217" width="158" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="287" y="245" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">coordinator</text>
  <text x="287" y="267" font-size="12" fill="#64748b" text-anchor="middle">它是那张表唯一的读者</text>

  <rect x="394" y="217" width="158" height="68" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="473" y="245" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">表里没有就记下</text>
  <text x="473" y="267" font-size="12" fill="#64748b" text-anchor="middle">有就跳过，不重复抓</text>

  <rect x="580" y="217" width="158" height="68" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="659" y="245" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">见到新 URL 就再起</text>
  <text x="659" y="267" font-size="12" fill="#64748b" text-anchor="middle">表从来没有被共享</text>

  <text x="380" y="313" font-size="12" fill="#64748b" text-anchor="middle">上面靠临界区挡住竞争，下面靠干脆不共享，从根上没有竞争</text>
</svg>
