<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 321" width="760" height="321"
     role="img" aria-labelledby="rpc-and-threads-17-title rpc-and-threads-17-desc">
  <title id="rpc-and-threads-17-title">调用失败之后：能安全重试吗，三条路怎么选</title>
  <desc id="rpc-and-threads-17-desc">先问这次调用能不能安全重试。接口幂等就直接重试；不幂等就带一个唯一 ID，让服务端查去重表；两样都做不到，就只能承认「不确定」，让上层挑一个业务代价更小的默认动作。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="321" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">调用失败之后：能安全重试吗，三条路怎么选</text>

  <path d="M250,163 C 220,167 133,167 133,175" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M380,163 L380,175" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M510,163 C 540,167 627,167 627,175" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="68" width="716" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="99" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">先问：这个请求能安全重试吗</text>
  <text x="380" y="117" font-size="12" fill="#64748b" text-anchor="middle">要么接口本身幂等，要么重试时能带一个唯一 ID</text>
  <text x="380" y="135" font-size="12" fill="#64748b" text-anchor="middle">读操作、写成固定值、按版本号覆盖，通常都幂等</text>

  <rect x="22" y="186" width="222" height="113" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="133" y="229" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">幂等：直接重试</text>
  <text x="133" y="247" font-size="12" fill="#64748b" text-anchor="middle">重复执行与执行一次效果相同</text>
  <text x="133" y="265" font-size="12" fill="#64748b" text-anchor="middle">重试不需要额外成本</text>

  <rect x="269" y="186" width="222" height="113" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="229" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">不幂等：带唯一 ID</text>
  <text x="380" y="247" font-size="12" fill="#64748b" text-anchor="middle">服务端按 ID 查去重表，命中就跳过</text>
  <text x="380" y="265" font-size="12" fill="#64748b" text-anchor="middle">代价是那张表必须自己维护</text>

  <rect x="516" y="186" width="222" height="113" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="627" y="220" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">两样都做不到</text>
  <text x="627" y="238" font-size="12" fill="#9d174d" text-anchor="middle">就只能承认「不确定」</text>
  <text x="627" y="256" font-size="12" fill="#9d174d" text-anchor="middle">让上层挑一个代价更小的默认动作</text>
  <text x="627" y="274" font-size="12" fill="#9d174d" text-anchor="middle">宁可多查一次，不要多扣一次</text>
</svg>
