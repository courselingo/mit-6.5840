<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" height="394"
     role="img" aria-labelledby="rpc-and-threads-4-title rpc-and-threads-4-desc">
  <title id="rpc-and-threads-4-title">同一个进程里，线程共享什么、各自私有什么</title>
  <desc id="rpc-and-threads-4-desc">堆、全局变量和已打开的文件描述符由所有线程共享，通信不必经过内核；程序计数器、寄存器和栈是每个线程私有的，切换时各自保存。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="394" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一个进程里，线程共享什么、各自私有什么</text>

  <rect x="22" y="68" width="716" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="96" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">一个进程：所有线程共享同一块地址空间</text>
  <text x="380" y="118" font-size="12" fill="#64748b" text-anchor="middle">线程之间通信不必经过内核，这是效率的来源</text>

  <path d="M380,141 L 380,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="164" width="716" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="196" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">共享：堆、全局变量、已打开的文件描述符</text>
  <text x="380" y="214" font-size="12" fill="#64748b" text-anchor="middle">一个线程改了，别的线程立刻就能看到</text>
  <text x="380" y="232" font-size="12" fill="#64748b" text-anchor="middle">两个线程同时读写同一块内存，就有了竞态</text>

  <path d="M380,259 L 380,271" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="282" width="716" height="90" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="380" y="314" font-size="15" font-weight="600" fill="#6b21a8" text-anchor="middle">私有：程序计数器、寄存器、栈</text>
  <text x="380" y="332" font-size="12" fill="#64748b" text-anchor="middle">每个线程各有一份，线程切换时各自保存</text>
  <text x="380" y="350" font-size="12" fill="#64748b" text-anchor="middle">这部分不会互相干扰</text>
</svg>
