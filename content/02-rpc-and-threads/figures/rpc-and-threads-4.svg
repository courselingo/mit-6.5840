<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-rt-4-title fig-rt-4-desc">
  <title id="fig-rt-4-title">共享地址空间：共享了什么、私有什么，竞态从哪来</title>
  <desc id="fig-rt-4-desc">上排是分工：堆、全局变量与已打开的文件由所有线程共享，程序计数器、寄存器、栈各自私有。下排是代价：两个线程交错读改写同一个 n，各自都读到 0 又都写 1，结果 n 是 1 而不是 2。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">共享地址空间：共享了什么、私有什么，竞态从哪来</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">共享与私有的分工</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">两个线程交错读改写，同一个 n 只加了一次</text>

  <path d="M252,250 L264,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M489,250 L501,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="328" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="202" y="110" font-size="15" fill="#1e40af" text-anchor="middle">所有线程共享</text>
  <text x="202" y="132" font-size="12" fill="#1e40af" text-anchor="middle">堆、全局变量、已打开的文件</text>

  <rect x="394" y="82" width="328" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="558" y="110" font-size="15" fill="#6b21a8" text-anchor="middle">每个线程私有</text>
  <text x="558" y="132" font-size="12" fill="#6b21a8" text-anchor="middle">程序计数器、寄存器、栈</text>

  <rect x="38" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="142" y="244" font-size="15" fill="#b45309" text-anchor="middle">线程 A 读到 0</text>
  <text x="142" y="266" font-size="12" fill="#b45309" text-anchor="middle">准备写回 1</text>

  <rect x="275" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="244" font-size="15" fill="#b45309" text-anchor="middle">线程 B 也读到 0</text>
  <text x="379" y="266" font-size="12" fill="#b45309" text-anchor="middle">也写回 1</text>

  <rect x="512" y="216" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="616" y="244" font-size="15" fill="#9d174d" text-anchor="middle">结果 n = 1</text>
  <text x="616" y="266" font-size="12" fill="#9d174d" text-anchor="middle">期望是 2，少加了一次</text>
</svg>
