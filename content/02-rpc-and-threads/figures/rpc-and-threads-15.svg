<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372"
     role="img" aria-labelledby="rpc-and-threads-15-title rpc-and-threads-15-desc">
  <title id="rpc-and-threads-15-title">去重表让重试变得安全</title>
  <desc id="rpc-and-threads-15-desc">服务端按请求 ID 查去重表：表里没有记录就执行操作并把 ID 记下，执行与记录必须原子完成；表里已有记录就跳过执行、直接返回上次的结果。这张表还必须有界。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="372" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">去重表让重试变得安全</text>

  <rect x="22" y="68" width="716" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="96" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">请求到达，带着一个唯一 ID</text>
  <text x="380" y="118" font-size="12" fill="#64748b" text-anchor="middle">同一个逻辑操作的每次重发，都沿用同一个 ID</text>

  <path d="M380,141 C 380,148 194,146 194,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M380,141 C 380,148 566,146 566,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="164" width="344" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="194" y="196" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">表里没有这个 ID</text>
  <text x="194" y="214" font-size="12" fill="#64748b" text-anchor="middle">执行操作，然后把 ID 记进表里</text>
  <text x="194" y="232" font-size="12" fill="#64748b" text-anchor="middle">执行与记录必须原子完成</text>

  <rect x="394" y="164" width="344" height="90" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="566" y="196" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">表里已经有这个 ID</text>
  <text x="566" y="214" font-size="12" fill="#64748b" text-anchor="middle">跳过执行，直接返回上次的结果</text>
  <text x="566" y="232" font-size="12" fill="#64748b" text-anchor="middle">重复请求在这里被吸收掉</text>

  <path d="M194,259 C 194,266 380,264 380,271" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,259 C 566,266 380,264 380,271" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="282" width="716" height="68" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="380" y="310" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">去重表本身必须有界</text>
  <text x="380" y="332" font-size="12" fill="#64748b" text-anchor="middle">无界增长会变成慢性故障：内存被吃掉，查询越来越慢</text>
</svg>
