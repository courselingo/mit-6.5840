<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350"
     role="img" aria-labelledby="rpc-and-threads-3-title rpc-and-threads-3-desc">
  <title id="rpc-and-threads-3-title">并发与并行：结构问题与性能问题</title>
  <desc id="rpc-and-threads-3-desc">并发是多个任务在时间上重叠推进，单核靠轮转也能做到；并行是同一时刻真正同时执行，必须有多个核，核数决定上限。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="350" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">并发与并行：结构问题与性能问题</text>

  <rect x="22" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="194" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">并发 concurrency</text>
  <text x="194" y="118" font-size="12" fill="#64748b" text-anchor="middle">多个任务在时间上重叠推进</text>

  <rect x="394" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="566" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">并行 parallelism</text>
  <text x="566" y="118" font-size="12" fill="#64748b" text-anchor="middle">同一时刻真的在同时执行</text>

  <path d="M194,141 L 194,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,141 L 566,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="164" width="344" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="194" y="192" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">单核也能并发</text>
  <text x="194" y="214" font-size="12" fill="#64748b" text-anchor="middle">把小片时间轮转给各个任务</text>

  <rect x="394" y="164" width="344" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="566" y="192" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">单核不可能并行</text>
  <text x="566" y="214" font-size="12" fill="#64748b" text-anchor="middle">并行要多个核，核数决定上限</text>

  <rect x="22" y="260" width="716" height="68" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="380" y="288" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">并发是结构问题，并行是性能问题</text>
  <text x="380" y="310" font-size="12" fill="#64748b" text-anchor="middle">前者决定怎么把程序拆成多个活动，后者决定到底能快多少</text>
</svg>
