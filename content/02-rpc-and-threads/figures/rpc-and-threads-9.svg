<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446"
     role="img" aria-labelledby="rpc-and-threads-9-title rpc-and-threads-9-desc">
  <title id="rpc-and-threads-9-title">一次 RPC 要穿过哪几层</title>
  <desc id="rpc-and-threads-9-desc">客户端应用调 stub，stub 编组参数后交给 RPC 库过网络；服务端 RPC 库把字节交给 dispatcher，dispatcher 解组并调用处理函数，回复沿原路返回。调用者只看得到第一层。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="446" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次 RPC 要穿过哪几层</text>

  <rect x="22" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="194" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">客户端应用</text>
  <text x="194" y="118" font-size="12" fill="#64748b" text-anchor="middle">像调本地函数一样调用它</text>

  <rect x="394" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="566" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">服务端处理函数</text>
  <text x="566" y="118" font-size="12" fill="#64748b" text-anchor="middle">访问共享状态时必须自己加锁</text>

  <path d="M194,141 L 194,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,159 L 566,147" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="164" width="344" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="194" y="192" font-size="15" font-weight="600" fill="#6b21a8" text-anchor="middle">客户端 stub</text>
  <text x="194" y="214" font-size="12" fill="#64748b" text-anchor="middle">编组参数，发请求，解组回复</text>

  <rect x="394" y="164" width="344" height="68" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="566" y="192" font-size="15" font-weight="600" fill="#6b21a8" text-anchor="middle">dispatcher</text>
  <text x="566" y="214" font-size="12" fill="#64748b" text-anchor="middle">按方法名找到处理函数</text>

  <path d="M194,237 L 194,249" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,255 L 566,243" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="260" width="344" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="194" y="288" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">RPC 库</text>
  <text x="194" y="310" font-size="12" fill="#64748b" text-anchor="middle">把字节序列交给网络</text>

  <rect x="394" y="260" width="344" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="566" y="288" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">RPC 库</text>
  <text x="566" y="310" font-size="12" fill="#64748b" text-anchor="middle">收到字节，交给 dispatcher</text>

  <path d="M371,280 L 383,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M389,306 L 377,306" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="356" width="716" height="68" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="380" y="384" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">编组、解组、请求与回复的配对，全被这两层的替身吃掉</text>
  <text x="380" y="406" font-size="12" fill="#64748b" text-anchor="middle">调用者只看得见第一层，所以才会觉得「跟调本地函数一样」</text>
</svg>
