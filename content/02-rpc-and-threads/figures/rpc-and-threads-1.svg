<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" height="394"
     role="img" aria-labelledby="rpc-and-threads-1-title rpc-and-threads-1-desc">
  <title id="rpc-and-threads-1-title">本地调用与远程调用：多出来的第三种状态</title>
  <desc id="rpc-and-threads-1-desc">本地函数调用只有正常返回和抛出异常两条分支；跨机器 RPC 也有两条，但在客户端这边表现为拿到回复或者拿到一个错误，此外还多出第三种：客户端只看到超时，既不知道请求是否送到，也不知道服务端是否执行过。前两条都说明对话走完了，第三种没有。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="394" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">本地调用与远程调用：多出来的第三种状态</text>

  <rect x="22" y="62" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="194" y="90" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">本地函数调用</text>
  <text x="194" y="112" font-size="12" fill="#64748b" text-anchor="middle">同一个地址空间，参数就在手边</text>

  <rect x="394" y="62" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="566" y="90" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">跨机器 RPC</text>
  <text x="566" y="112" font-size="12" fill="#64748b" text-anchor="middle">参数编组成字节，过网络再等回复</text>

  <path d="M194,135 C 194,143 101,142 101,147" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M194,135 C 194,143 287,142 287,147" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,135 C 566,143 473,142 473,147" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,135 C 566,143 659,142 659,147" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="158" width="158" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="101" y="186" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">正常返回</text>

  <rect x="208" y="158" width="158" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="287" y="186" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">抛出异常</text>

  <rect x="394" y="158" width="158" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="473" y="186" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">正常返回</text>

  <rect x="580" y="158" width="158" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="659" y="186" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">返回错误</text>

  <path d="M101,208 C 101,216 194,214 194,220" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M287,208 C 287,216 194,214 194,220" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M473,208 C 473,216 566,214 566,220" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M659,208 C 659,216 566,214 566,220" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="231" width="344" height="68" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="194" y="259" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">本地没有这一档</text>
  <text x="194" y="281" font-size="12" fill="#64748b" text-anchor="middle">结局是二元的，不存在「不知道」</text>

  <rect x="394" y="231" width="344" height="68" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="566" y="259" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">上面两种之外，还有第三种：不知道</text>
  <text x="566" y="281" font-size="12" fill="#64748b" text-anchor="middle">超时在调用方只是一个 timeout</text>

  <rect x="22" y="327" width="716" height="45" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="380" y="355" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">本讲后面所有机制，都在处理这第三种状态</text>
</svg>
