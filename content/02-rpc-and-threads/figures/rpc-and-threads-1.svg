<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380"
     role="img" aria-labelledby="rpc-and-threads-1-title rpc-and-threads-1-desc">
  <title id="rpc-and-threads-1-title">共享地址空间为什么会出竞态</title>
  <desc id="rpc-and-threads-1-desc">线程 A 与线程 B 各自在同一块共享内存上执行读、加、写，两次读改写交错后只生效一次，结果 n 是 1 而不是 2。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">共享地址空间为什么会出竞态</text>

  <rect x="22" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="194" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">线程 A</text>
  <text x="194" y="118" font-size="12" fill="#64748b" text-anchor="middle">读到旧值 n = 0，准备写 1</text>

  <rect x="394" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="566" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">线程 B</text>
  <text x="566" y="118" font-size="12" fill="#64748b" text-anchor="middle">也读到旧值 n = 0，也写 1</text>

  <path d="M194,141 C 194,148 330,146 330,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,141 C 566,148 430,146 430,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="164" width="400" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="192" font-size="15" font-weight="600" fill="#1e40af" text-anchor="middle">共享地址空间：同一个变量 n</text>
  <text x="380" y="214" font-size="12" fill="#64748b" text-anchor="middle">两个线程读写同一块内存，操作会交错</text>

  <path d="M380,237 L 380,249" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="260" width="300" height="68" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="380" y="288" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">结果 n = 1，但期望是 2</text>
  <text x="380" y="310" font-size="12" fill="#64748b" text-anchor="middle">两次读改写只生效了一次</text>

  <text x="380" y="356" font-size="12" fill="#64748b" text-anchor="middle">共享省掉了内核这一层，代价是两个线程的读写顺序变得不可预期</text>
</svg>
