<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-rt-12-title fig-rt-12-desc">
  <title id="fig-rt-12-title">超时之后客户端不知道什么，以及迟到带来的覆盖</title>
  <desc id="fig-rt-12-desc">上排是四种无法区分的原因：请求没送到、收到但还在排队、回复丢在半路、服务端已崩溃。下排讲的是两次不同的写：客户端写 10 又写 20 且两次都报告成功，但迟到先到，最初那个原包迟到落地，后到的 10 覆盖了 20。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">超时之后客户端不知道什么，以及迟到打乱的顺序</text>

  <rect x="22" y="56" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="70" font-size="12" fill="#64748b" text-anchor="middle">客户端眼里只有一种现象：没等到回复</text>

  <rect x="22" y="190" width="716" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="204" font-size="12" fill="#64748b" text-anchor="middle">迟到把顺序打乱：两次都报成功，结果却谁也认不出</text>

  <path d="M252,250 L264,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M489,250 L501,250" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="38" y="82" width="150" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="113" y="110" font-size="15" fill="#9d174d" text-anchor="middle">① 没送到</text>
  <text x="113" y="132" font-size="12" fill="#9d174d" text-anchor="middle">服务端没收到</text>

  <rect x="216" y="82" width="150" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="291" y="110" font-size="15" fill="#9d174d" text-anchor="middle">② 还在处理</text>
  <text x="291" y="132" font-size="12" fill="#9d174d" text-anchor="middle">执行完前超时</text>

  <rect x="394" y="82" width="150" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="469" y="110" font-size="15" fill="#9d174d" text-anchor="middle">③ 回复丢了</text>
  <text x="469" y="132" font-size="12" fill="#9d174d" text-anchor="middle">其实已执行完</text>

  <rect x="572" y="82" width="150" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="647" y="110" font-size="15" fill="#9d174d" text-anchor="middle">④ 服务端崩了</text>
  <text x="647" y="132" font-size="12" fill="#9d174d" text-anchor="middle">执行前或执行中</text>

  <rect x="38" y="216" width="209" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="142" y="244" font-size="15" fill="#1e40af" text-anchor="middle">先写 10，再写 20</text>
  <text x="142" y="266" font-size="12" fill="#1e40af" text-anchor="middle">两次都报告成功</text>

  <rect x="275" y="216" width="209" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="244" font-size="15" fill="#b45309" text-anchor="middle">第一次只是慢</text>
  <text x="379" y="266" font-size="12" fill="#b45309" text-anchor="middle">最初那个原包迟到落地</text>

  <rect x="512" y="216" width="209" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="616" y="244" font-size="15" fill="#9d174d" text-anchor="middle">后到的 10 覆盖 20</text>
  <text x="616" y="266" font-size="12" fill="#9d174d" text-anchor="middle">最终读出来是 10</text>
</svg>
