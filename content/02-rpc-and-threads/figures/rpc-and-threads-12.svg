<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304"
     role="img" aria-labelledby="rpc-and-threads-12-title rpc-and-threads-12-desc">
  <title id="rpc-and-threads-12-title">一次 RPC 的失败窗口：超时之后客户端不知道什么</title>
  <desc id="rpc-and-threads-12-desc">客户端发出请求后只看到「没有回复」这一种现象，但背后可能是请求没送到、服务端还在处理、回复丢了或者服务端已经崩溃，四种原因在调用方眼里完全一样。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="304" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次 RPC 的失败窗口：超时之后客户端不知道什么</text>

  <rect x="22" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="194" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">客户端</text>
  <text x="194" y="118" font-size="12" fill="#64748b" text-anchor="middle">发出请求，一直等到超时</text>

  <rect x="394" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="566" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">服务端</text>
  <text x="566" y="118" font-size="12" fill="#64748b" text-anchor="middle">收到请求，执行，回发结果</text>

  <path d="M371,96 L 383,96" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M389,118 L 377,118" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="152" width="716" height="127" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>

  <rect x="44" y="164" width="147" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="117.5" y="192" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">① 请求没送到</text>
  <text x="117.5" y="214" font-size="12" fill="#64748b" text-anchor="middle">服务端根本没收到</text>

  <rect x="219" y="164" width="147" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="292.5" y="192" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">② 收到，在处理</text>
  <text x="292.5" y="214" font-size="12" fill="#64748b" text-anchor="middle">执行完之前就超时</text>

  <rect x="394" y="164" width="147" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="467.5" y="192" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">③ 回复丢在半路</text>
  <text x="467.5" y="214" font-size="12" fill="#64748b" text-anchor="middle">服务端其实执行完了</text>

  <rect x="569" y="164" width="147" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="642.5" y="192" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">④ 服务端已崩溃</text>
  <text x="642.5" y="214" font-size="12" fill="#64748b" text-anchor="middle">执行前或执行中都可能</text>

  <text x="380" y="264" font-size="12" fill="#64748b" text-anchor="middle">客户端眼里只有一种现象：没等到回复 —— 这四种原因无法区分</text>
</svg>

