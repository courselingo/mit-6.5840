<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276"
     role="img" aria-labelledby="rpc-and-threads-6-title rpc-and-threads-6-desc">
  <title id="rpc-and-threads-6-title">等待关系接成环就是死锁</title>
  <desc id="rpc-and-threads-6-desc">甲持有锁 A 等 B，乙持有锁 B 等 A，两条等待箭头连成一个环；环上谁都不肯先放锁，程序永远卡住。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="276" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">等待关系接成环就是死锁</text>

  <rect x="22" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="194" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">甲：持有锁 A，等锁 B</text>
  <text x="194" y="118" font-size="12" fill="#64748b" text-anchor="middle">拿到 A 之后才去要 B</text>

  <rect x="394" y="68" width="344" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="566" y="96" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">乙：持有锁 B，等锁 A</text>
  <text x="566" y="118" font-size="12" fill="#64748b" text-anchor="middle">拿到 B 之后才去要 A</text>

  <path d="M371,88 L 383,88" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M389,114 L 377,114" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="164" width="716" height="90" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="380" y="196" font-size="15" font-weight="600" fill="#9d174d" text-anchor="middle">等待箭头连成一个环</text>
  <text x="380" y="214" font-size="12" fill="#64748b" text-anchor="middle">甲等乙放 B，乙等甲放 A，两边都不肯先松手</text>
  <text x="380" y="232" font-size="12" fill="#64748b" text-anchor="middle">谁都动不了，程序永远卡住</text>
</svg>
