<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350"
     role="img" aria-labelledby="fig-rt-6-title fig-rt-6-desc">
  <title id="fig-rt-6-title">锁粒度的两端，以及等待接成环的死锁</title>
  <desc id="fig-rt-6-desc">上排是粒度三档：范围太小则检查与修改被拆成两步，中间的粒度让检查加标记一次做完，范围太大则并发退化成串行。下排是死锁的环：甲持锁 A、在等乙手里的 B，乙持锁 B、在等甲手里的 A，两条等待互相指向对方，接成一个环，环上谁都不肯先放锁。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="350" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">锁粒度的两端，以及等待接成环的死锁</text>

  <rect x="22" y="82" width="220" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="132" y="110" font-size="15" fill="#9d174d" text-anchor="middle">范围太小</text>
  <text x="132" y="132" font-size="12" fill="#9d174d" text-anchor="middle">检查与修改被拆成两步</text>

  <rect x="270" y="82" width="220" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="110" font-size="15" fill="#166534" text-anchor="middle">中间的粒度</text>
  <text x="380" y="132" font-size="12" fill="#166534" text-anchor="middle">检查加标记一次做完</text>

  <rect x="518" y="82" width="220" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="628" y="110" font-size="15" fill="#9d174d" text-anchor="middle">范围太大</text>
  <text x="628" y="132" font-size="12" fill="#9d174d" text-anchor="middle">并发退化成串行</text>

  <path d="M370,210 L384,210" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M390,232 L376,232" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="115" y="178" width="250" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="240" y="206" font-size="15" fill="#b45309" text-anchor="middle">甲</text>
  <text x="240" y="228" font-size="12" fill="#b45309" text-anchor="middle">持锁 A，在等 B</text>

  <rect x="395" y="178" width="250" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="520" y="206" font-size="15" fill="#b45309" text-anchor="middle">乙</text>
  <text x="520" y="228" font-size="12" fill="#b45309" text-anchor="middle">持锁 B，在等 A</text>

  <rect x="22" y="274" width="716" height="54" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="296" font-size="12" fill="#166534" text-anchor="middle">两条箭头互相指向对方，就是那个环：甲等 B、B 在乙手里，乙等 A、A 在甲手里</text>
  <text x="380" y="314" font-size="12" fill="#166534" text-anchor="middle">判断死锁就是找这样一圈等待；环上谁都不肯先放锁，谁都动不了</text>
</svg>
