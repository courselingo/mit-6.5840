# CourseLingo 论文登记表
#
# 6.824 的每一讲都围绕一篇论文。**论文的授权与课程无关** ——
# 课程是 CC BY 3.0 US，但论文的版权在出版社（ACM / USENIX），不能类推。
#
# ★ 结论（核实于 2026-09-28，详见平台仓库 docs/paper-licensing.md）：
#   - ACM 论文：印在论文上的声明要求「再发布需事先专门许可」→ 翻译需走 permissions@acm.org
#   - USENIX 论文：可免费阅读（部分标 Open Access），但**未找到复用/翻译条款**
#   → 因此本课程所有论文一律写 guide（我们自己撰写的导读），不做全文翻译。
#
# 一旦某篇拿到书面授权，把该篇的 verified / allows_translation 改为 true 即可，不需要改代码。

